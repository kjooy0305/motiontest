<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 스크롤바 숨기기 */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }

    body {
      font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── 뷰 전환 ── */
    .view {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .view.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ── 홈 ── */
    .home-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid #e4e6ea;
      padding: 18px 20px 14px;
    }
    .home-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #111;
      letter-spacing: -0.5px;
    }
    .home-header p {
      font-size: 13px;
      color: #999;
      margin-top: 2px;
    }

    .btn-list {
      padding: 12px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-item {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 0 20px;
      height: 56px;
      background: #fff;
      border: 1px solid #e4e6ea;
      border-radius: 14px;
      cursor: pointer;
      text-align: left;
      transition: background .12s, box-shadow .12s, transform .1s;
      gap: 14px;
    }
    .btn-item:hover {
      background: #f8f9ff;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
    }
    .btn-item:active { transform: scale(0.985); background: #f0f1ff; }

    .btn-num {
      font-size: 18px;
      font-weight: 800;
      color: #3b5bdb;
      min-width: 36px;
    }
    .btn-label {
      font-size: 14px;
      color: #555;
      flex: 1;
    }
    .btn-chevron {
      font-size: 18px;
      color: #ccc;
      line-height: 1;
    }

    /* ── 상세 페이지 ── */
    .detail-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid #e4e6ea;
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back-btn {
      background: #f0f2f5;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      transition: background .12s;
      flex-shrink: 0;
    }
    .back-btn:hover { background: #e4e6ea; }

    .detail-title {
      font-size: 17px;
      font-weight: 700;
      color: #111;
    }

    .detail-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .detail-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .empty-msg {
      text-align: center;
      color: #ccc;
      user-select: none;
    }
    .empty-msg span {
      display: block;
      font-size: 48px;
      margin-bottom: 10px;
    }
    .empty-msg p {
      font-size: 14px;
    }
  </style>
</head>
<body>

<!-- 홈 뷰 -->
<div class="view" id="view-home">
  <div class="home-header">
    <h1>Motion Test</h1>
    <p>테스트 항목을 선택하세요</p>
  </div>
  <div class="btn-list" id="btn-list"></div>
</div>

<!-- 상세 뷰 (flex column, overflow hidden → iframe이 스크롤 담당) -->
<div class="view" id="view-detail" style="overflow:hidden;display:flex;flex-direction:column;">
  <div class="detail-header">
    <button class="back-btn" id="back-btn">‹</button>
    <span class="detail-title" id="detail-title"></span>
  </div>
  <div class="detail-content" id="detail-content">
    <div class="empty-msg">
      <span>🧪</span>
      <p>아직 내용이 없습니다</p>
    </div>
  </div>
</div>

<script>
  // ── 페이지 정의 (번호: { label, url }) ─────────────────────
  // url이 있으면 iframe으로 임베드, 없으면 빈 페이지
  const PAGES = {
    1: { label: '콘웨이의 생명실험',       url: 'https://kjooy0305.github.io/lifegame/' },
    2: { label: '러시안 룰렛 실패 버전',   url: 'https://kjooy0305.github.io/vibe2026/' },
  };

  function pageLabel(n) {
    return PAGES[n] ? PAGES[n].label : `테스트 ${n}`;
  }

  // ── 버튼 목록 생성 ─────────────────────────────────────────
  const list = document.getElementById('btn-list');
  for (let i = 1; i <= 100; i++) {
    const btn = document.createElement('button');
    btn.className = 'btn-item';
    btn.innerHTML =
      `<span class="btn-num">${i}</span>` +
      `<span class="btn-label">${pageLabel(i)}</span>` +
      `<span class="btn-chevron">›</span>`;
    btn.addEventListener('click', () => { location.hash = i; });
    list.appendChild(btn);
  }

  // ── 뒤로가기 ──────────────────────────────────────────────
  document.getElementById('back-btn').addEventListener('click', () => {
    location.hash = '';
  });

  // ── 라우팅 ────────────────────────────────────────────────
  function render() {
    const n = parseInt(location.hash.replace('#', ''));
    const isDetail = n >= 1 && n <= 100;

    document.getElementById('view-home').classList.toggle('active', !isDetail);
    document.getElementById('view-detail').classList.toggle('active', isDetail);

    if (isDetail) {
      const label = pageLabel(n);
      document.getElementById('detail-title').textContent = label;
      document.title = `${label} — Motion Test`;

      const content = document.getElementById('detail-content');
      if (PAGES[n] && PAGES[n].url) {
        content.innerHTML =
          `<iframe class="detail-iframe" src="${PAGES[n].url}" allowfullscreen></iframe>`;
      } else {
        content.innerHTML =
          `<div class="empty-msg"><span>🧪</span><p>아직 내용이 없습니다</p></div>`;
      }
    } else {
      document.title = 'Motion Test';
    }
  }

  window.addEventListener('hashchange', render);
  render();
</script>
</body>
</html>
