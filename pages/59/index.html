function quizPrev(){if(QZ.pos>0){QZ.pos--;renderQuiz();}}
function quizNext(){if(QZ.pos<QZ.list.length-1){QZ.pos++;renderQuiz();}}
function quizJump(){
  const v=parseInt(document.getElementById('quiz-jump').value,10);
  if(!v||v<1||v>QUIZ_PROBLEMS.length) return;
  const i=QZ.list.indexOf(v-1);
  if(i<0){
    document.getElementById('quiz-cat').value='all';
    QZ.list=QUIZ_PROBLEMS.map((p,k)=>k);
    QZ.pos=v-1;
  } else QZ.pos=i;
  renderQuiz();
}

/* ── 단계별 힌트 ── */
function quizHint(level){
  const p=curProblem();
  const box=document.getElementById('quiz-hint-box');
  const first=p.pv[0];
  const board=boardClone(p.board),hands=handsClone(p.hands);
  const kg=findKing(board,'white');
  let esc=0;
  for(const d of DIRS8){
    const r=kg[0]+d[0],c=kg[1]+d[1];
    if(!inB(r,c)) continue;
    const t=board[r][c];
    if(t&&t.side==='white') continue;
    board[r][c]={type:'king',side:'white',promoted:false};
    board[kg[0]][kg[1]]=null;
    const bad=isAttacked(board,r,c,'black');
    board[kg[0]][kg[1]]={type:'king',side:'white',promoted:false};
    board[r][c]=t;
    if(!bad) esc++;
  }
  if(level===1&&QZ.hintLv<1){
    QZ.hintLv=1;
    const isDrop=first.type==='drop';
    const pieceKR=isDrop?PIECE_KR[first.dropType]:krName(p.board[first.fr][first.fc]);
    const pieceJP=isDrop?PIECE_JP[first.dropType]:jpName(p.board[first.fr][first.fc]);
    let txt=`후수 왕은 <b>${sqName(kg[0],kg[1])}</b>에 있고, 지금 도망칠 수 있는 칸이 <b>${esc}곳</b> 있습니다. `;
    txt+=isDrop
      ? `첫 수는 <b>손패를 두는 수(打)</b>입니다. 손패에 있는 말 중 <b>${pieceJP}(${pieceKR})</b>${J.eul(pieceKR)} 어디에 두면 저 ${esc}곳이 한꺼번에 지워질지 생각해 보세요.`
      : `첫 수는 <b>판 위의 말을 움직이는 수</b>입니다. 왕의 도망칸을 지우면서 동시에 왕수를 걸 수 있는 말은 <b>${pieceJP}(${pieceKR})</b>입니다.`;
    if(p.ply>1) txt+=` <br>${p.ply}수 문제이므로, 첫 수로 바로 외통이 나지는 않습니다. <b>왕을 원하는 칸으로 몰아가는</b> 수를 찾으세요.`;
    txt+=`<br><span class="neutral">요령: 왕수부터 걸지 말고, <b>도망칸을 먼저 세어</b> 그 칸들을 지우는 말을 찾으세요.</span>`;
    box.innerHTML+=`<div class="hint-card lv1"><b>💡 간접 힌트</b><br>${txt}</div>`;
    document.getElementById('qb-h1').disabled=true;
    return;
  }
  if(level===2&&QZ.hintLv<2){
    QZ.hintLv=Math.max(QZ.hintLv,2);
    const isDrop=first.type==='drop';
    let txt;
    if(isDrop){
      const n=PIECE_KR[first.dropType];
      txt=`손패의 <b>${PIECE_JP[first.dropType]}(${n})</b>${J.eul(n)} <b>${sqName(first.tr,first.tc)}</b>에 두세요.`;
    } else {
      const pc=p.board[first.fr][first.fc];
      txt=`<b>${sqName(first.fr,first.fc)}</b>의 <b>${pcName(pc)}</b>${J.eul(krName(pc))} <b>${sqName(first.tr,first.tc)}</b>로 옮기세요.`;
      if(first.promote&&!pc.promoted) txt+=` 이때 <b>승격(成)</b>해야 합니다.`;
      else if(canPromote(pc,first.fr,first.tr)&&!first.promote) txt+=` 이때는 <b>승격하지 않는 것(不成)</b>이 정답입니다.`;
    }
    if(p.ply>1) txt+=`<br>첫 수만 알려 드립니다. 이후 후수의 응수를 보고 나머지 ${Math.ceil(p.ply/2)-1}수는 직접 찾아보세요.`;
    box.innerHTML+=`<div class="hint-card lv2"><b>🔍 직접 힌트</b><br>${txt}</div>`;
    document.getElementById('qb-h1').disabled=true;
    document.getElementById('qb-h2').disabled=true;
    return;
  }
  if(level===1) box.innerHTML+=`<div class="hint-card lv1"><span class="neutral">이미 간접 힌트를 확인했습니다.</span></div>`;
}

/* ── 정답 + 상세 해설 ── */
function quizShowAnswer(){
  const p=curProblem();
  QZ.answerShown=true;
  document.getElementById('qb-h1').disabled=true;
  document.getElementById('qb-h2').disabled=true;
  document.getElementById('qb-ans').disabled=true;

  // 문제 초기 상태에서 PV를 재생하며 기보 문자열 만들기
  const b=boardClone(p.board),h=handsClone(p.hands);
  const lines=[];
  for(let i=0;i<p.pv.length;i++){
    const mv=p.pv[i];
    const nm=moveName(mv,b);
    const kr=moveNameKR(mv,b);
    const who=i%2===0?'선수':'후수';
    const cls=i%2===0?'#f0e0b0':'#b8a8d0';
    lines.push(`<div><span style="color:${cls}">${i+1}. ${nm}</span> <span style="color:#8a8a7a;font-size:.85rem">— ${who}: ${kr}</span></div>`);
    makeMove(b,h,mv);
  }
  // 최종 국면 해설
  const expl=explainMate(b,h,'white');
  const html=`<div class="ans-card">
    <h4>📖 정답 수순 (${p.ply}수 외통)</h4>
    <div class="ans-pv">${lines.join('')}</div>
    ${expl}
    <div class="sub">▶ <b>정답 재생</b>을 누르면 판 위에서 한 수씩 진행됩니다.</div>
    <div style="margin-top:8px"><button onclick="quizPlayAnswer()" style="padding:7px 14px;border:1px solid #4a3d22;border-radius:8px;background:#232a30;color:#c8d0a0;cursor:pointer">▶ 정답 재생</button></div>
  </div>`;
  document.getElementById('quiz-answer-box').innerHTML=html;
  setQuizStatus('<span class="neutral">정답을 확인했습니다. ↺ 처음으로 를 눌러 직접 두어 보세요.</span>');
}

function quizPlayAnswer(){
  const p=curProblem();
  QZ.board=boardClone(p.board); QZ.hands=handsClone(p.hands);
  QZ.step=0; QZ.sel=null; QZ.targets=[]; QZ.lastMove=null; QZ.playing=true; QZ.done=true;
  renderQuizBoard(); renderQuizHands();
  let i=0;
  const step=()=>{
    if(i>=p.pv.length){
      QZ.playing=false;
      setQuizStatus('<span class="correct">▶ 재생 완료 — 詰み(외통수)</span>');
      return;
    }
    const mv=p.pv[i];
    const nm=moveName(mv,QZ.board);
    makeMove(QZ.board,QZ.hands,mv);
    QZ.lastMove=mv;
    renderQuizBoard(); renderQuizHands();
    setQuizStatus(`<span class="neutral">▶ 재생 중… ${i+1}. ${nm}</span>`);
    i++;
    setTimeout(step,850);
  };
  setTimeout(step,300);
}

/** 최종 외통 국면이 왜 외통인지 한 칸씩 설명 */
function explainMate(board,hands,loser){
  const winner=other(loser);
  const kg=findKing(board,loser);
  if(!kg) return '<div class="sub">왕장을 찾을 수 없습니다.</div>';
  const kr=kg[0],kc=kg[1];
  const checkers=attackersOf(board,kr,kc,winner);
  const wName=p=>pcName(p);
  const wEul=p=>pcName(p)+J.eul(krName(p));
  const wIga=p=>pcName(p)+J.iga(krName(p));
  const wRo =p=>pcName(p)+J.ro(krName(p));

  let h=`<h4 style="margin-top:12px">🔎 왜 외통수인가</h4>`;
  h+=`<div style="margin-bottom:6px">후수 왕은 <b>${sqName(kr,kc)}</b>. 왕수를 건 말: `+
     checkers.map(a=>`<b>${sqName(a[0],a[1])}의 ${wName(board[a[0]][a[1]])}</b>`).join(', ')+`</div>`;

  // ① 도망
  h+=`<div style="margin-top:8px"><b>① 도망칠 수 없다</b></div><ul>`;
  for(const d of DIRS8){
    const r=kr+d[0],c=kc+d[1];
    if(!inB(r,c)){h+=`<li>${dirName(d)} — 판 밖</li>`;continue;}
    const t=board[r][c];
    if(t&&t.side===loser){
      h+=`<li><b>${sqName(r,c)}</b>(${dirName(d)}) — 자기 말 ${wIga(t)} 막고 있어 갈 수 없음</li>`;
      continue;
    }
    // 왕을 그 칸으로 옮겨 보고 공격 여부 확인
    const save=board[r][c];
    board[r][c]=board[kr][kc]; board[kr][kc]=null;
    const atk=attackersOf(board,r,c,winner);
    board[kr][kc]=board[r][c]; board[r][c]=save;
    const who=atk.map(a=>{
      const pp=board[a[0]][a[1]];
      return pp?`${sqName(a[0],a[1])}의 ${wName(pp)}`:sqName(a[0],a[1]);
    }).join(' · ');
    if(atk.length) h+=`<li><b>${sqName(r,c)}</b>(${dirName(d)}) — ${t?`${wEul(t)} 잡고 들어가도 `:''}<b>${who}</b>의 공격권이라 불가</li>`;
    else h+=`<li><b>${sqName(r,c)}</b>(${dirName(d)}) — <span style="color:#c86060">이 칸은 비어 있음(검증 오류)</span></li>`;
  }
  h+=`</ul>`;

  // ② 잡기
  h+=`<div style="margin-top:8px"><b>② 왕수를 건 말을 잡을 수 없다</b></div><ul>`;
  for(const ck of checkers){
    const cp=board[ck[0]][ck[1]];
    const cands=attackersOf(board,ck[0],ck[1],loser);
    if(!cands.length){
      h+=`<li><b>${sqName(ck[0],ck[1])}의 ${wName(cp)}</b> — 이 말을 공격하고 있는 후수 말이 하나도 없음</li>`;
      continue;
    }
    for(const cd of cands){
      const pp=board[cd[0]][cd[1]];
      const legal=getLegalPieceMoves(board,cd[0],cd[1]).some(t=>t[0]===ck[0]&&t[1]===ck[1]);
      if(legal){
        h+=`<li><b>${sqName(cd[0],cd[1])}의 ${wRo(pp)}</b> 잡을 수는 있지만, 잡아도 다른 왕수가 남아 외통이 풀리지 않음</li>`;
      } else if(pp.type==='king'){
        // 왕으로 잡기 = 그 칸이 지켜지고 있음
        const save=board[ck[0]][ck[1]];
        board[ck[0]][ck[1]]=board[cd[0]][cd[1]]; board[cd[0]][cd[1]]=null;
        const guards=attackersOf(board,ck[0],ck[1],winner);
        board[cd[0]][cd[1]]=board[ck[0]][ck[1]]; board[ck[0]][ck[1]]=save;
        const gtxt=guards.map(g=>{const gp=board[g[0]][g[1]];return gp?`${sqName(g[0],g[1])}의 ${wName(gp)}`:sqName(g[0],g[1])}).join(' · ');
        h+=`<li>왕으로 <b>${sqName(ck[0],ck[1])}의 ${wName(cp)}</b>${J.eul(krName(cp))} 잡으려 해도 <b>${gtxt||'다른 말'}</b>${J.iga(gtxt||'다른 말')} 지키고 있어 불가</li>`;
      } else {
        h+=`<li><b>${sqName(cd[0],cd[1])}의 ${wRo(pp)}</b> 잡으면 자기 왕이 다른 말에 잡히므로 불가(핀)</li>`;
      }
    }
  }
  h+=`</ul>`;

  // ③ 막기
  const blocks=[];
  if(checkers.length===1){
    const ck=checkers[0];
    const dr=Math.sign(kr-ck[0]),dc=Math.sign(kc-ck[1]);
    const cp=board[ck[0]][ck[1]];
    const sp=specOf(cp);
    const sliding=sp.slides.some(s=>s[0]===dr&&s[1]===dc);
    if(sliding){
      let r=ck[0]+dr,c=ck[1]+dc;
      while(r!==kr||c!==kc){blocks.push([r,c]);r+=dr;c+=dc;}
    }
  }
  h+=`<div style="margin-top:8px"><b>③ 사이를 막을 수 없다 (合駒)</b></div><ul>`;
  if(checkers.length>1){
    h+=`<li>왕수를 건 말이 <b>${checkers.length}개(양왕수)</b>이므로, 한 칸을 막아도 다른 왕수가 남습니다. 양왕수는 <b>왕이 도망가는 수밖에</b> 없습니다.</li>`;
  } else if(!blocks.length){
    const cp=board[checkers[0][0]][checkers[0][1]];
    h+=`<li>왕수를 건 <b>${wName(cp)}</b>${J.iga(krName(cp))} 왕 <b>바로 옆</b>(또는 계마)이라 사이에 넣을 공간 자체가 없습니다.</li>`;
  } else {
    const handCnt=PIECE_TYPES.filter(t=>(hands[loser]&&hands[loser][t]>0));
    h+=`<li>막을 수 있는 칸: ${blocks.map(b=>`<b>${sqName(b[0],b[1])}</b>`).join(' · ')}</li>`;
    h+=handCnt.length
      ? `<li>후수 손패(${handCnt.map(t=>PIECE_KR[t]).join('·')})로 막아도, 막은 말째로 잡히거나 왕수가 계속되어 외통을 피할 수 없습니다.</li>`
      : `<li>후수는 <b>손패가 하나도 없어</b> 사이에 둘 말이 없고, 그 칸으로 옮길 수 있는 말도 없습니다.</li>`;
  }
  h+=`</ul>`;
  h+=`<div class="sub">→ 도망·잡기·막기 세 가지가 모두 막혔으므로 <b>詰み(외통수)</b>입니다.</div>`;
  return h;
}

function dirName(d){
  const v=d[0]<0?'위':(d[0]>0?'아래':'');
  const hh=d[1]<0?'왼쪽':(d[1]>0?'오른쪽':'');
  if(v&&hh) return hh+' '+v;
  return v||hh||'제자리';
}

/** 정답을 맞혔을 때도 같은 해설을 보여 준다 */
function showMateExplanation(){
  const expl=explainMate(QZ.board,QZ.hands,'white');
  document.getElementById('quiz-answer-box').innerHTML=`<div class="ans-card"><h4>🎉 외통수 완성</h4>${expl}</div>`;
}
