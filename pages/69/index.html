<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마작 완전 가이드</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07050c;--bg2:#100e18;--bg3:#181524;--bg4:#201d30;
  --border:#251f38;--border2:#403060;
  --txt:#f4eeff;--txt2:#b090d0;--txt3:#60487a;
  --red:#c83050;--red2:#e85070;--redbg:rgba(200,48,80,.12);--redbr:rgba(200,48,80,.3);
  --gld:#d4a820;--gldbg:rgba(212,168,32,.1);--gldbr:rgba(212,168,32,.3);
  --grn:#22aa44;--blu:#3a88ff;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  font-size:14px;line-height:1.6;min-height:100vh;}

/* HEADER */
#hdr{background:linear-gradient(135deg,#060310 0%,#0e0820 40%,#180d08 100%);
  border-bottom:2px solid var(--red);padding:12px 20px;
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
#hdr-ic{font-size:26px;filter:drop-shadow(0 0 12px var(--red));}
#hdr h1{font-size:18px;font-weight:800;color:var(--red2);
  text-shadow:0 0 20px rgba(200,48,80,.4);}
#hdr-sub{font-size:11px;color:var(--txt3);margin-top:1px;}
#hdr-badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.hdr-b{font-size:10px;padding:2px 8px;border-radius:10px;
  background:var(--redbg);border:1px solid var(--redbr);color:var(--red2);
  font-weight:600;white-space:nowrap;}

/* TAB NAV */
#tnav{background:var(--bg2);border-bottom:1px solid var(--border);
  padding:8px 14px;display:flex;gap:5px;flex-wrap:nowrap;
  overflow-x:auto;scrollbar-width:none;
  position:sticky;top:54px;z-index:100;}
#tnav::-webkit-scrollbar{display:none;}
.tbtn{display:flex;flex-direction:column;align-items:center;
  padding:7px 12px;border-radius:8px;border:1px solid transparent;
  cursor:pointer;background:none;color:var(--txt2);
  font-size:10px;font-weight:600;transition:.13s;
  white-space:nowrap;font-family:inherit;gap:2px;min-width:52px;}
.tbtn:hover{background:var(--bg3);color:var(--txt);}
.tbtn.on{background:var(--redbg);border-color:var(--redbr);color:var(--red2);}
.tbtn .ti{font-size:17px;}

/* MAIN */
#main{padding:18px;max-width:1100px;margin:0 auto;}

/* SECTION */
.sec{background:var(--bg2);border:1px solid var(--border);
  border-radius:9px;margin-bottom:14px;overflow:hidden;}
.sec-hdr{padding:12px 16px;display:flex;align-items:center;gap:8px;
  cursor:pointer;user-select:none;transition:.13s;}
.sec-hdr:hover{background:var(--bg3);}
.sec-hdr.op{border-bottom:1px solid var(--border);}
.sec-hdr h3{font-size:13px;font-weight:700;color:var(--txt);}
.sec-arr{margin-left:auto;color:var(--txt3);transition:.2s;font-size:12px;}
.sec-hdr.op .sec-arr{transform:rotate(180deg);}
.sec-body{padding:16px;display:none;}
.sec-body.op{display:block;}

/* TILES */
.tl{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  width:26px;height:34px;
  background:linear-gradient(145deg,#fffcf5,#efe5c8);
  border:1px solid #c09050;border-radius:3px;
  font-size:11px;font-weight:900;
  box-shadow:1px 2px 3px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.85);
  margin:1px;user-select:none;line-height:1.1;vertical-align:middle;flex-shrink:0;}
.tl small{font-size:7px;line-height:1;}
.tm{color:#cc2020;}.tp{color:#1133cc;}.ts{color:#208830;}.tj{color:#7a5818;}
.tlhaku{color:#999;border:2px solid #aaa;}
.tlhatsu{color:#208830;}
.tlchun{color:#cc2020;}
.tile-grp{display:inline-flex;gap:1px;padding:4px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:4px;margin:3px;vertical-align:middle;}
.tile-row{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin:4px 0;}

/* INFO CARDS */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.ic{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px;}
.ic h4{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.ic p,.ic li{font-size:12px;color:var(--txt2);line-height:1.65;}
.ic ul{padding-left:16px;}
.ic-accent{border-color:var(--redbr);background:var(--redbg);}
.ic-gold{border-color:var(--gldbr);background:var(--gldbg);}
.ic-blue{border-color:rgba(58,136,255,.3);background:rgba(58,136,255,.08);}
.ic-green{border-color:rgba(34,170,68,.3);background:rgba(34,170,68,.07);}

/* TABLES */
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th,.tbl td{padding:7px 11px;border:1px solid var(--border);text-align:left;}
.tbl th{background:var(--bg4);color:var(--txt2);font-weight:600;font-size:11px;}
.tbl tr:nth-child(even) td{background:rgba(255,255,255,.02);}
.tbl .tc{text-align:center;}
.tbl .hi{background:var(--redbg)!important;color:var(--red2);font-weight:600;}
.tbl .gi{background:var(--gldbg)!important;color:var(--gld);font-weight:600;}

/* YAKU CARDS */
.yaku-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.yk{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:12px;}
.yk-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.yk-han{font-size:11px;padding:2px 9px;border-radius:8px;font-weight:800;white-space:nowrap;}
.yk-name{font-size:14px;font-weight:800;color:var(--txt);}
.yk-jp{font-size:10px;color:var(--txt3);margin-bottom:6px;}
.yk-cond{font-size:12px;color:var(--txt2);margin-bottom:5px;line-height:1.6;}
.yk-tiles{margin:5px 0;}
.yk-note{font-size:11px;color:var(--txt3);border-top:1px solid var(--border);
  padding-top:5px;margin-top:5px;line-height:1.55;}
.yk-closed{font-size:10px;color:var(--red2);font-weight:600;padding:1px 6px;
  border:1px solid var(--redbr);border-radius:6px;}
.han1{background:rgba(58,136,255,.15);color:#6ab0ff;border-color:rgba(58,136,255,.3);}
.han2{background:rgba(34,170,68,.15);color:#44dd80;border-color:rgba(34,170,68,.3);}
.han3{background:rgba(212,168,32,.15);color:#e8c040;border-color:rgba(212,168,32,.3);}
.han6{background:rgba(200,48,80,.15);color:#e85070;border-color:rgba(200,48,80,.3);}
.hanY{background:linear-gradient(135deg,rgba(200,48,80,.2),rgba(212,168,32,.2));
  color:#f0a030;border-color:rgba(212,168,32,.4);}

/* GLOSSARY */
.glos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;}
.gl{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 12px;}
.gl-term{font-size:13px;font-weight:700;color:var(--red2);margin-bottom:2px;}
.gl-jp{font-size:10px;color:var(--txt3);margin-bottom:4px;}
.gl-def{font-size:12px;color:var(--txt2);line-height:1.55;}

/* FLOW STEPS */
.flow-steps{display:flex;flex-direction:column;gap:8px;}
.flow-step{display:flex;gap:12px;align-items:flex-start;
  padding:11px 13px;border-radius:7px;
  background:var(--bg3);border:1px solid var(--border);}
.flow-num{width:24px;height:24px;border-radius:50%;background:var(--red);
  color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;margin-top:1px;}
.flow-body h4{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:3px;}
.flow-body p{font-size:12px;color:var(--txt2);line-height:1.6;}

/* ACTION CARDS */
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.act{border-radius:8px;padding:14px;border:1px solid;}
.act-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.act-icon{font-size:20px;}
.act-name{font-size:15px;font-weight:800;}
.act-jp{font-size:10px;color:var(--txt3);margin-bottom:6px;}
.act-desc{font-size:12px;color:var(--txt2);line-height:1.65;margin-bottom:8px;}
.act-ex{font-size:11px;color:var(--txt3);line-height:1.6;}

/* NOTE */
.note{font-size:12px;color:var(--txt2);padding:9px 12px;border-radius:6px;
  background:var(--bg3);border-left:3px solid var(--gld);margin:8px 0;line-height:1.6;}
.note.warn{border-left-color:var(--red);background:var(--redbg);color:var(--txt);}

/* OVERVIEW HERO */
.ov-hero{background:linear-gradient(135deg,var(--bg2),var(--bg3));
  border:1px solid var(--redbr);border-radius:10px;padding:20px;margin-bottom:16px;
  position:relative;overflow:hidden;}
.ov-hero::after{content:'🀄';position:absolute;right:-10px;top:-10px;
  font-size:100px;opacity:.06;pointer-events:none;}
.ov-hero h2{font-size:20px;font-weight:800;color:var(--red2);margin-bottom:8px;}
.ov-hero p{font-size:13px;color:var(--txt2);line-height:1.7;}

/* WAIT TYPE */
.wait-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.wait-card{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:12px;}
.wait-name{font-size:13px;font-weight:700;color:var(--gld);margin-bottom:4px;}
.wait-jp{font-size:10px;color:var(--txt3);margin-bottom:6px;}
.wait-ex{font-size:12px;color:var(--txt2);margin-top:6px;line-height:1.55;}
.wait-fu{font-size:10px;color:var(--red2);font-weight:600;margin-top:4px;}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

@media(max-width:600px){
  .info-grid,.yaku-grid,.act-grid,.glos-grid,.wait-grid{grid-template-columns:1fr;}
  #hdr h1{font-size:15px;}
  #hdr-badges{display:none;}
}
</style>
</head>
<body>

<header id="hdr">
  <span id="hdr-ic">🀄</span>
  <div>
    <h1>마작 완전 가이드</h1>
    <div id="hdr-sub">일본 리치 마작 (麻雀) 규칙 · 역 목록 · 점수 계산 완전 정리</div>
  </div>
  <div id="hdr-badges">
    <span class="hdr-b">리치 마작</span>
    <span class="hdr-b">역 목록 포함</span>
    <span class="hdr-b">점수 계산</span>
  </div>
</header>

<nav id="tnav"></nav>
<main id="main"></main>

<script>
/* ─ 타일 헬퍼 ─ */
function T(n, suit) {
  if (suit === 'haku') return '<span class="tl tlhaku">白</span>';
  if (suit === 'hatsu') return '<span class="tl tlhatsu">發</span>';
  if (suit === 'chun') return '<span class="tl tlchun">中</span>';
  const chars = {E:'東',S:'南',W:'西',N:'北'};
  if (chars[suit]) return `<span class="tl tj">${chars[suit]}</span>`;
  const cls = {m:'tm',p:'tp',s:'ts'}[suit];
  const su = {m:'万',p:'筒',s:'索'}[suit];
  return `<span class="tl ${cls}">${n}<small>${su}</small></span>`;
}
function Tg(arr) {
  return '<span class="tile-grp">' + arr.map(([n,s])=>T(n,s)).join('') + '</span>';
}

/* ─ 섹션 ─ */
function sec(title, body, open=true) {
  return `<div class="sec">
    <div class="sec-hdr${open?' op':''}" onclick="toggleSec(this)">
      <h3>${title}</h3><span class="sec-arr">▼</span>
    </div>
    <div class="sec-body${open?' op':''}">${body}</div>
  </div>`;
}
function toggleSec(hdr) {
  hdr.classList.toggle('op');
  hdr.nextElementSibling.classList.toggle('op');
}

/* ─ 탭 ─ */
const TABS = [
  {id:'overview', name:'개요', icon:'🀄'},
  {id:'tiles',    name:'패 종류', icon:'🃏'},
  {id:'flow',     name:'게임 흐름', icon:'♟'},
  {id:'actions',  name:'특수 액션', icon:'⚡'},
  {id:'yaku',     name:'역(役) 목록', icon:'📋'},
  {id:'scoring',  name:'점수 계산', icon:'🔢'},
  {id:'glossary', name:'용어 사전', icon:'📖'},
];
let curTab = 'overview';

function renderNav() {
  document.getElementById('tnav').innerHTML = TABS.map(t =>
    `<button class="tbtn${curTab===t.id?' on':''}" onclick="sel('${t.id}')">
      <span class="ti">${t.icon}</span><span>${t.name}</span>
    </button>`
  ).join('');
}

function sel(id) {
  curTab = id;
  renderNav();
  ({overview:renderOverview,tiles:renderTiles,flow:renderFlow,
    actions:renderActions,yaku:renderYaku,scoring:renderScoring,
    glossary:renderGlossary})[id]();
  window.scrollTo(0,0);
}

/* ══════════════════════════════
   개요
══════════════════════════════ */
function renderOverview() {
  document.getElementById('main').innerHTML = `
    <div class="ov-hero">
      <h2>🀄 마작 (麻雀) 이란?</h2>
      <p>4명의 플레이어가 136장의 패(牌)를 사용해 특정 형태를 가장 먼저 완성하는 전략 보드게임입니다.<br>
      중국에서 기원해 일본에서 독자 발전한 <strong style="color:var(--red2);">일본 리치 마작(リーチ麻雀)</strong>이 현재 전 세계 표준입니다.<br>
      온라인 게임 <strong style="color:var(--gld);">작혼(雀魂/Mahjong Soul)</strong>이 한국에서의 진입 경로로 많이 활용됩니다.</p>
    </div>
    ${sec('🎯 기본 목표 & 화료', `
      <div class="info-grid">
        <div class="ic ic-accent">
          <h4>🏆 승리 조건</h4>
          <p>손패 13장 + 1장 = 14장으로 <strong>화료(和了/あがり)</strong> 형태를 완성합니다.</p>
          <p style="margin-top:8px;"><strong>기본 형태: 4멘쯔 + 1쌍(머리)</strong></p>
          <div style="margin-top:8px;">
            ${Tg([[1,'m'],[2,'m'],[3,'m']])} ${Tg([[4,'p'],[5,'p'],[6,'p']])} ${Tg([[7,'s'],[8,'s'],[9,'s']])} ${Tg([[2,'m'],[3,'m'],[4,'m']])} ${Tg([[8,'p'],[8,'p']])}
          </div>
          <p style="font-size:11px;color:var(--txt3);margin-top:6px;">순자×3 + 순자×1 + 머리 = 화료</p>
        </div>
        <div class="ic">
          <h4>⚠️ 역(役) 필수</h4>
          <p>화료 형태를 완성해도 <strong style="color:var(--red2);">역(役)이 1개 이상</strong> 없으면 화료 불가.</p>
          <p style="margin-top:6px;">역이란 화료를 인정받기 위한 조건 패턴. 리치, 탕야오, 핀후 등 다양한 역이 있으며, 각각 판수(판수)를 제공합니다.</p>
        </div>
        <div class="ic">
          <h4>📌 화료 2가지 방법</h4>
          <ul>
            <li><strong>론(ロン)</strong>: 타가가 버린 패로 화료 → 버린 사람이 점수 전액 지불</li>
            <li><strong>쯔모(ツモ)</strong>: 패산에서 직접 뽑아 화료 → 3명이 분산 지불 (동가는 2배)</li>
          </ul>
        </div>
        <div class="ic ic-gold">
          <h4>⏱ 게임 단위</h4>
          <ul>
            <li><strong>1국(局)</strong>: 화료 또는 패산 소진까지</li>
            <li><strong>동장(東場)</strong>: 동1~4국 (4국)</li>
            <li><strong>반장(半荘)</strong>: 동장+남장 = 총 8국 (표준)</li>
            <li><strong>시작 점수</strong>: 보통 25,000점씩</li>
          </ul>
        </div>
      </div>
    `)}
    ${sec('⚖️ 일본 마작 vs 중국 마작', `
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>항목</th><th>일본 리치 마작</th><th>중국 마작 (마작)</th></tr></thead>
          <tbody>
            <tr><td>사용 패</td><td>136장 (아카도라 포함 시 139장)</td><td>144장 (꽃패 8장 포함)</td></tr>
            <tr><td>역 시스템</td><td>역(役) 필수 — 없으면 화료 불가</td><td>판(番) 축적 방식, 역 없이도 화료 가능</td></tr>
            <tr><td>리치(立直)</td><td>✅ 핵심 규칙</td><td>❌ 없음</td></tr>
            <tr><td>도라</td><td>✅ 있음 (보너스 판수)</td><td>❌ 없음 (일부 변형은 있음)</td></tr>
            <tr><td>특수 액션</td><td>치·폰·깡·리치·론·쯔모</td><td>펑·강·치·후 등</td></tr>
            <tr><td>점수 계산</td><td>부(符)×판(飜) 방식 — 정교함</td><td>번(番) 방식 — 역 종류 합산</td></tr>
            <tr><td>대표 플랫폼</td><td>작혼(雀魂), 텐호우(天鳳), MahjongSoul</td><td>월드 마작 오픈</td></tr>
          </tbody>
        </table>
      </div>
      <div class="note" style="margin-top:10px;">이 가이드는 전체가 <strong>일본 리치 마작</strong> 기준입니다.</div>
    `)}
  `;
}

/* ══════════════════════════════
   패 종류
══════════════════════════════ */
function renderTiles() {
  const mRow = [1,2,3,4,5,6,7,8,9].map(n=>T(n,'m')).join('');
  const pRow = [1,2,3,4,5,6,7,8,9].map(n=>T(n,'p')).join('');
  const sRow = [1,2,3,4,5,6,7,8,9].map(n=>T(n,'s')).join('');

  document.getElementById('main').innerHTML = `
    ${sec('🃏 패 종류 전체 (34종 136장)', `
      <div class="info-grid">
        <div class="ic ic-accent">
          <h4><span style="color:#cc2020;">■</span> 만수패 (万/マン)</h4>
          <p style="margin-bottom:8px;">한자 숫자 1~9. 붉은 색. 한국에서 "만(万)"이라 부름.</p>
          <div class="tile-row">${mRow}</div>
          <p style="font-size:11px;color:var(--txt3);margin-top:4px;">1万~9万 각 4장 = 36장</p>
        </div>
        <div class="ic ic-blue">
          <h4><span style="color:#1133cc;">■</span> 통수패 (筒/ピン)</h4>
          <p style="margin-bottom:8px;">원형 문양 1~9. 파란 색. "핀(ピン)" 또는 "통"이라 부름.</p>
          <div class="tile-row">${pRow}</div>
          <p style="font-size:11px;color:var(--txt3);margin-top:4px;">1筒~9筒 각 4장 = 36장</p>
        </div>
        <div class="ic ic-green">
          <h4><span style="color:#208830;">■</span> 삭수패 (索/ソー)</h4>
          <p style="margin-bottom:8px;">대나무 막대 1~9. 초록 색. "소(ソー)" 또는 "삭"이라 부름.</p>
          <div class="tile-row">${sRow}</div>
          <p style="font-size:11px;color:var(--txt3);margin-top:4px;">1索~9索 각 4장 = 36장</p>
        </div>

function renderYaku() {
  function cards(list, label, cls) {
    return `<div class="yaku-grid">${list.map(y=>`
      <div class="yk">
        <div class="yk-hdr">
          <span class="yk-han ${cls}">${label}</span>
          <span class="yk-name">${y.name}</span>
          ${y.closed?'<span class="yk-closed">문전한정</span>':''}
        </div>
        <div class="yk-jp">${y.jp}</div>
        <div class="yk-cond">📌 ${y.cond}</div>
        ${y.tiles?`<div class="yk-tiles">${y.tiles}</div>`:''}
        <div class="yk-note">💡 ${y.note}</div>
      </div>`).join('')}
    </div>`;
  }

  document.getElementById('main').innerHTML = `
    <div class="note">⚠️ 역(役)이 없으면 화료 불가. 역 판수 + 도라 수 = 총 판수로 점수 계산. 도라는 역이 아닙니다.</div>
    ${sec('1판 역 (1飜) — 11종', cards(YAKU.h1,'1판','han1'))}

    ${sec('역만 (役満) — 12종 · 32,000점 (동가 48,000점)', cards(YAKU.yakuman,'역만','hanY'))}
  `;
}
