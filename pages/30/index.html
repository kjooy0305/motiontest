<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>떨어지는 모래 — 테스트 30</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;user-select:none;}

#title{color:#e2c97e;font-size:15px;font-weight:700;letter-spacing:2px;margin-bottom:8px;text-shadow:0 0 10px rgba(226,201,126,.4);}

#canvas-wrap{position:relative;border:2px solid #3a3a5c;border-radius:4px;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.6);}
#canvas{display:block;cursor:crosshair;}

/* 밑바닥 열림 표시선 */
#floor-open-line{
  position:absolute;bottom:0;left:0;right:0;height:4px;
  background:rgba(255,80,80,.0);
  transition:background .15s;
  pointer-events:none;
}
#canvas-wrap.floor-open #floor-open-line{background:rgba(255,80,80,.7);box-shadow:0 0 8px rgba(255,80,80,.5);}

#controls{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  margin-top:10px;padding:10px 14px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;
  width:100%;max-width:700px;
}

.ctrl-group{display:flex;align-items:center;gap:6px;}
.ctrl-label{color:#a0a0c0;font-size:12px;white-space:nowrap;}

input[type=range]{
  -webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  background:rgba(255,255,255,.15);outline:none;cursor:pointer;width:90px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:#e2c97e;cursor:pointer;box-shadow:0 0 4px rgba(226,201,126,.5);
}
.val-display{color:#e2c97e;font-size:12px;min-width:28px;text-align:center;}

/* 버튼들 */
.btn{
  padding:7px 14px;border:none;border-radius:5px;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .12s;letter-spacing:.5px;
}
#btn-floor{
  background:#3a1a1a;color:#ff6b6b;border:1px solid #ff4444;
}
#btn-floor:active,#btn-floor.held{background:#5a1a1a;box-shadow:0 0 10px rgba(255,68,68,.4);}
#btn-spawn{background:#1a3a1a;color:#6bff6b;border:1px solid #44ff44;}
#btn-spawn:hover{background:#1f4a1f;}
#btn-clear{background:#1a1a3a;color:#6b9bff;border:1px solid #4466ff;}
#btn-clear:hover{background:#1a1a4a;}

/* 색상 선택 */
.color-pick{display:flex;gap:5px;align-items:center;}
.color-swatch{width:16px;height:16px;border-radius:3px;cursor:pointer;border:2px solid transparent;transition:.1s;}
.color-swatch.active{border-color:#fff;box-shadow:0 0 5px rgba(255,255,255,.4);}

#stats{color:#606080;font-size:11px;margin-left:auto;}
</style>
</head>
<body>

<div id="title">SAND SIMULATION</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
  <div id="floor-open-line"></div>
</div>

<div id="controls">
  <div class="ctrl-group">
    <button class="btn" id="btn-floor">밑 열기 (꾹)</button>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">밀도</span>
    <input type="range" id="slider-density" min="1" max="10" value="5" step="1">
    <span class="val-display" id="val-density">5</span>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">한번에</span>
    <input type="range" id="slider-amount" min="1" max="50" value="10" step="1">
    <span class="val-display" id="val-amount">10</span>
  </div>

  <div class="ctrl-group color-pick" id="color-pick">
    <!-- swatches injected by JS -->
  </div>

  <div class="ctrl-group">
    <button class="btn" id="btn-spawn">한번에 소환</button>
  </div>

  <div class="ctrl-group">
    <button class="btn" id="btn-clear">초기화</button>
  </div>

  <span id="stats">모래: 0</span>
</div>

<script>
// ── 캔버스 설정 ──────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('canvas-wrap');

const CELL = 4; // 픽셀 per cell

function resize() {
  const W = Math.min(window.innerWidth - 20, 700);
  const H = Math.min(window.innerHeight - 160, 500);
  canvas.width  = Math.floor(W / CELL) * CELL;
  canvas.height = Math.floor(H / CELL) * CELL;
  wrap.style.width  = canvas.width  + 'px';
  wrap.style.height = canvas.height + 'px';
  initGrid();
}

let COLS, ROWS, grid, imageData, pixels;

function initGrid() {
  COLS = canvas.width  / CELL;
  ROWS = canvas.height / CELL;
  grid = new Uint32Array(COLS * ROWS); // 0 = 빈칸, color = 모래
  imageData = ctx.createImageData(canvas.width, canvas.height);
  pixels = imageData.data;
}

// ── 색상 팔레트 ──────────────────────────────────
const PALETTES = [
  { name:'모래',  color:'#d4a853' },
  { name:'백모래',color:'#e8ddb5' },
  { name:'적모래',color:'#c0533a' },
  { name:'흑모래',color:'#3a3028' },
  { name:'파란',  color:'#5588cc' },
  { name:'초록',  color:'#5aaa55' },
  { name:'보라',  color:'#9955cc' },
  { name:'무지개',color:'rainbow' },
];

let currentPalette = 0;

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function getSandColor(x) {
  const p = PALETTES[currentPalette];
  if (p.color === 'rainbow') {
    const hue = (x / COLS * 360 + Date.now()*0.05) % 360;
    return hslToRgb(hue, 80, 60);
  }
  const base = hexToRgb(p.color);
  const v = (Math.random() * 30 - 15) | 0;
  return {
    r: Math.min(255, Math.max(0, base.r + v)),
    g: Math.min(255, Math.max(0, base.g + v)),
    b: Math.min(255, Math.max(0, base.b + v)),
  };
}

function hslToRgb(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return {r:(f(0)*255)|0, g:(f(8)*255)|0, b:(f(4)*255)|0};
}

// color → packed 32-bit RGBA (little-endian: ABGR)
function packColor(r,g,b){ return (0xFF<<24)|(b<<16)|(g<<8)|r; }

// ── 컬러 스와치 생성 ──────────────────────────────
const colorPick = document.getElementById('color-pick');
PALETTES.forEach((p,i)=>{
  const sw = document.createElement('div');
  sw.className='color-swatch' + (i===0?' active':'');
  sw.title = p.name;
  sw.style.background = p.color==='rainbow'
    ? 'linear-gradient(90deg,red,orange,yellow,green,blue,violet)'
    : p.color;
  sw.addEventListener('click',()=>{
    currentPalette = i;
    document.querySelectorAll('.color-swatch').forEach((s,j)=>s.classList.toggle('active',j===i));
  });
  colorPick.appendChild(sw);
});

// ── 컨트롤 ───────────────────────────────────────
const sliderDensity = document.getElementById('slider-density');
const sliderAmount  = document.getElementById('slider-amount');
const valDensity    = document.getElementById('val-density');
const valAmount     = document.getElementById('val-amount');
const btnFloor      = document.getElementById('btn-floor');
const btnSpawn      = document.getElementById('btn-spawn');
const btnClear      = document.getElementById('btn-clear');
const statsEl       = document.getElementById('stats');

sliderDensity.addEventListener('input', ()=>{ valDensity.textContent = sliderDensity.value; });
sliderAmount.addEventListener('input',  ()=>{ valAmount.textContent  = sliderAmount.value; });

let floorOpen = false;
btnFloor.addEventListener('mousedown',  ()=>setFloor(true));
btnFloor.addEventListener('touchstart', ()=>setFloor(true),{passive:true});
btnFloor.addEventListener('mouseup',   ()=>setFloor(false));
btnFloor.addEventListener('mouseleave',()=>setFloor(false));
btnFloor.addEventListener('touchend',  ()=>setFloor(false));

function setFloor(open) {
  floorOpen = open;
  btnFloor.classList.toggle('held', open);
  wrap.classList.toggle('floor-open', open);
}

btnClear.addEventListener('click',()=>{ grid.fill(0); });

btnSpawn.addEventListener('click',()=>{
  const amount = parseInt(sliderAmount.value);
  for(let i=0;i<amount;i++){
    const x = (Math.random()*COLS)|0;
    const y = 0;
    const {r,g,b} = getSandColor(x);
    placeSand(x, y, packColor(r,g,b));
  }
});

// ── 마우스/터치로 모래 추가 ──────────────────────
let isPointerDown = false;
let lastPX = -1, lastPY = -1;

canvas.addEventListener('mousedown', e=>{ isPointerDown=true; addSandAt(e); });
canvas.addEventListener('mousemove', e=>{ if(isPointerDown) addSandAt(e); });
canvas.addEventListener('mouseup',   ()=>{ isPointerDown=false; lastPX=lastPY=-1; });
canvas.addEventListener('mouseleave',()=>{ isPointerDown=false; lastPX=lastPY=-1; });

canvas.addEventListener('touchstart', e=>{ isPointerDown=true; addSandAt(e.touches[0]); e.preventDefault(); },{passive:false});
canvas.addEventListener('touchmove',  e=>{ if(isPointerDown) addSandAt(e.touches[0]); e.preventDefault(); },{passive:false});
canvas.addEventListener('touchend',   ()=>{ isPointerDown=false; lastPX=lastPY=-1; });

function addSandAt(e) {
  const rect = canvas.getBoundingClientRect();
  const px = ((e.clientX - rect.left) / CELL) | 0;
  const py = ((e.clientY - rect.top)  / CELL) | 0;

  if(px<0||px>=COLS||py<0||py>=ROWS) return;

  const density = parseInt(sliderDensity.value);
  const amount  = parseInt(sliderAmount.value);

  // 커서 주변 radius에 density만큼 뿌림
  const radius = Math.ceil(density / 2);
  let placed = 0;
  const tries = amount * 3;
  for(let t=0; t<tries && placed<amount; t++){
    const ox = Math.round((Math.random()*2-1)*radius);
    const oy = Math.round((Math.random()*2-1)*radius);
    const nx = px+ox, ny = py+oy;
    if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&!grid[ny*COLS+nx]){
      const {r,g,b} = getSandColor(nx);
      placeSand(nx, ny, packColor(r,g,b));
      placed++;
    }
  }

  lastPX=px; lastPY=py;
}

function placeSand(x,y,color){
  if(x<0||x>=COLS||y<0||y>=ROWS) return;
  grid[y*COLS+x] = color;
}

// ── 시뮬레이션 ───────────────────────────────────
// 업데이트 순서를 홀수/짝수 열 교대로 해서 편향 방지
let tick = 0;

function update() {
  tick++;
  const leftFirst = tick % 2 === 0;

  // 밑 열림: 맨 아래 행 제거
  if(floorOpen){
    const y = ROWS-1;
    for(let x=0;x<COLS;x++) grid[y*COLS+x]=0;
  }

  // 아래에서 위로 업데이트
  for(let y=ROWS-2; y>=0; y--){
    for(let xi=0; xi<COLS; xi++){
      const x = leftFirst ? xi : COLS-1-xi;
      const idx = y*COLS+x;
      if(!grid[idx]) continue;

      const below = (y+1)*COLS+x;

      // 바로 아래
      if(y+1 < ROWS && !grid[below]){
        grid[below] = grid[idx];
        grid[idx]   = 0;
        continue;
      }

      // 대각선 아래 왼쪽/오른쪽 (랜덤)
      const goLeft = Math.random()<0.5;
      const dx1 = goLeft ? -1 : 1;
      const dx2 = goLeft ?  1 : -1;

      let moved = false;
      for(const dx of [dx1, dx2]){
        const nx = x+dx;
        if(nx>=0 && nx<COLS && y+1<ROWS && !grid[(y+1)*COLS+nx]){
          grid[(y+1)*COLS+nx] = grid[idx];
          grid[idx] = 0;
          moved = true;
          break;
        }
      }
    }
  }
}

// ── 렌더링 ───────────────────────────────────────
function render() {
  const data = pixels;
  const W = canvas.width;
  const H = canvas.height;

  // 배경 채우기 (RGBA little-endian: 0xFF1A1A2E = A=FF B=1A G=1A R=2E)
  const BG = packColor(0x1a, 0x1a, 0x2e);
  const dv = new Uint32Array(data.buffer);
  dv.fill(BG);

  let sandCount = 0;

  for(let gy=0; gy<ROWS; gy++){
    for(let gx=0; gx<COLS; gx++){
      const color = grid[gy*COLS+gx];
      if(!color) continue;
      sandCount++;

      // 셀 픽셀 채우기
      for(let py=0; py<CELL; py++){
        const row = (gy*CELL+py)*W + gx*CELL;
        for(let px=0; px<CELL; px++){
          dv[row+px] = color;
        }
      }
    }
  }

  ctx.putImageData(imageData, 0, 0);
  statsEl.textContent = '모래: ' + sandCount.toLocaleString();
}

// ── 메인 루프 ────────────────────────────────────
let lastTime = 0;
const TARGET_FPS = 60;
const FRAME_MS   = 1000 / TARGET_FPS;

function loop(ts) {
  requestAnimationFrame(loop);
  if(ts - lastTime < FRAME_MS - 1) return;
  lastTime = ts;

  update();
  render();
}

// ── 초기화 ───────────────────────────────────────
resize();
window.addEventListener('resize', resize);
requestAnimationFrame(loop);
</script>
</body>
</html>
