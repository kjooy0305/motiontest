<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>텍스트 작성기</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0D1117;
    --surface:  #161B22;
    --surface2: #1C2128;
    --border:   #30363D;
    --accent:   #58A6FF;
    --green:    #3FB950;
    --yellow:   #D29922;
    --red:      #F85149;
    --text:     #E6EDF3;
    --sub:      #8B949E;
    --hint:     #484F58;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .logo { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .logo span { color: var(--accent); }
  .header-sub { font-size: 13px; color: var(--sub); margin-top: 2px; }
  header > div { flex: 1; }

  /* 상단 옵션 바 */
  .opt-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .opt-label {
    font-size: 12px;
    color: var(--sub);
    margin-right: 4px;
    white-space: nowrap;
  }

  /* ── Toggle Switch ── */
  .toggle-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    user-select: none;
    transition: border-color .15s;
  }
  .toggle-group:hover { border-color: var(--accent); }
  .toggle-group.active { border-color: var(--accent); background: rgba(88,166,255,.08); }

  .switch {
    width: 34px; height: 18px;
    background: var(--hint);
    border-radius: 9px;
    position: relative;
    transition: background .2s;
    flex-shrink: 0;
  }
  .switch::after {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    background: #fff;
    border-radius: 50%;
    top: 3px; left: 3px;
    transition: transform .2s;
  }
  .toggle-group.active .switch { background: var(--accent); }
  .toggle-group.active .switch::after { transform: translateX(16px); }

  .toggle-text { font-size: 13px; color: var(--sub); white-space: nowrap; }
  .toggle-group.active .toggle-text { color: var(--text); }

  /* ── Main layout ── */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 0;
    overflow: hidden;
  }

  /* ── Editor area ── */
  .editor-wrap {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    min-height: 0;
  }

  .editor-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .toolbar-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--sub);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .toolbar-btn:hover { border-color: var(--accent); color: var(--text); }
  .toolbar-space { flex: 1; }
  .editor-hint { font-size: 12px; color: var(--hint); }

  #editor {
    flex: 1;
    resize: none;
    background: var(--surface);
    color: var(--text);
    border: none;
    outline: none;
    font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
    font-size: 15px;
    line-height: 1.7;
    padding: 20px 24px;
    tab-size: 2;
    min-height: 0;
  }
  #editor::placeholder { color: var(--hint); }

  /* ── Stats panel ── */
  .stats-panel {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow-y: auto;
  }

  .panel-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--hint);
    margin-bottom: 12px;
  }

  /* 메인 카운터 */
  .main-counter {
    text-align: center;
    padding: 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .counter-num {
    font-size: 56px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
  }
  .counter-label {
    font-size: 12px;
    color: var(--sub);
    margin-top: 6px;
  }
  .counter-basis {
    font-size: 11px;
    color: var(--hint);
    margin-top: 4px;
    line-height: 1.5;
  }

  /* 세부 통계 */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(48,54,61,.5);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-name { font-size: 13px; color: var(--sub); }
  .stat-val {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    min-width: 48px;
    text-align: right;
  }
  .stat-val.green { color: var(--green); }
  .stat-val.yellow { color: var(--yellow); }

  /* 자수 기준 설명 */
  .basis-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .pill {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 12px;
    border: 1px solid var(--border);
    color: var(--sub);
    background: var(--surface2);
  }
  .pill.on { background: rgba(88,166,255,.12); border-color: var(--accent); color: var(--accent); }
  .pill.off { opacity: .5; text-decoration: line-through; }

  /* 복사 버튼 */
  .copy-section {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .copy-btn {
    width: 100%;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
    text-align: center;
  }
  .copy-btn:hover { border-color: var(--accent); background: rgba(88,166,255,.08); color: var(--accent); }
  .copy-btn.success { border-color: var(--green); color: var(--green); }

  /* 초기화 버튼 */
  .clear-btn {
    margin: 0 16px 14px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: none;
    color: var(--sub);
    font-size: 12px;
    cursor: pointer;
    width: calc(100% - 32px);
    transition: all .15s;
  }
  .clear-btn:hover { border-color: var(--red); color: var(--red); }

  /* ── 반응형 ── */
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .editor-wrap { border-right: none; border-bottom: 1px solid var(--border); }
    .stats-panel { max-height: 280px; }
    .main-counter { padding: 12px; }
    .counter-num { font-size: 40px; }
    header { padding: 14px 16px 12px; }
    .opt-bar { gap: 4px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">텍스트 <span>작성기</span></div>
    <div class="header-sub">자수 측정 · 공백·줄바꿈 포함 여부 선택 가능</div>
  </div>
  <div class="opt-bar">
    <span class="opt-label">자수 산정 기준</span>
    <div class="toggle-group active" id="toggleSpace" title="공백(스페이스·탭)을 1자로 포함">
      <div class="switch"></div>
      <span class="toggle-text">띄어쓰기 포함</span>
    </div>
    <div class="toggle-group active" id="toggleNewline" title="줄바꿈(Enter)을 1자로 포함">
      <div class="switch"></div>
      <span class="toggle-text">줄바꿈 포함</span>
    </div>
  </div>
</header>

<main>
  <!-- ── 에디터 ── -->
  <div class="editor-wrap">
    <div class="editor-toolbar">
      <button class="toolbar-btn" onclick="wrapText('**','**')"><b>굵게</b></button>
      <button class="toolbar-btn" onclick="wrapText('*','*')"><i>기울임</i></button>
      <button class="toolbar-btn" onclick="insertText('\n---\n')">구분선</button>
      <button class="toolbar-btn" onclick="insertBullet()">목록</button>
      <span class="toolbar-space"></span>
      <span class="editor-hint" id="liveHint">0자</span>
    </div>
    <textarea id="editor" placeholder="여기에 글을 작성하세요…&#10;&#10;오른쪽 패널에서 자수 통계가 실시간으로 업데이트됩니다.&#10;상단 토글로 띄어쓰기·줄바꿈의 자수 포함 여부를 선택하세요."></textarea>
  </div>

  <!-- ── 통계 패널 ── -->
  <div class="stats-panel">

    <!-- 메인 카운터 -->
    <div class="main-counter">
      <div class="counter-num" id="mainCount">0</div>
      <div class="counter-label">자수 (선택 기준)</div>
      <div class="counter-basis" id="basisDesc">띄어쓰기·줄바꿈 포함</div>
    </div>

    <!-- 세부 통계 -->
    <div class="panel-section">
      <div class="panel-title">세부 통계</div>

      <div class="stat-row">
        <span class="stat-name">순수 문자 수</span>
        <span class="stat-val" id="statPure">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">공백(스페이스·탭)</span>
        <span class="stat-val yellow" id="statSpace">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">줄바꿈</span>
        <span class="stat-val yellow" id="statNewline">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">단어 수</span>
        <span class="stat-val green" id="statWord">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">문장 수</span>
        <span class="stat-val" id="statSentence">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">줄(행) 수</span>
        <span class="stat-val" id="statLine">1</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">단락 수</span>
        <span class="stat-val" id="statPara">0</span>
      </div>
    </div>

    <!-- 현재 기준 표시 -->
    <div class="panel-section">
      <div class="panel-title">현재 자수 기준</div>
      <div class="basis-pills">
        <div class="pill on" id="pillPure">문자 항상 포함</div>
        <div class="pill on" id="pillSpace">띄어쓰기</div>
        <div class="pill on" id="pillNewline">줄바꿈</div>
      </div>
    </div>

    <!-- 복사 -->
    <div class="copy-section">
      <button class="copy-btn" id="btnCopyText" onclick="copyText()">글 전체 복사</button>
      <button class="copy-btn" id="btnCopyStats" onclick="copyStats()">통계 복사</button>
    </div>

    <button class="clear-btn" onclick="clearEditor()">전체 지우기</button>

  </div>
</main>

<script>
  const editor    = document.getElementById('editor');
  const mainCount = document.getElementById('mainCount');
  const liveHint  = document.getElementById('liveHint');
  const basisDesc = document.getElementById('basisDesc');

  const statPure     = document.getElementById('statPure');
  const statSpace    = document.getElementById('statSpace');
  const statNewline  = document.getElementById('statNewline');
  const statWord     = document.getElementById('statWord');
  const statSentence = document.getElementById('statSentence');
  const statLine     = document.getElementById('statLine');
  const statPara     = document.getElementById('statPara');

  const pillSpace   = document.getElementById('pillSpace');
  const pillNewline = document.getElementById('pillNewline');

  const toggleSpace   = document.getElementById('toggleSpace');
  const toggleNewline = document.getElementById('toggleNewline');

  let incSpace   = true;
  let incNewline = true;

  // ── 토글 처리 ──────────────────────────────────────────────────
  toggleSpace.addEventListener('click', () => {
    incSpace = !incSpace;
    toggleSpace.classList.toggle('active', incSpace);
    pillSpace.classList.toggle('on', incSpace);
    pillSpace.classList.toggle('off', !incSpace);
    update();
  });

  toggleNewline.addEventListener('click', () => {
    incNewline = !incNewline;
    toggleNewline.classList.toggle('active', incNewline);
    pillNewline.classList.toggle('on', incNewline);
    pillNewline.classList.toggle('off', !incNewline);
    update();
  });

  // ── 자수 계산 ──────────────────────────────────────────────────
  function countChars(text) {
    const spaces   = (text.match(/[ \t]/g)  || []).length;
    const newlines = (text.match(/\n/g)     || []).length;
    const pure     = text.length - spaces - newlines;
    let count = pure;
    if (incSpace)   count += spaces;
    if (incNewline) count += newlines;
    return { count, pure, spaces, newlines };
  }

  function countWords(text) {
    const t = text.trim();
    if (!t) return 0;
    return t.split(/\s+/).filter(w => w.length > 0).length;
  }

  function countSentences(text) {
    const t = text.trim();
    if (!t) return 0;
    const m = t.match(/[.!?。！？]+(\s|$)/g);
    return m ? m.length : (t.length > 0 ? 1 : 0);
  }

  function countParagraphs(text) {
    if (!text.trim()) return 0;
    return text.split(/\n\s*\n/).filter(p => p.trim().length > 0).length;
  }

  // ── 업데이트 ──────────────────────────────────────────────────
  function update() {
    const text = editor.value;
    const { count, pure, spaces, newlines } = countChars(text);

    mainCount.textContent = count.toLocaleString();
    liveHint.textContent  = count.toLocaleString() + '자';

    statPure.textContent     = pure.toLocaleString();
    statSpace.textContent    = spaces.toLocaleString();
    statNewline.textContent  = newlines.toLocaleString();
    statWord.textContent     = countWords(text).toLocaleString();
    statSentence.textContent = countSentences(text).toLocaleString();
    statLine.textContent     = (text.split('\n').length).toLocaleString();
    statPara.textContent     = countParagraphs(text).toLocaleString();

    // 기준 설명
    const parts = ['문자'];
    if (incSpace)   parts.push('띄어쓰기');
    if (incNewline) parts.push('줄바꿈');
    basisDesc.textContent = parts.join(' · ') + ' 포함';
  }

  editor.addEventListener('input', update);
  update();

  // ── 툴바 도우미 ───────────────────────────────────────────────
  function wrapText(before, after) {
    const s = editor.selectionStart;
    const e = editor.selectionEnd;
    const sel = editor.value.slice(s, e);
    const replacement = before + (sel || '텍스트') + after;
    editor.setRangeText(replacement, s, e, 'select');
    editor.focus();
    update();
  }

  function insertText(text) {
    const s = editor.selectionStart;
    editor.setRangeText(text, s, s, 'end');
    editor.focus();
    update();
  }

  function insertBullet() {
    const s = editor.selectionStart;
    const before = editor.value.slice(0, s);
    const needNL = before.length > 0 && !before.endsWith('\n');
    insertText((needNL ? '\n' : '') + '- ');
  }

  // ── 복사 ──────────────────────────────────────────────────────
  function copyText() {
    navigator.clipboard.writeText(editor.value).then(() => flash('btnCopyText'));
  }

  function copyStats() {
    const text = editor.value;
    const { count, pure, spaces, newlines } = countChars(text);
    const parts = ['문자'];
    if (incSpace)   parts.push('띄어쓰기');
    if (incNewline) parts.push('줄바꿈');
    const basis = parts.join('·') + ' 포함';
    const stats = [
      `[텍스트 통계 — ${basis}]`,
      `자수: ${count}자`,
      `순수 문자: ${pure}자`,
      `공백: ${spaces}개`,
      `줄바꿈: ${newlines}개`,
      `단어: ${countWords(text)}개`,
      `문장: ${countSentences(text)}개`,
      `줄: ${text.split('\n').length}줄`,
      `단락: ${countParagraphs(text)}개`,
    ].join('\n');
    navigator.clipboard.writeText(stats).then(() => flash('btnCopyStats'));
  }

  function flash(id) {
    const btn = document.getElementById(id);
    btn.classList.add('success');
    btn.textContent = '복사됨 ✓';
    setTimeout(() => {
      btn.classList.remove('success');
      btn.textContent = id === 'btnCopyText' ? '글 전체 복사' : '통계 복사';
    }, 1800);
  }

  function clearEditor() {
    if (!editor.value) return;
    if (confirm('작성한 내용을 모두 지울까요?')) {
      editor.value = '';
      update();
      editor.focus();
    }
  }

  // ── 탭 키 들여쓰기 ────────────────────────────────────────────
  editor.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = editor.selectionStart;
      editor.setRangeText('  ', s, editor.selectionEnd, 'end');
      update();
    }
  });
</script>
</body>
</html>
