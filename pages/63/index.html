<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC 부품 완전 가이드</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#06090f;--bg2:#0c1420;--bg3:#111c30;--bg4:#192540;
  --border:#1d2e48;--border2:#2a4070;
  --txt:#e2ecff;--txt2:#7896c8;--txt3:#3a5580;
  --blu:#3a8fff;--blu2:#6ab0ff;--blu3:rgba(58,143,255,.12);
  --grn:#28cc88;--grn2:#50e8a0;
  --yel:#f0c030;--yel2:#ffe060;
  --red:#ff4060;--pur:#aa66ff;--ora:#ff8833;--cya:#20d8d8;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  font-size:14px;line-height:1.6;min-height:100vh;}

/* ─ HEADER ─ */
#hdr{background:linear-gradient(135deg,#030810 0%,#091428 50%,#030810 100%);
  border-bottom:2px solid var(--blu);padding:12px 20px;
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
#hdr-icon{font-size:24px;filter:drop-shadow(0 0 10px var(--blu));}
#hdr h1{font-size:17px;font-weight:700;color:var(--blu2);
  text-shadow:0 0 20px rgba(58,143,255,.4);}
#hdr-sub{font-size:11px;color:var(--txt3);margin-top:1px;}
#hdr-badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.hdr-b{font-size:10px;padding:2px 8px;border-radius:10px;
  background:var(--blu3);border:1px solid rgba(58,143,255,.3);
  color:var(--blu2);font-weight:600;white-space:nowrap;}

/* ─ COMPONENT NAV ─ */
#cnav{background:var(--bg2);border-bottom:1px solid var(--border);
  padding:8px 14px;display:flex;gap:5px;flex-wrap:nowrap;
  overflow-x:auto;scrollbar-width:none;
  position:sticky;top:54px;z-index:100;}
#cnav::-webkit-scrollbar{display:none;}
.cbtn{display:flex;flex-direction:column;align-items:center;
  padding:7px 13px;border-radius:8px;border:1px solid transparent;
  cursor:pointer;background:none;color:var(--txt2);
  font-size:10px;font-weight:600;transition:.13s;
  white-space:nowrap;font-family:inherit;gap:2px;min-width:55px;}
.cbtn:hover{background:var(--bg3);color:var(--txt);}
.cbtn.on{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.05);}
.cbtn .ci{font-size:18px;}

/* ─ MAIN ─ */
#main{padding:18px;max-width:1100px;margin:0 auto;}

/* ─ OVERVIEW ─ */
.ov-intro{background:var(--bg2);border:1px solid var(--border2);
  border-radius:10px;padding:18px;margin-bottom:18px;}
.ov-intro h2{font-size:16px;color:var(--blu2);margin-bottom:8px;}
.ov-intro p{font-size:13px;color:var(--txt2);line-height:1.7;}
.ov-parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:18px;}
.ov-part{background:var(--bg3);border:1px solid var(--border);
  border-radius:8px;padding:14px 10px;text-align:center;cursor:pointer;transition:.15s;}
.ov-part:hover{border-color:var(--border2);background:var(--bg4);}
.ov-part .op-icon{font-size:28px;margin-bottom:6px;}
.ov-part .op-name{font-size:12px;font-weight:700;color:var(--txt);}
.ov-part .op-tag{font-size:10px;color:var(--txt3);margin-top:2px;}
.build-title{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:12px;}
.build-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.build-card{border-radius:8px;padding:16px;border:1px solid;}
.build-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.build-hdr h3{font-size:14px;font-weight:800;}
.build-total{font-size:20px;font-weight:800;margin-bottom:12px;}
.build-items{display:flex;flex-direction:column;gap:5px;}
.build-item{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,.06);}
.build-item .bi-label{color:var(--txt3);}
.build-item .bi-val{color:var(--txt);font-weight:600;}
.build-note{font-size:11px;margin-top:10px;padding:8px;border-radius:5px;
  background:rgba(255,255,255,.04);color:var(--txt3);}

/* ─ HERO ─ */
.hero{border-radius:10px;padding:22px;margin-bottom:16px;
  background:linear-gradient(135deg,var(--bg2),var(--bg3));
  border:1px solid var(--border2);
  display:flex;align-items:flex-start;gap:18px;
  position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;top:-40%;right:-5%;
  width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,var(--pca,rgba(58,143,255,.1)),transparent 70%);
  pointer-events:none;}
.hero-icon{font-size:54px;flex-shrink:0;filter:drop-shadow(0 0 18px var(--pc,var(--blu)));}
.hero-txt h2{font-size:22px;font-weight:800;color:#fff;margin-bottom:3px;}
.hero-tag{display:inline-block;font-size:10px;padding:2px 9px;
  border-radius:10px;font-weight:700;margin-bottom:8px;}
.hero-analogy{color:var(--txt2);font-size:13px;margin-bottom:8px;}
.hero-role{color:var(--txt);font-size:13px;
  background:rgba(255,255,255,.04);border-radius:6px;padding:9px 12px;
  border-left:3px solid var(--pc,var(--blu));}

/* ─ SECTION ─ */
.sec{background:var(--bg2);border:1px solid var(--border);
  border-radius:9px;margin-bottom:14px;overflow:hidden;}
.sec-hdr{padding:12px 16px;display:flex;align-items:center;gap:8px;
  cursor:pointer;user-select:none;transition:.13s;}
.sec-hdr:hover{background:var(--bg3);}
.sec-hdr.op{border-bottom:1px solid var(--border);}
.sec-hdr h3{font-size:13px;font-weight:700;color:var(--txt);}
.sec-arr{margin-left:auto;color:var(--txt3);transition:.2s;font-size:12px;}
.sec-hdr.op .sec-arr{transform:rotate(180deg);}
.sec-body{padding:16px;display:none;}
.sec-body.op{display:block;}

/* ─ SPEC CARDS ─ */
.spec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.spc{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:14px;}
.spc-hdr{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.spc-hdr .si{font-size:17px;}
.spc-hdr h4{font-size:13px;font-weight:700;color:var(--txt);}
.spc-unit{font-size:10px;padding:2px 7px;border-radius:8px;
  background:rgba(255,255,255,.06);color:var(--txt3);font-weight:600;
  margin-left:auto;white-space:nowrap;}
.spc-easy{color:var(--blu2);font-size:12px;margin-bottom:6px;
  background:var(--blu3);border-radius:4px;padding:4px 8px;}
.spc-detail{color:var(--txt3);font-size:12px;line-height:1.6;
  border-left:2px solid var(--border2);padding-left:8px;margin-bottom:8px;}
.spc-exs{display:flex;flex-direction:column;gap:3px;}
.spc-ex{display:flex;align-items:center;gap:6px;
  font-size:12px;padding:3px 7px;border-radius:4px;
  background:rgba(255,255,255,.03);}
.spc-ex-l{font-weight:600;color:var(--txt);min-width:90px;flex-shrink:0;}
.spc-ex-n{color:var(--txt3);}
.spc-tip{margin-top:8px;padding:7px 9px;
  background:rgba(58,143,255,.06);border:1px solid rgba(58,143,255,.15);
  border-radius:5px;font-size:11px;color:var(--blu2);}

/* ─ TIER CARDS ─ */
.tier-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.tc{border-radius:8px;padding:14px;border:1px solid;}
.tc-hdr{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.tc-badge{font-size:15px;}
.tc-name{font-size:14px;font-weight:800;}
.tc-price{display:inline-block;font-size:11px;padding:2px 9px;
  border-radius:10px;font-weight:700;margin-bottom:10px;}
.tc-models{margin-bottom:8px;}
.tc-models h5,.tc-list h5{font-size:10px;color:var(--txt3);
  text-transform:uppercase;margin-bottom:4px;letter-spacing:.5px;}
.tc-model{font-size:12px;margin-bottom:3px;}
.tc-model strong{color:var(--txt);}
.tc-model span{color:var(--txt3);font-size:11px;display:block;}
.tc-li{font-size:12px;color:var(--txt2);padding:1px 0;}
.tc-target{font-size:12px;font-weight:600;margin-top:8px;padding:6px 8px;
  border-radius:5px;background:rgba(255,255,255,.04);}
.tc-list{margin-bottom:6px;}

/* ─ PRICE TABLE ─ */
.ptbl-wrap{overflow-x:auto;}
.ptbl{width:100%;border-collapse:collapse;font-size:12px;}
.ptbl th,.ptbl td{padding:7px 11px;text-align:center;border:1px solid var(--border);}
.ptbl th{background:var(--bg4);color:var(--txt2);font-weight:600;font-size:11px;}
.ptbl td:first-child{font-weight:600;color:var(--txt3);background:var(--bg3);
  text-align:left;white-space:nowrap;}
.ptbl tr:nth-child(even) td{background:rgba(255,255,255,.02);}
.ptbl tr.cur td{background:rgba(58,143,255,.08);font-weight:600;}
.ptbl tr.cur td:first-child{color:var(--blu2);}
.pnote{font-size:11px;color:var(--txt3);margin-top:8px;}
.panalysis{margin-top:12px;padding:11px 13px;
  background:rgba(240,192,48,.06);border:1px solid rgba(240,192,48,.2);
  border-radius:6px;font-size:12px;color:var(--yel);line-height:1.7;}

/* ─ TIPS ─ */
.tip-list{display:flex;flex-direction:column;gap:9px;}
.tip-item{display:flex;gap:10px;align-items:flex-start;
  padding:11px 13px;border-radius:7px;
  background:var(--bg3);border:1px solid var(--border);}
.tip-icon{font-size:17px;flex-shrink:0;}
.tip-txt{font-size:13px;color:var(--txt2);line-height:1.6;}

/* ─ SCROLLBAR ─ */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ─ RESPONSIVE ─ */
@media(max-width:600px){
  .hero{flex-direction:column;gap:12px;}
  .hero-icon{font-size:42px;}
  .hero-txt h2{font-size:18px;}
  .spec-grid,.tier-grid,.build-grid,.ov-parts{grid-template-columns:1fr;}
}
</style>
</head>

// ════════════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════════════

let cur = null; // null = overview

function renderNav() {
  const nav = document.getElementById('cnav');
  const ovBtn = `<button class="cbtn${cur===null?' on':''}" onclick="sel(null)">
    <span class="ci">🗺️</span><span>전체가이드</span></button>`;
  const partBtns = PARTS.map(p=>`
    <button class="cbtn${cur&&cur.id===p.id?' on':''}"
      style="${cur&&cur.id===p.id?`color:${p.color};border-color:${p.colorBorder};background:${p.colorBg};`:''}"
      onclick="sel('${p.id}')">
      <span class="ci">${p.icon}</span><span>${p.name}</span>
    </button>`).join('');
  nav.innerHTML = ovBtn + partBtns;
}

function renderOverview() {
  const partGrid = PARTS.map(p=>`
    <div class="ov-part" onclick="sel('${p.id}')">
      <div class="op-icon">${p.icon}</div>
      <div class="op-name">${p.name}</div>
      <div class="op-tag">${p.tagline}</div>
    </div>`).join('');

  const buildCards = OVERVIEW.builds.map(b=>`
    <div class="build-card" style="background:${b.colorBg};border-color:${b.colorBorder};">
      <div class="build-hdr">
        <span style="font-size:18px;">${b.badge}</span>
        <h3 style="color:${b.color};">${b.name}</h3>
      </div>
      <div class="build-total" style="color:${b.color};">${b.total}</div>
      <div style="font-size:11px;color:var(--txt3);margin-bottom:10px;">용도: ${b.use}</div>
      <div class="build-items">
        ${b.items.map(i=>`
          <div class="build-item">
            <span class="bi-label">${i.label}</span>
            <span style="color:var(--txt2);font-size:11px;">${i.val}</span>
            <span class="bi-val">${i.price}</span>
          </div>`).join('')}
      </div>
      <div class="build-note">${b.note}</div>
    </div>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="ov-intro">
      <h2>🖥️ 컴퓨터는 어떤 부품으로 이루어져 있을까?</h2>
      <p style="margin-top:8px;">데스크탑 컴퓨터는 8가지 핵심 부품으로 구성됩니다. 각 부품을 클릭하면 상세 설명, 스펙 해설, 등급 비교, 가격 추이를 확인할 수 있습니다.<br>아래 예산 가이드를 보면 "어느 정도 예산으로 어떤 수준의 PC"를 맞출 수 있는지 한눈에 파악할 수 있습니다.</p>
    </div>
    <div class="ov-parts">${partGrid}</div>
    <div class="build-title">💰 예산별 완성 빌드 예시 (2025년 기준)</div>
    <div class="build-grid">${buildCards}</div>
  `;
}

function renderPart(p) {
  const sty = `--pc:${p.color};--pca:${p.colorBg};`;
  document.getElementById('main').innerHTML = `
    <div class="hero" style="${sty}">
      <div class="hero-icon">${p.icon}</div>
      <div class="hero-txt">
        <h2>${p.fullName}</h2>
        <div class="hero-tag" style="background:${p.colorBg};border:1px solid ${p.colorBorder};color:${p.color};">${p.tagline}</div>
        <div class="hero-analogy">${p.analogy}</div>
        <div class="hero-role">${p.role}</div>
      </div>
    </div>
    ${mkSec('📊 핵심 스펙 이해하기','sp', mkSpecs(p.specs,p.color))}
    ${mkSec('🏆 등급 비교 (보급 / 중급 / 고급)','tr', mkTiers(p.tiers))}
    ${mkSec('💰 가격 추이 & 정가 판단','pr', mkPrice(p.priceHistory))}
    ${mkSec('💡 구매 팁','ti', mkTips(p.tips))}
  `;
  document.querySelectorAll('.sec-hdr').forEach(h=>{
    h.addEventListener('click',()=>{
      h.classList.toggle('op');
      h.nextElementSibling.classList.toggle('op');
    });
    h.classList.add('op');
    h.nextElementSibling.classList.add('op');
  });
}

function mkSec(title,key,body){
  return `<div class="sec" id="s-${key}">
    <div class="sec-hdr"><h3>${title}</h3><span class="sec-arr">▼</span></div>
    <div class="sec-body">${body}</div>
  </div>`;
}

function mkSpecs(specs){
  return `<div class="spec-grid">${specs.map(s=>`
    <div class="spc">
      <div class="spc-hdr">
        <span class="si">${s.icon}</span><h4>${s.name}</h4>
        <span class="spc-unit">${s.unit}</span>
      </div>
      <div class="spc-easy">💬 ${s.easy}</div>
      <div class="spc-detail">${s.detail}</div>
      <div class="spc-exs">
        ${s.examples.map(e=>`
          <div class="spc-ex">
            <span class="spc-ex-l">${e.label}</span>
            <span class="spc-ex-n">→ ${e.note}</span>
          </div>`).join('')}
      </div>
      ${s.tip?`<div class="spc-tip">💡 ${s.tip}</div>`:''}
    </div>`).join('')}</div>`;
}

function mkTiers(tiers){
  return `<div class="tier-grid">${tiers.map(t=>`
    <div class="tc" style="background:${t.colorBg};border-color:${t.colorBorder};">
      <div class="tc-hdr">
        <span class="tc-badge">${t.badge}</span>
        <span class="tc-name" style="color:${t.color};">${t.tier}</span>
      </div>
      <div class="tc-price" style="background:${t.colorBg};border:1px solid ${t.colorBorder};color:${t.color};">
        💰 ${t.priceRange}
      </div>
      <div class="tc-models">
        <h5>대표 모델</h5>
        ${t.models.map(m=>`<div class="tc-model"><strong>${m.name}</strong><span>${m.spec}</span></div>`).join('')}
      </div>
      <div class="tc-list"><h5>✅ 장점</h5>${t.pros.map(p=>`<div class="tc-li">· ${p}</div>`).join('')}</div>
      <div class="tc-list"><h5>⚠️ 단점</h5>${t.cons.map(c=>`<div class="tc-li">· ${c}</div>`).join('')}</div>
      <div class="tc-target">${t.target}</div>
    </div>`).join('')}</div>`;
}

function mkPrice(ph){
  const hdrs = ph.headers.map(h=>`<th>${h.replace('\n','<br>')}</th>`).join('');
  const rows = ph.rows.map(r=>{
    const label = r.note
      ? `${r.y}<br><span style="font-size:10px;color:var(--txt3);font-weight:400;">${r.note}</span>`
      : r.y;
    const cells = r.v.map(v=>`<td>${v}</td>`).join('');
    return `<tr${r.cur?' class="cur"':''}><td>${label}</td>${cells}</tr>`;
  }).join('');
  return `
    <p class="pnote">※ ${ph.note}</p>
    <div class="ptbl-wrap" style="margin-top:10px;">
      <table class="ptbl"><thead><tr>${hdrs}</tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="panalysis">${ph.analysis}</div>`;
}

function mkTips(tips){
  return `<div class="tip-list">${tips.map(t=>`
    <div class="tip-item">
      <span class="tip-icon">${t.icon}</span>
      <span class="tip-txt">${t.txt}</span>
    </div>`).join('')}</div>`;
}

function sel(id){
  cur = id===null ? null : PARTS.find(p=>p.id===id);
  renderNav();
  if(cur===null) renderOverview();
  else renderPart(cur);
  window.scrollTo(0,0);
}

// Init
renderNav();
renderOverview();
</script>
</body>
</html>
