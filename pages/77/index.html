<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>그늘 산책</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}
body{touch-action:none;-webkit-tap-highlight-color:transparent;}

#stage{position:fixed;inset:0;background:#000;}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
#fx{pointer-events:none;}

/* ── 시작 화면 : 글자 없이 픽토그램만 ─────────────── */
#gate{position:fixed;inset:0;z-index:50;background:#000;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:opacity 1.1s ease;}
#gate.off{opacity:0;pointer-events:none;}
#gate svg{width:150px;height:150px;opacity:.5;animation:breathe 3.4s ease-in-out infinite;}
@keyframes breathe{
  0%,100%{opacity:.22;transform:scale(.97);}
  50%    {opacity:.62;transform:scale(1.03);}
}

/* ── 하단 픽토그램 UI ─────────────────────────── */
#hud{position:fixed;left:0;right:0;bottom:14px;z-index:40;
  display:flex;align-items:center;justify-content:center;gap:9px;
  pointer-events:none;opacity:0;transition:opacity 1.4s ease;}
#hud.on{opacity:.5;}
#hud .dot{width:5px;height:5px;border-radius:50%;background:#fff;opacity:.16;
  transition:opacity .6s ease,transform .6s ease;}
#hud .dot.on{opacity:.85;transform:scale(1.7);}
#hud .dot.past{opacity:.4;}

#mute{position:fixed;right:14px;bottom:11px;z-index:41;width:26px;height:26px;
  border:none;background:none;cursor:pointer;opacity:0;padding:0;
  transition:opacity 1.4s ease;}
#mute.on{opacity:.3;}
#mute:hover{opacity:.75 !important;}
#mute svg{width:100%;height:100%;display:block;}

/* 시스템 커서 숨김 — 화면 안의 빛이 곧 포인터 */
#stage.playing{cursor:none;}
</style>
</head>
<body>

<div id="stage">
  <canvas id="world"></canvas>
  <canvas id="fx"></canvas>
</div>

<div id="gate">
  <!-- 마우스 + 사방 화살표 픽토그램 -->
  <svg viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="2.2"
       stroke-linecap="round" stroke-linejoin="round">
    <rect x="49" y="40" width="22" height="34" rx="11"/>
    <line x1="60" y1="47" x2="60" y2="55"/>
    <path d="M60 26 L60 14 M55 19 L60 14 L65 19"/>
    <path d="M60 94 L60 106 M55 101 L60 106 L65 101"/>
    <path d="M34 57 L22 57 M27 52 L22 57 L27 62"/>
    <path d="M86 57 L98 57 M93 52 L98 57 L93 62"/>
  </svg>
</div>

<div id="hud"></div>

<button id="mute" aria-label="sound">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/>
    <path id="wave1" d="M15.5 9.5a4 4 0 0 1 0 5"/>
    <path id="wave2" d="M18 7a7.5 7.5 0 0 1 0 10"/>
    <path id="slash" d="M15.5 9.5 L21 15" style="display:none"/>
  </svg>
</button>

<script src="app.js"></script>
</body>
</html>
