<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말한 대로 받아쓰기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0b0d12;--bg2:#111520;--bg3:#171d2a;--bg4:#202839;
  --border:#232c3d;--border2:#334156;
  --txt:#e4eaf5;--txt2:#8fa0bd;--txt3:#5b6b87;
  --acc:#4b8dff;--acc2:#84b3ff;--accB:rgba(75,141,255,.13);
  --rec:#f0525f;--rec2:#ff8a94;--recB:rgba(240,82,95,.13);
  --ok:#35c98a;--ok2:#6fe6b3;--okB:rgba(53,201,138,.13);
  --gold:#e0b13c;--gold2:#ffd570;--goldB:rgba(224,177,60,.13);
  --mono:'Consolas','Menlo','Courier New',monospace;
}
body{background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  font-size:14px;line-height:1.7;min-height:100vh;-webkit-text-size-adjust:100%;}

/* ── 헤더 ─────────────────────────────────── */
#hdr{background:linear-gradient(135deg,#070910,#0f1626,#070910);
  border-bottom:1px solid var(--border2);padding:10px 16px;
  position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
#hdr h1{font-size:16px;font-weight:700;white-space:nowrap;}
#hdr .sub{font-size:11px;color:var(--txt3);}
#hdr .spacer{flex:1;}
select{background:var(--bg3);border:1px solid var(--border2);color:var(--txt);
  border-radius:6px;padding:5px 9px;font-size:12px;font-family:inherit;outline:none;cursor:pointer;}
select:focus{border-color:var(--acc);}

#warn{display:none;margin:12px 16px 0;padding:10px 13px;border-radius:8px;
  background:var(--goldB);border-left:3px solid var(--gold);font-size:12.5px;color:var(--txt2);}
#warn.on{display:block;}
#warn b{color:var(--gold2);}
#warn code{font-family:var(--mono);font-size:11.5px;background:rgba(0,0,0,.3);
  padding:1px 5px;border-radius:3px;color:var(--txt);}

#main{max-width:1060px;margin:0 auto;padding:16px;}

/* ── 녹음 조작부 ───────────────────────────── */
#deck{background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:20px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  justify-content:center;margin-bottom:14px;}

#micWrap{position:relative;width:96px;height:96px;flex:none;}
#ring{position:absolute;inset:0;border-radius:50%;
  border:2px solid var(--border2);transition:.25s;}
#level{position:absolute;inset:0;border-radius:50%;
  border:3px solid var(--rec);opacity:0;transform:scale(1);transition:opacity .2s;}
#recBtn{position:absolute;inset:8px;border-radius:50%;border:none;cursor:pointer;
  background:var(--bg4);color:var(--txt2);display:flex;align-items:center;
  justify-content:center;transition:.2s;padding:0;}
#recBtn:hover{background:#2a3448;color:var(--txt);}
#recBtn svg{width:34px;height:34px;}
#recBtn:disabled{opacity:.4;cursor:not-allowed;}
body.rec #recBtn{background:var(--rec);color:#fff;}
body.rec #ring{border-color:var(--rec);animation:pulse 1.6s ease-out infinite;}
body.rec #level{opacity:.55;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,82,95,.45);}70%{box-shadow:0 0 0 18px rgba(240,82,95,0);}100%{box-shadow:0 0 0 0 rgba(240,82,95,0);}}

#deckInfo{display:flex;flex-direction:column;gap:5px;min-width:190px;}
#timer{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:1px;line-height:1.1;}
#state{font-size:12.5px;color:var(--txt2);display:flex;align-items:center;gap:7px;}
#state .led{width:7px;height:7px;border-radius:50%;background:var(--txt3);flex:none;}
body.rec #state .led{background:var(--rec);animation:blink 1.1s infinite;}
@keyframes blink{50%{opacity:.25;}}
#miniStat{font-size:11.5px;color:var(--txt3);font-family:var(--mono);}

/* ── 버튼 ─────────────────────────────────── */
.btn{border:1px solid var(--border2);background:var(--bg3);color:var(--txt2);
  border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:hover:not(:disabled){background:var(--bg4);color:var(--txt);border-color:#42536e;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.pri{background:var(--accB);border-color:rgba(75,141,255,.45);color:var(--acc2);}
.btn.pri:hover:not(:disabled){background:rgba(75,141,255,.22);color:#fff;}
.btn.good{background:var(--okB);border-color:rgba(53,201,138,.45);color:var(--ok2);}
.btn.good:hover:not(:disabled){background:rgba(53,201,138,.22);color:#fff;}
.btn svg{width:14px;height:14px;flex:none;}
#deckBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}

/* ── 패널 ─────────────────────────────────── */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  margin-bottom:14px;overflow:hidden;}
.phead{display:flex;align-items:center;gap:9px;padding:10px 14px;
  background:var(--bg3);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.phead h2{font-size:13px;font-weight:700;}
.phead .cnt{font-size:11px;color:var(--txt3);font-family:var(--mono);}
.phead .sp{flex:1;}
.pbody{padding:14px;}

#script{width:100%;min-height:190px;resize:vertical;background:var(--bg);
  border:1px solid var(--border);border-radius:8px;padding:12px 13px;color:var(--txt);
  font-family:inherit;font-size:14.5px;line-height:1.85;outline:none;}
#script:focus{border-color:var(--acc);}
#script[readonly]{color:var(--txt);background:#090b10;}
#interim{margin-top:8px;font-size:14px;color:var(--txt3);min-height:22px;
  font-style:italic;padding-left:2px;}
#interim:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--rec);margin-right:7px;vertical-align:middle;opacity:0;}
body.rec #interim:before{opacity:1;animation:blink 1.1s infinite;}

/* ── 요약 ─────────────────────────────────── */
#sumEmpty{color:var(--txt3);font-size:13px;text-align:center;padding:26px 0;}
.oneline{background:var(--accB);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;
  padding:11px 14px;font-size:15px;font-weight:600;line-height:1.65;margin-bottom:14px;color:#fff;}
.sblock{margin-bottom:14px;}
.slabel{font-size:11px;font-weight:700;color:var(--txt3);letter-spacing:.6px;
  margin-bottom:7px;text-transform:uppercase;}
ol.points{list-style:none;counter-reset:p;}
ol.points li{counter-increment:p;position:relative;padding:6px 0 6px 27px;
  font-size:14px;line-height:1.7;border-bottom:1px solid rgba(35,44,61,.7);}
ol.points li:last-child{border-bottom:none;}
ol.points li:before{content:counter(p);position:absolute;left:0;top:8px;
  width:18px;height:18px;border-radius:50%;background:var(--bg4);color:var(--acc2);
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{background:var(--bg3);border:1px solid var(--border2);border-radius:14px;
  padding:3px 11px;font-size:12px;color:var(--txt2);cursor:pointer;transition:.15s;}
.chip:hover{border-color:var(--acc);color:var(--acc2);}
.chip b{color:var(--txt3);font-size:10px;font-weight:600;margin-left:4px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;text-align:center;}
.stat .v{font-size:17px;font-weight:700;font-family:var(--mono);color:var(--acc2);line-height:1.25;}
.stat .k{font-size:10.5px;color:var(--txt3);margin-top:1px;}

label.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;
  color:var(--txt2);cursor:pointer;user-select:none;}
label.chk input{accent-color:var(--acc);width:14px;height:14px;cursor:pointer;}

/* ── 토스트 ───────────────────────────────── */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);
  background:var(--bg4);border:1px solid var(--border2);border-radius:9px;
  padding:9px 17px;font-size:13px;color:var(--txt);z-index:400;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 26px rgba(0,0,0,.5);}
#toast.on{opacity:1;transform:translate(-50%,0);}
#toast.err{border-color:var(--rec);color:var(--rec2);}

footer{color:var(--txt3);font-size:11.5px;text-align:center;
  padding:8px 16px 28px;line-height:1.8;}

@media(max-width:560px){
  #deck{padding:16px 12px;gap:14px;}
  #timer{font-size:25px;}
  #main{padding:12px;}
}
</style>
</head>
<body>

<div id="hdr">
  <h1>🎙️ 말한 대로 받아쓰기</h1>
  <span class="sub">말하면 받아쓰고, 멈추면 정리해 줍니다</span>
  <span class="spacer"></span>
  <select id="lang">
    <option value="ko-KR" selected>한국어</option>
    <option value="en-US">English (US)</option>
    <option value="ja-JP">日本語</option>
    <option value="zh-CN">中文 (简体)</option>
    <option value="es-ES">Español</option>
  </select>
</div>

<div id="warn"></div>

<div id="main">

  <!-- 녹음 조작부 -->
  <div id="deck">
    <div id="micWrap">
      <div id="ring"></div>
      <div id="level"></div>
      <button id="recBtn" title="녹음 시작 / 정지">
        <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2.5" width="6" height="11.5" rx="3"/>
          <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/>
          <line x1="12" y1="18" x2="12" y2="21.5"/>
        </svg>
      </button>
    </div>

    <div id="deckInfo">
      <div id="timer">00:00</div>
      <div id="state"><span class="led"></span><span id="stateTxt">대기 중 — 버튼을 누르면 시작합니다</span></div>
      <div id="miniStat">0자 · 0단어</div>
    </div>

    <div id="deckBtns">
      <button class="btn" id="clearBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
        전체 지우기
      </button>
      <button class="btn" id="saveBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
        .txt 저장
      </button>
    </div>
  </div>

  <!-- 받아쓴 내용 -->
  <div class="panel">
    <div class="phead">
      <h2>받아쓴 내용</h2>
      <span class="cnt" id="scriptCnt">0자</span>
      <span class="sp"></span>
      <button class="btn" id="copyAll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        전문 복사
      </button>
    </div>
    <div class="pbody">
      <textarea id="script" placeholder="녹음 버튼을 누르고 말하면 여기에 그대로 적힙니다.&#10;녹음이 끝난 뒤에는 직접 고쳐 쓸 수도 있고, 다른 곳의 글을 붙여넣어 정리만 시킬 수도 있습니다."></textarea>
      <div id="interim"></div>
    </div>
  </div>

  <!-- 정리 -->
  <div class="panel">
    <div class="phead">
      <h2>정리된 내용</h2>
      <span class="sp"></span>
      <label class="chk"><input type="checkbox" id="deFiller" checked>군더더기 정리</label>
      <button class="btn pri" id="sumBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h7"/></svg>
        다시 정리
      </button>
      <button class="btn good" id="copySum">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        정리 복사
      </button>
    </div>
    <div class="pbody">
      <div id="sumEmpty">녹음을 마치면 여기에 자동으로 정리됩니다.<br>
        위 칸에 글을 붙여넣고 <b style="color:var(--acc2)">다시 정리</b>를 눌러도 됩니다.</div>
      <div id="sumBody" style="display:none"></div>
    </div>
  </div>

</div>

<footer>
  음성 인식은 브라우저의 Web Speech API를 사용합니다 · 정리는 이 페이지 안에서 계산합니다<br>
  녹음한 소리는 저장하지 않으며, 받아쓴 글도 이 브라우저 밖으로 나가지 않습니다
</footer>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
