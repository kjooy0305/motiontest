<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>코드의 세계</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0d0d1a;--sb:#111122;--bdr:#252540;--card:#131326;
  --acc:#6c8eff;--tx:#cccce8;--mu:#5a5a88;--cbg:#080814;
  --kw:#c586c0;--st:#ce9178;--cm:#4e7550;--nu:#b5cea8;--bi:#9cdcfe;
}
body{background:var(--bg);color:var(--tx);font:14px/1.6 'Segoe UI',system-ui,sans-serif;display:flex;height:100vh;overflow:hidden;}

/* ── 사이드바 ── */
#sidebar{width:246px;min-width:246px;background:var(--sb);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden;}
#sw{padding:10px 12px;border-bottom:1px solid var(--bdr);}
#search{width:100%;padding:7px 12px;background:#181830;border:1px solid var(--bdr);border-radius:8px;color:var(--tx);font-size:13px;outline:none;}
#search:focus{border-color:var(--acc);}
#search::placeholder{color:var(--mu);}
#nav{flex:1;overflow-y:auto;padding:6px 0;}
#nav::-webkit-scrollbar{width:4px;}
#nav::-webkit-scrollbar-thumb{background:#2a2a48;border-radius:2px;}
.ch{padding:7px 12px 3px;font-size:10px;font-weight:700;letter-spacing:1.8px;color:var(--mu);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.ch:hover{color:var(--tx);}
.ch .ar{transition:transform .18s;font-size:9px;}
.ch.col .ar{transform:rotate(-90deg);}
.ci.hid{display:none;}
.ni{padding:5px 12px 5px 20px;cursor:pointer;font-size:12.5px;border-left:2px solid transparent;transition:all .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9898c0;display:flex;align-items:center;gap:6px;}
.ni:hover{background:#1c1c36;color:var(--tx);}
.ni.on{border-left-color:var(--acc);color:var(--acc);background:#181830;}

/* ── 메인 ── */
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* 랜딩 그리드 */
#landing{flex:1;overflow-y:auto;padding:28px 32px;}
#landing::-webkit-scrollbar{width:5px;}
#landing::-webkit-scrollbar-thumb{background:#2a2a48;border-radius:2px;}
#landing h1{font-size:26px;font-weight:700;color:#e8e8ff;margin-bottom:6px;}
#landing p{color:var(--mu);margin-bottom:26px;font-size:13.5px;}
.gsec{margin-bottom:28px;}
.gsec h2{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.gsec h2::after{content:'';flex:1;height:1px;background:var(--bdr);}
.cards{display:flex;flex-wrap:wrap;gap:10px;}
.card{padding:14px 16px;border-radius:10px;border:1px solid var(--bdr);cursor:pointer;transition:all .16s;min-width:130px;background:var(--card);display:flex;flex-direction:column;gap:4px;}
.card:hover{transform:translateY(-2px);background:#181830;}
.card .ci{font-size:24px;}
.card .cn{font-size:13px;font-weight:600;color:#dde;}
.card .ct{font-size:11px;color:var(--mu);}
.card .cl{display:flex;gap:3px;margin-top:4px;}
.card .cl span{width:8px;height:3px;border-radius:2px;background:var(--bdr);}
.card .cl span.on{background:var(--acc);}

/* 상세 패널 */
#det{flex:1;overflow-y:auto;padding:0;display:none;}
#det::-webkit-scrollbar{width:5px;}
#det::-webkit-scrollbar-thumb{background:#2a2a48;border-radius:2px;}
#det.show{display:block;}

/* 상단 헤더 */
#dhead{border-bottom:1px solid var(--bdr);background:#0f0f20;display:flex;flex-direction:column;}
#dhead-top{padding:10px 20px;border-bottom:1px solid var(--bdr);}
#dhead-main{padding:20px 32px;display:flex;align-items:center;gap:16px;}
#dback{background:transparent;border:none;color:var(--mu);cursor:pointer;font-size:13px;padding:0;display:flex;align-items:center;gap:4px;}
#dback:hover{color:var(--tx);}
#dicon-big{font-size:44px;line-height:1;}
.dhead-info{flex:1;}
#dname{font-size:24px;font-weight:700;color:#e8e8ff;margin-bottom:3px;}
#dtype{font-size:12px;color:var(--mu);margin-bottom:6px;}
.dlv{display:flex;gap:4px;}
.dlv span{width:12px;height:4px;border-radius:2px;background:var(--bdr);}
.dlv span.on{background:var(--acc);}

/* 본문 */
#dbody{padding:24px 32px;display:flex;flex-direction:column;gap:22px;max-width:860px;}

#ddesc{color:#b0b0d0;line-height:1.8;font-size:13.5px;}

/* 기본 정보 */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.fact{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:10px 14px;}
.fact .fl{font-size:10px;color:var(--mu);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.fact .fv{font-size:13px;font-weight:600;color:#dde;}

/* 섹션 공통 */
.sec-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);margin-bottom:10px;}

/* 활용처 태그 */
.use-tags{display:flex;flex-wrap:wrap;gap:7px;}
.utag{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid;background:transparent;}

/* 장단점 */
.proscons{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pro-box,.con-box{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:14px;}
.pro-box{border-top:2px solid #22c55e;}
.con-box{border-top:2px solid #ef4444;}
.pc-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.pro-box .pc-title{color:#22c55e;}
.con-box .pc-title{color:#ef4444;}
.pc-item{font-size:12.5px;color:#b0b0d0;padding:3px 0;display:flex;gap:6px;align-items:flex-start;}
.pc-item::before{flex-shrink:0;margin-top:2px;}
.pro-box .pc-item::before{content:'✓';color:#22c55e;}
.con-box .pc-item::before{content:'✗';color:#ef4444;}

/* 생태계 */
.eco-chips{display:flex;flex-wrap:wrap;gap:7px;}
.echip{padding:4px 12px;background:#1a1a35;border:1px solid var(--bdr);border-radius:6px;font-size:12px;color:#b0b0d0;}

/* 예제 코드 */
.code-wrap{position:relative;}
#copybtn{position:absolute;top:10px;right:10px;padding:4px 11px;background:#1e1e38;border:1px solid var(--bdr);border-radius:6px;color:var(--mu);cursor:pointer;font-size:12px;transition:all .14s;z-index:2;}
#copybtn:hover{background:#2a2a48;color:var(--tx);}
pre{background:var(--cbg);border:1px solid var(--bdr);border-radius:10px;padding:18px 18px;overflow-x:auto;font:13px/1.9 'Fira Code','Consolas','Courier New',monospace;tab-size:2;}
pre::-webkit-scrollbar{height:4px;}
pre::-webkit-scrollbar-thumb{background:#2a2a48;border-radius:2px;}
.kw{color:var(--kw);}.bi{color:var(--bi);}.st{color:var(--st);}
.cm{color:var(--cm);font-style:italic;}.nu{color:var(--nu);}
</style>
</head>
<body>
<aside id="sidebar">
  <div id="sw"><input id="search" placeholder="🔍  검색..."></div>
  <nav id="nav"></nav>
</aside>
<div id="main">
  <div id="landing">
    <h1>코드의 세계</h1>
    <p>웹·앱·시스템 개발에 쓰이는 언어와 기술 30종 — 카드를 눌러 상세 정보를 확인하세요.</p>
    <div id="grid-root"></div>
  </div>
  <div id="det">
    <div id="dhead">
      <div id="dhead-top">
        <button id="dback">← 목록으로</button>
      </div>
      <div id="dhead-main">
        <div id="dicon-big"></div>
        <div class="dhead-info">
          <div id="dname"></div>
          <div id="dtype"></div>
          <div class="dlv" id="dlv"></div>
        </div>
      </div>
    </div>
    <div id="dbody">
      <p id="ddesc"></p>

      <div>
        <div class="sec-label">기본 정보</div>
        <div class="facts" id="dfacts"></div>
      </div>

      <div>
        <div class="sec-label">주요 활용처</div>
        <div class="use-tags" id="duses"></div>
      </div>

      <div class="proscons" id="dproscons"></div>

      <div>
        <div class="sec-label">대표 프레임워크 · 라이브러리</div>
        <div class="eco-chips" id="deco"></div>
      </div>

      <div>
        <div class="sec-label">간단한 예제</div>
        <div class="code-wrap">
          <button id="copybtn">복사</button>
          <pre id="codeblock"></pre>
        </div>
      </div>
    </div>
  </div>
</div>

// ── 하이라이터 ────────────────────────────────────────────────────────────────
const KWS = new Set('const let var function return if else for while do class new import export default from async await try catch finally throw typeof instanceof in of this super extends static null undefined true false def elif pass lambda yield with as not and or is del global nonlocal None True False fn mut pub use struct enum impl trait match where mod go defer select range make append public private protected void int string bool float double char abstract final override static package include typedef sizeof auto switch case break continue'.split(' '));
const BIS = new Set('print len range list dict set tuple str sum min max sorted map filter zip enumerate isinstance type console document Math JSON Object Array Promise fetch require printf cout cin fmt log http'.split(' '));

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(code){
  const sl=[]; const st=h=>{sl.push(h);return '\x00'+(sl.length-1)+'\x00';};
  let h=esc(code);
  h=h.replace(/"""[\s\S]*?"""|'''[\s\S]*?'''/g,m=>st('<span class="st">'+m+'</span>'));
  h=h.replace(/`[^`\n]*`/g,m=>st('<span class="st">'+m+'</span>'));
  h=h.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/g,m=>st('<span class="st">'+m+'</span>'));
  h=h.replace(/\/\/[^\n]*/g,m=>st('<span class="cm">'+m+'</span>'));
  h=h.replace(/#(?!include)[^\n]*/g,m=>st('<span class="cm">'+m+'</span>'));
  h=h.replace(/--[^\n]*/g,m=>st('<span class="cm">'+m+'</span>'));
  h=h.replace(/\/\*[\s\S]*?\*\//g,m=>st('<span class="cm">'+m+'</span>'));
  h=h.replace(/@[\w.]+/g,m=>st('<span class="de">'+m+'</span>'));
  h=h.replace(/\b([A-Za-z_]\w*)\b/g,(m,w)=>{
    if(KWS.has(w)) return st('<span class="kw">'+w+'</span>');
    if(BIS.has(w)) return st('<span class="bi">'+w+'</span>');
    return m;
  });
  h=h.replace(/\b(\d[\d_]*\.?\d*)\b/g,m=>st('<span class="nu">'+m+'</span>'));
  return h.replace(/\x00(\d+)\x00/g,(_,i)=>sl[+i]);
}

// ── 카테고리 색 ───────────────────────────────────────────────────────────────
const CC={'프론트엔드':'#6c8eff','백엔드':'#a78bfa','모바일':'#f472b6','데이터베이스':'#34d399','DevOps':'#fbbf24','시스템':'#fb923c'};

// ── 사이드바 ──────────────────────────────────────────────────────────────────
let activeIdx=-1;
function buildNav(q=''){
  const nav=document.getElementById('nav');
  const cats=[...new Set(DATA.map(d=>d.cat))];
  nav.innerHTML='';
  cats.forEach(cat=>{
    const items=DATA.filter((d,i)=>{
      if(q&&!d.name.toLowerCase().includes(q)&&!d.cat.toLowerCase().includes(q)) return false;
      return d.cat===cat;
    });
    if(!items.length) return;
    const ch=document.createElement('div'); ch.className='ch';
    ch.innerHTML='<span>'+cat+'</span><span class="ar">▾</span>';
    const ci=document.createElement('div'); ci.className='ci';
    items.forEach(d=>{
      const i=DATA.indexOf(d);
      const ni=document.createElement('div'); ni.className='ni'+(i===activeIdx?' on':'');
      ni.innerHTML='<span>'+d.icon+'</span><span style="flex:1">'+d.name+'</span>';
      ni.dataset.idx=i; ni.onclick=()=>select(i);
      ci.appendChild(ni);
    });
    ch.onclick=()=>{ch.classList.toggle('col');ci.classList.toggle('hid');};
    nav.appendChild(ch); nav.appendChild(ci);
  });
}

// ── 랜딩 그리드 ──────────────────────────────────────────────────────────────
function buildGrid(){
  const root=document.getElementById('grid-root');
  const cats=[...new Set(DATA.map(d=>d.cat))];
  root.innerHTML='';
  cats.forEach(cat=>{
    const col=CC[cat]||'#6c8eff';
    const sec=document.createElement('div'); sec.className='gsec';
    sec.innerHTML='<h2>'+cat+'</h2><div class="cards"></div>';
    root.appendChild(sec);
    const wrap=sec.querySelector('.cards');
    DATA.forEach((d,i)=>{
      if(d.cat!==cat) return;
      const card=document.createElement('div'); card.className='card';
      card.style.borderColor=col+'44';
      // 난이도 점
      const dots=Array.from({length:4},(_,j)=>'<span class="'+(j<d.level?'on':'')+'"></span>').join('');
      card.innerHTML='<div class="ci">'+d.icon+'</div><div class="cn">'+d.name+'</div><div class="ct">'+d.type+'</div><div class="cl">'+dots+'</div>';
      card.onclick=()=>select(i);
      wrap.appendChild(card);
    });
  });
}

// ── 상세 패널 ────────────────────────────────────────────────────────────────
function select(i){
  activeIdx=i;
  document.querySelectorAll('.ni').forEach(el=>el.classList.toggle('on',+el.dataset.idx===i));
  const d=DATA[i];
  const col=CC[d.cat]||'#6c8eff';

  document.getElementById('landing').style.display='none';
  document.getElementById('det').classList.add('show');

  document.getElementById('dicon-big').textContent=d.icon;
  document.getElementById('dname').textContent=d.name;
  document.getElementById('dtype').textContent=d.type+' · '+d.cat;

  const lv=document.getElementById('dlv'); lv.innerHTML='';
  for(let j=1;j<=4;j++){
    const s=document.createElement('span'); if(j<=d.level) s.className='on'; lv.appendChild(s);
  }

  document.getElementById('ddesc').textContent=d.desc;

  // 기본 정보
  document.getElementById('dfacts').innerHTML=
    '<div class="fact"><div class="fl">만든 곳</div><div class="fv">'+d.by+'</div></div>'+
    '<div class="fact"><div class="fl">출시 연도</div><div class="fv">'+d.year+'년</div></div>'+
    '<div class="fact"><div class="fl">패러다임</div><div class="fv">'+d.paradigm+'</div></div>'+
    '<div class="fact"><div class="fl">타입 시스템</div><div class="fv">'+d.typing+'</div></div>';

  // 활용처
  const useEl=document.getElementById('duses'); useEl.innerHTML='';
  d.uses.forEach(u=>{
    const t=document.createElement('span'); t.className='utag';
    t.style.cssText='color:'+col+';border-color:'+col+'55;';
    t.textContent=u; useEl.appendChild(t);
  });

  // 장단점
  const pcEl=document.getElementById('dproscons');
  const pHtml=d.pros.map(p=>'<div class="pc-item">'+esc(p)+'</div>').join('');
  const cHtml=d.cons.map(c=>'<div class="pc-item">'+esc(c)+'</div>').join('');
  pcEl.innerHTML=
    '<div class="pro-box"><div class="pc-title">장점</div>'+pHtml+'</div>'+
    '<div class="con-box"><div class="pc-title">단점</div>'+cHtml+'</div>';

  // 생태계
  const ecoEl=document.getElementById('deco'); ecoEl.innerHTML='';
  d.eco.forEach(e=>{
    const c=document.createElement('span'); c.className='echip'; c.textContent=e; ecoEl.appendChild(c);
  });

  // 예제 코드
  document.getElementById('codeblock').innerHTML=hl(d.code);
  document.getElementById('det').scrollTop=0;
}

// ── 초기화 ───────────────────────────────────────────────────────────────────
buildNav(); buildGrid();
document.getElementById('search').addEventListener('input',e=>buildNav(e.target.value.toLowerCase()));
document.getElementById('dback').addEventListener('click',()=>{
  document.getElementById('landing').style.display='';
  document.getElementById('det').classList.remove('show');
  activeIdx=-1;
  document.querySelectorAll('.ni').forEach(el=>el.classList.remove('on'));
});
document.getElementById('copybtn').addEventListener('click',()=>{
  const code=DATA[activeIdx]?.code||'';
  navigator.clipboard.writeText(code).then(()=>{
    const btn=document.getElementById('copybtn');
    btn.textContent='✓ 복사됨'; btn.style.color='#22c55e';
    setTimeout(()=>{btn.textContent='복사';btn.style.color='';},1500);
  });
});
</script>
