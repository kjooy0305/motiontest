<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>단축키 모음</title>
<style>
:root{
  --bg:#080c10;--surf:#0e1318;--surf2:#131920;--bdr:#1a2028;
  --text:#c8c0b0;--dim:#556070;
  --purple:#a78bfa;--green:#34d399;--blue:#60a5fa;--yellow:#fbbf24;--red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,'Malgun Gothic',sans-serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100%;}

/* ── 상단 탭 ── */
#top{flex-shrink:0;}
#os-tabs{display:flex;background:var(--surf);border-bottom:2px solid var(--bdr);}
.ostab{flex:1;padding:10px 4px;font-size:13px;font-weight:600;cursor:pointer;
  color:var(--dim);border-bottom:3px solid transparent;text-align:center;
  transition:.15s;margin-bottom:-2px;}
.ostab:hover{color:var(--text);}
.ostab.on{color:var(--purple);border-bottom-color:var(--purple);}

/* ── 검색 & 카운트 ── */
#search-bar{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;background:var(--surf);border-bottom:1px solid var(--bdr);
}
#search-wrap{flex:1;display:flex;align-items:center;gap:6px;
  background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;padding:6px 10px;}
#search-wrap svg{flex-shrink:0;opacity:.4;}
#sq{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:12px;font-family:inherit;}
#sq::placeholder{color:var(--dim);}
#count{font-size:11px;color:var(--dim);white-space:nowrap;font-family:monospace;}

/* ── 카테고리 필터 ── */
#cat-bar{
  display:flex;gap:5px;padding:6px 12px;overflow-x:auto;
  background:var(--surf);border-bottom:1px solid var(--bdr);flex-shrink:0;
  scrollbar-width:none;
}
#cat-bar::-webkit-scrollbar{display:none;}
.cbt{
  padding:3px 10px;border-radius:20px;font-size:10px;border:1px solid var(--bdr);
  background:transparent;color:var(--dim);cursor:pointer;transition:.15s;white-space:nowrap;
  font-family:inherit;
}
.cbt:hover{color:var(--text);}
.cbt.on{border-color:var(--purple);color:var(--purple);background:rgba(167,139,250,.1);}

/* ── 스크롤 본문 ── */
#content{flex:1;overflow-y:auto;padding:10px 12px 20px;}

/* ── 카테고리 섹션 ── */
.cat-section{margin-bottom:16px;}
.cat-section.hide{display:none;}
.cat-title{
  font-size:11px;font-weight:700;color:var(--purple);letter-spacing:.8px;
  text-transform:uppercase;padding:6px 2px 6px;
  border-bottom:1px solid var(--bdr);margin-bottom:4px;
  position:sticky;top:0;background:var(--bg);z-index:2;
}

/* ── 단축키 행 ── */
.row{
  display:flex;align-items:center;gap:10px;
  padding:5px 4px;border-radius:6px;
  transition:background .1s;
  border-bottom:1px solid rgba(26,32,40,.5);
}
.row:last-child{border-bottom:none;}
.row:hover{background:rgba(167,139,250,.05);}
.row.hide{display:none;}
.row.highlight{background:rgba(167,139,250,.1);}

/* ── 키 배지 ── */
.keys{display:flex;align-items:center;gap:3px;flex-shrink:0;min-width:150px;flex-wrap:wrap;}
kbd{
  display:inline-flex;align-items:center;justify-content:center;
  padding:2px 6px;min-width:22px;
  background:var(--surf2);border:1px solid #2a3545;border-bottom:2px solid #1a2028;
  border-radius:5px;font-family:monospace;font-size:10px;color:var(--text);
  font-weight:600;white-space:nowrap;line-height:1.4;
}
kbd.special{color:var(--blue);border-color:#1a2d45;}
kbd.win{color:var(--purple);border-color:#2a1d45;}
kbd.arrow{font-size:12px;}
.plus{color:var(--dim);font-size:10px;margin:0 1px;}
.desc{font-size:12px;color:var(--text);flex:1;line-height:1.4;}
.desc em{color:var(--dim);font-size:10px;font-style:normal;}

/* ── 빈 검색 ── */
#empty{display:none;text-align:center;padding:40px 20px;color:var(--dim);font-size:13px;}
#empty.show{display:block;}

/* 스크롤바 */
#content::-webkit-scrollbar{width:4px;}
#content::-webkit-scrollbar-track{background:transparent;}
#content::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}
</style>
</head>

<div id="empty">검색 결과가 없습니다.</div>

</div>

// ══════════════════════════════════════
//  상태
// ══════════════════════════════════════
let curOS = 'win';
let curCat = 'all';
let searchQ = '';

// ══════════════════════════════════════
//  렌더
// ══════════════════════════════════════
const SPECIAL_KEYS = new Set(['Ctrl','Shift','Alt','⊞ Win','Win','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12','PrtScn','Esc','Enter','Tab','Delete','Backspace','Insert','Home','End','PgUp','PgDn','Pause','Break','Num Lock','Space']);
const ARROW_KEYS = new Set(['←','→','↑','↓']);

function kbdHtml(k) {
  const isArrow = ARROW_KEYS.has(k);
  const isWin   = k.includes('Win');
  const isSp    = SPECIAL_KEYS.has(k) || k.startsWith('F') || isArrow;
  const cls     = isArrow ? 'arrow' : isWin ? 'win' : isSp ? 'special' : '';
  return `<kbd${cls?' class="'+cls+'"':''}>${k}</kbd>`;
}

function renderRow(item, idx) {
  const keysHtml = item.k.map(kbdHtml).join('<span class="plus">+</span>');
  const search = [...item.k, item.d].join(' ').toLowerCase();
  return `<div class="row" data-search="${search}" data-idx="${idx}">${keysHtml}<span class="desc">${item.d}</span></div>`;
}

function renderAll() {
  const data = DATA[curOS];
  const content = document.getElementById('content');

  content.innerHTML = data.map(sec => {
    const rows = sec.list.map((item,i) => renderRow(item, i)).join('');
    return `<div class="cat-section" data-cat="${sec.cat}">
      <div class="cat-title">${sec.cat}</div>
      <div class="rows">${rows}</div>
    </div>`;
  }).join('');

  buildCatBar(data);
  updateCount();
}

function buildCatBar(data) {
  const bar = document.getElementById('cat-bar');
  bar.innerHTML = `<button class="cbt${curCat==='all'?' on':''}" onclick="filterCat('all')">전체</button>` +
    data.map(s => `<button class="cbt${curCat===s.cat?' on':''}" onclick="filterCat('${s.cat.replace(/'/g,"\\'")}')">${s.cat}</button>`).join('');
}

// ══════════════════════════════════════
//  필터
// ══════════════════════════════════════
function filterCat(cat) {
  curCat = cat;
  document.querySelectorAll('.cbt').forEach(b => b.classList.remove('on'));
  event?.target?.classList.add('on');
  applyFilters();
}

function onSearch() {
  searchQ = document.getElementById('sq').value.trim().toLowerCase();
  applyFilters();
}

function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.cat-section').forEach(sec => {
    const secCat = sec.dataset.cat;
    const catMatch = curCat === 'all' || curCat === secCat;
    if (!catMatch) { sec.classList.add('hide'); return; }
    sec.classList.remove('hide');

    let secVisible = 0;
    sec.querySelectorAll('.row').forEach(row => {
      const match = !searchQ || row.dataset.search.includes(searchQ);
      row.classList.toggle('hide', !match);
      if (match) { secVisible++; visible++; }
    });

    // 검색 중이고 이 섹션에 결과 없으면 섹션 숨기기
    if (searchQ && secVisible === 0) sec.classList.add('hide');
  });

  document.getElementById('count').textContent = `${visible}개`;
  document.getElementById('empty').classList.toggle('show', visible === 0);
}

function updateCount() {
  const total = DATA[curOS].reduce((s,c)=>s+c.list.length,0);
  document.getElementById('count').textContent = `${total}개`;
}

// ══════════════════════════════════════
//  OS 전환
// ══════════════════════════════════════
function switchOS(os) {
  curOS = os;
  curCat = 'all';
  searchQ = '';
  document.getElementById('sq').value = '';
  document.querySelectorAll('.ostab').forEach((t,i)=>t.classList.toggle('on',['win','chrome'][i]===os));
  renderAll();
}

// ══════════════════════════════════════
//  초기화
// ══════════════════════════════════════
renderAll();
