<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⏳ 모래시계</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#0e0e1a;color:#e0e0f0;
  font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;padding:14px 10px;gap:10px;
}
#title{color:#e2c97e;font-size:17px;font-weight:700;letter-spacing:2px;text-shadow:0 0 10px rgba(226,201,126,.4);}
.panel{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:10px 14px;width:100%;max-width:540px;
}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.row+.row{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);}
.lbl{color:#a0a0c0;font-size:12px;white-space:nowrap;min-width:38px;}
input[type=number]{
  width:58px;padding:5px 8px;border-radius:6px;
  background:#1a1a2e;border:1px solid #3a3a5c;
  color:#e0e0f0;font-size:14px;text-align:center;
  -moz-appearance:textfield;
}
input[type=number]::-webkit-inner-spin-button{opacity:1;}
.btn{padding:5px 13px;border-radius:6px;border:1px solid rgba(255,255,255,.18);background:#2a2a4a;color:#e0e0f0;font-size:12px;cursor:pointer;transition:background .15s;}
.btn:hover{background:#3a3a5c;}
.btn-start{background:#1e4a18;border-color:#3a8030;color:#80e050;font-size:13px;padding:6px 16px;}
.btn-start:hover{background:#2a6020;}
.btn-start.running{background:#4a1a18;border-color:#803030;color:#f06060;}
.btn-reset{background:#181830;border-color:#404070;color:#7070b0;}
.tbtn{padding:3px 9px;border-radius:5px;font-size:11px;cursor:pointer;border:1px solid rgba(255,255,255,.12);background:#1a1a2e;color:#b0b0c0;transition:all .15s;}
.tbtn:hover{background:#242438;}
.tbtn.active{border-color:#e2c97e;color:#e2c97e;background:#221e0a;}
.sbtn{padding:3px 11px;border-radius:5px;font-size:12px;cursor:pointer;border:1px solid rgba(255,255,255,.12);background:#1a1a2e;color:#b0b0c0;transition:all .15s;}
.sbtn.active{border-color:#80c0ff;color:#80c0ff;background:#0a1828;}
#main-area{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:540px;}
#timer-big{font-size:40px;font-weight:700;letter-spacing:5px;color:#e2c97e;text-shadow:0 0 20px rgba(226,201,126,.5);font-variant-numeric:tabular-nums;}
#total-rem{font-size:13px;color:#7070a0;letter-spacing:1px;}
#glass-label{color:#8080a0;font-size:12px;letter-spacing:1px;}
#hg-canvas{display:block;border-radius:4px;}
#queue-wrap{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%;max-width:540px;min-height:40px;padding:6px 10px;background:rgba(0,0,0,.25);border-radius:8px;border:1px solid rgba(255,255,255,.06);}
.qi{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);font-size:11px;color:#8080a0;}
.qi.cur{background:rgba(226,201,126,.12);border-color:rgba(226,201,126,.45);color:#e2c97e;}
.qi-icon{font-size:15px;line-height:1;}
.q-empty{color:#303050;font-size:12px;}
#done-banner{display:none;position:absolute;left:50%;transform:translateX(-50%);top:42%;font-size:22px;font-weight:700;color:#e2c97e;text-shadow:0 0 20px rgba(226,201,126,.8);white-space:nowrap;pointer-events:none;}
#canvas-wrap{position:relative;}
</style>
</head>
<body>
<div id="title">⏳ 모래시계</div>
<div class="panel">
  <div class="row">
    <span class="lbl">시간</span>
    <input type="number" id="inp-h" min="0" max="99" value="0">
    <span style="color:#666;font-size:12px">시간</span>
    <input type="number" id="inp-m" min="0" max="59" value="5">
    <span style="color:#666;font-size:12px">분</span>
    <button class="btn btn-start" id="btn-start">▶ 시작</button>
    <button class="btn btn-reset" id="btn-reset">↺ 초기화</button>
  </div>
  <div class="row">
    <span class="lbl">디자인</span>
    <div id="theme-grid" style="display:flex;flex-wrap:wrap;gap:4px;"></div>
  </div>
  <div class="row">
    <span class="lbl">모래</span>
    <button class="sbtn active" data-sand="solid">단색</button>
    <button class="sbtn" data-sand="gradient">그라데이션</button>
    <button class="sbtn" data-sand="rainbow">무지개</button>
  </div>
</div>
<div id="main-area">
  <div id="timer-big">00:00</div>
  <div id="total-rem"></div>
  <div id="glass-label">시간을 설정하고 시작하세요</div>
  <div id="canvas-wrap">
    <canvas id="hg-canvas" width="260" height="380"></canvas>
    <div id="done-banner">완료! 🎉</div>
  </div>
</div>
<div id="queue-wrap"><span class="q-empty">시간을 설정하고 시작하세요</span></div>

<script>
// ─── roundRect 폴리필 ───────────────────────────────────────
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);this.beginPath();
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);
    this.lineTo(x+w,y+h-r);this.arcTo(x+w,y+h,x+w-r,y+h,r);
    this.lineTo(x+r,y+h);this.arcTo(x,y+h,x,y+h-r,r);
    this.lineTo(x,y+r);this.arcTo(x,y,x+r,y,r);this.closePath();
  };
}

// ─── 테마 (10종) ────────────────────────────────────────────
const THEMES=[
  {id:'ocean',   name:'🌊 바다',  frame:'#0c3a58',glassF:'rgba(80,180,255,.18)',glassS:'#50b0f0',
   bgT:'#061020',bgB:'#0e2840',sandA:'#f5e070',grad:['#00c8ff','#20e8c0','#f5e070']},
  {id:'land',    name:'🌿 육지',  frame:'#2a3810',glassF:'rgba(100,200,60,.14)', glassS:'#78c048',
   bgT:'#111808',bgB:'#1a2410',sandA:'#d8b050',grad:['#60d828','#d0a838','#7a4818']},
  {id:'jungle',  name:'🌴 정글',  frame:'#0e3018',glassF:'rgba(20,200,70,.14)',  glassS:'#28b850',
   bgT:'#040e08',bgB:'#0a1c10',sandA:'#c0e038',grad:['#00ff88','#88e020','#208040']},
  {id:'stone',   name:'🪨 돌',    frame:'#363636',glassF:'rgba(150,150,150,.16)',glassS:'#888888',
   bgT:'#141414',bgB:'#202020',sandA:'#c8b888',grad:['#d0c0a0','#b8a888','#786848']},
  {id:'wood',    name:'🪵 나무',  frame:'#582808',glassF:'rgba(200,130,50,.16)', glassS:'#c07028',
   bgT:'#1c0800',bgB:'#2c1200',sandA:'#f0c858',grad:['#ffd860','#d09030','#a04820']},
  {id:'machine', name:'⚙️ 기계', frame:'#282840',glassF:'rgba(90,110,200,.17)', glassS:'#7888e0',
   bgT:'#0c0c18',bgB:'#161628',sandA:'#90a0e0',grad:['#b0c8ff','#6080e0','#3848b0']},
  {id:'space',   name:'🌌 우주',  frame:'#180828',glassF:'rgba(140,60,220,.16)', glassS:'#9050e0',
   bgT:'#04020c',bgB:'#0c0818',sandA:'#e8d8ff',grad:['#ffffff','#d080ff','#5020c0']},
  {id:'glacier', name:'🧊 빙하',  frame:'#0e2838',glassF:'rgba(180,230,255,.20)',glassS:'#98d0f0',
   bgT:'#061420',bgB:'#0e2030',sandA:'#e8f6ff',grad:['#ffffff','#c8e8ff','#58b8f0']},
  {id:'lava',    name:'🌋 용암',  frame:'#380600',glassF:'rgba(255,80,20,.14)',  glassS:'#ff5818',
   bgT:'#140200',bgB:'#240600',sandA:'#ff9818',grad:['#ffff00','#ff8800','#ff2000']},
  {id:'rainbow', name:'🌈 무지개',frame:'#28280e',glassF:'rgba(255,220,80,.13)', glassS:'#f0c050',
   bgT:'#0c0c10',bgB:'#181818',sandA:'#ff8888',grad:['#ff4040','#ffb040','#40ff80','#4080ff']},
];

// ─── 캔버스 설정 ──────────────────────────────────────────────
const canvas=document.getElementById('hg-canvas');
const ctx=canvas.getContext('2d');
const W=canvas.width, H=canvas.height;

// 모래 픽셀용 오프스크린 캔버스 (putImageData + 뒤집기 transform)
const off=document.createElement('canvas');
off.width=W; off.height=H;
const offCtx=off.getContext('2d');
const imgData=offCtx.createImageData(W,H);
const dv=new Uint32Array(imgData.data.buffer);

// ─── 셀룰러 오토마타 ────────────────────────────────────────
const CELL=4;
const COLS=W/CELL|0;  // 65
const ROWS=H/CELL|0;  // 95

// 모래시계 지오메트리 (픽셀)
const CX=W*.5, CY=H*.5;
const TY=H*.04, BY=H*.96;
const BW=W*.40, NW=W*.038;
const CY_CELL=CY/CELL|0; // 47 — 넥 행

function lerp(a,b,t){return a+(b-a)*t;}
function halfW(py){
  return py<=CY ? lerp(BW,NW,(py-TY)/(CY-TY)) : lerp(NW,BW,(py-CY)/(BY-CY));
}
function clamp(v){return Math.min(255,Math.max(0,v|0));}

// 유리 내부 마스크
const isGlass=new Uint8Array(COLS*ROWS);
for(let y=0;y<ROWS;y++){
  for(let x=0;x<COLS;x++){
    const px=x*CELL+CELL/2, py=y*CELL+CELL/2;
    const hw=halfW(py);
    if(py>=TY+CELL && py<=BY-CELL && Math.abs(px-CX)<hw-CELL*.5)
      isGlass[y*COLS+x]=1;
  }
}

// 모래 그리드 (packed ARGB color, 0=비어있음)
const grid=new Uint32Array(COLS*ROWS);
let N_grains=0;

// ─── 색상 유틸 ─────────────────────────────────────────────
function packColor(r,g,b){return(0xFF<<24)|(b<<16)|(g<<8)|r;}
function hexToRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}
function hslToRgb(h,s,l){
  s/=100;l/=100;
  const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return{r:clamp(f(0)*255),g:clamp(f(8)*255),b:clamp(f(4)*255)};
}

function sandColor(x,y,sandType,theme){
  const py=y*CELL+CELL/2;
  const relY=(py-TY)/(BY-TY);
  if(sandType==='solid'){
    const c=hexToRgb(theme.sandA);
    const v=((x*13+y*7)%24)-12;
    return packColor(clamp(c.r+v),clamp(c.g+v),clamp(c.b+v));
  }
  if(sandType==='gradient'){
    const n=theme.grad.length, pos=relY*(n-1);
    const idx=Math.min(n-2,pos|0), frac=pos-idx;
    const c1=hexToRgb(theme.grad[idx]), c2=hexToRgb(theme.grad[Math.min(n-1,idx+1)]);
    return packColor(clamp(lerp(c1.r,c2.r,frac)),clamp(lerp(c1.g,c2.g,frac)),clamp(lerp(c1.b,c2.b,frac)));
  }
  // rainbow — 위치 기반 HSL
  const c=hslToRgb(relY*360,88,62);
  return packColor(c.r,c.g,c.b);
}

// 모래 초기화 (윗 방울 가득 채우기)
function initSand(){
  grid.fill(0); N_grains=0;
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const i=y*COLS+x;
      if(!isGlass[i]) continue;
      if(y*CELL+CELL/2 < CY){
        grid[i]=sandColor(x,y,currentSand,currentTheme);
        N_grains++;
      }
    }
  }
}

// ─── 물리 엔진 (페이지 30 동일 방식) ───────────────────────
let tick=0, neckAllowance=0;

function physUpdate(){
  tick++;
  const lf=(tick%2===0);
  for(let y=ROWS-2;y>=0;y--){
    for(let xi=0;xi<COLS;xi++){
      const x=lf?xi:COLS-1-xi;
      const i=y*COLS+x;
      if(!grid[i]) continue;
      // 넥 스로틀: CY_CELL-1 행에서 아래로 이동 시 제한
      const isNeck=(y===CY_CELL-1 && isGlass[i]);
      if(isNeck && neckAllowance<1) continue;
      const bel=(y+1)*COLS+x;
      if(isGlass[bel]&&!grid[bel]){
        if(isNeck) neckAllowance--;
        grid[bel]=grid[i]; grid[i]=0; continue;
      }
      const gl=Math.random()<.5;
      for(const dx of[gl?-1:1,gl?1:-1]){
        const nx=x+dx;
        if(nx<0||nx>=COLS) continue;
        const di=(y+1)*COLS+nx;
        if(isGlass[di]&&!grid[di]){
          if(isNeck) neckAllowance--;
          grid[di]=grid[i]; grid[i]=0; break;
        }
      }
    }
  }
}

// 그리드 상하 뒤집기 (180° 회전)
function flipGrid(){
  const tmp=new Uint32Array(COLS*ROWS);
  for(let y=0;y<ROWS;y++)
    for(let x=0;x<COLS;x++)
      tmp[(ROWS-1-y)*COLS+x]=grid[y*COLS+x];
  grid.set(tmp);
}

// ─── 렌더링 ────────────────────────────────────────────────
function renderSand(){
  dv.fill(0); // 투명 배경 (메인 캔버스의 배경이 보임)
  for(let gy=0;gy<ROWS;gy++){
    for(let gx=0;gx<COLS;gx++){
      const c=grid[gy*COLS+gx];
      if(!c) continue;
      for(let py=0;py<CELL;py++){
        const row=(gy*CELL+py)*W+gx*CELL;
        for(let px=0;px<CELL;px++) dv[row+px]=c;
      }
    }
  }
  offCtx.putImageData(imgData,0,0);
}

function drawBg(theme){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,theme.bgT); g.addColorStop(1,theme.bgB);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 우주: 별
  if(theme.id==='space'){
    ctx.fillStyle='rgba(255,255,255,.5)';
    for(let i=0;i<40;i++){
      ctx.beginPath();ctx.arc((i*137.5)%W,(i*73.1)%H,i%3?0.7:1.2,0,Math.PI*2);ctx.fill();
    }
  }
}
function drawFrameCaps(theme){
  const cw=BW+8,ch=13,cr=3;
  ctx.fillStyle=theme.frame;
  ctx.beginPath(); ctx.roundRect(CX-cw,TY-ch+2,cw*2,ch,cr); ctx.fill();
  ctx.beginPath(); ctx.roundRect(CX-cw,BY-2,cw*2,ch,cr); ctx.fill();
  ctx.strokeStyle=theme.glassS; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(CX-cw,TY-ch+2,cw*2,ch,cr); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(CX-cw,BY-2,cw*2,ch,cr); ctx.stroke();
}
function makeGlassPath(){
  const p=new Path2D();
  p.moveTo(CX-BW,TY); p.lineTo(CX+BW,TY);
  p.lineTo(CX+NW,CY); p.lineTo(CX+BW,BY);
  p.lineTo(CX-BW,BY); p.lineTo(CX-NW,CY);
  p.closePath(); return p;
}
function drawGlassLayer(theme){
  const gp=makeGlassPath();
  ctx.fillStyle=theme.glassF; ctx.fill(gp);
  ctx.strokeStyle=theme.glassS; ctx.lineWidth=2; ctx.stroke(gp);
  // 반사광
  ctx.save(); ctx.clip(gp);
  const sh=ctx.createLinearGradient(CX-BW,TY,CX-BW*.1,BY*.5);
  sh.addColorStop(0,'rgba(255,255,255,.14)');
  sh.addColorStop(.4,'rgba(255,255,255,.05)');
  sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sh; ctx.fill(gp); ctx.restore();
}

function drawScene(){
  drawBg(currentTheme);
  drawFrameCaps(currentTheme);
  renderSand();
  // 뒤집기 transform 적용 후 모래 그리기
  ctx.save();
  if(flipping){
    const sy=flipPhase<.5 ? 1-2*flipPhase : 2*flipPhase-1;
    ctx.translate(CX,CY); ctx.scale(1,sy); ctx.translate(-CX,-CY);
  }
  ctx.drawImage(off,0,0);
  ctx.restore();
  drawGlassLayer(currentTheme);
}

// ─── 상태 ──────────────────────────────────────────────────
let currentTheme=THEMES[0], currentSand='solid';
let running=false, queue=[], curGlass=null;
let flipping=false, flipPhase=0, gridFlipped=false;
const FLIP_DUR=0.75;
let lastTS=null, totalRemSec=0;

// ─── 시간 분해 ──────────────────────────────────────────────
function decompose(totalMin){
  const units=[60,30,15,5,1];
  const list=[];let rem=totalMin;
  for(const u of units){const n=Math.floor(rem/u);for(let i=0;i<n;i++)list.push(u);rem-=n*u;}
  return list;
}
function buildQueue(list){
  const q=[];let i=0;
  while(i<list.length){
    let j=i;while(j<list.length&&list[j]===list[i])j++;
    q.push({minutes:list[i],flipsLeft:j-i-1});i=j;
  }
  return q;
}

// ─── UI 렌더 ────────────────────────────────────────────────
function glassLabel(g){
  if(!g)return;
  const name=g.minutes===60?'1시간':`${g.minutes}분`;
  const rep=g.flipsLeft>0?` (${g.flipsLeft+1}회 연속)`:'';
  document.getElementById('glass-label').textContent=name+' 모래시계'+rep;
}
function renderQueue(){
  const wrap=document.getElementById('queue-wrap');
  if(!curGlass&&queue.length===0){wrap.innerHTML='<span class="q-empty">시간을 설정하고 시작하세요</span>';return;}
  const icon=m=>m>=60?'⏳':m>=30?'⌛':m>=15?'⏱':'⏲';
  const lab=m=>m===60?'1시간':m+'분';
  let html='';
  if(curGlass){
    const rep=curGlass.flipsLeft>0?` ×${curGlass.flipsLeft+1}`:'';
    html+=`<div class="qi cur"><span class="qi-icon">${icon(curGlass.minutes)}</span><span>${lab(curGlass.minutes)}${rep}</span></div>`;
  }
  queue.forEach(g=>{
    const rep=g.flipsLeft>0?` ×${g.flipsLeft+1}`:'';
    html+=`<div class="qi"><span class="qi-icon">${icon(g.minutes)}</span><span>${lab(g.minutes)}${rep}</span></div>`;
  });
  wrap.innerHTML=html;
}
function updateDisplays(){
  if(!curGlass){document.getElementById('timer-big').textContent='00:00';document.getElementById('total-rem').textContent='';return;}
  const rem=Math.max(0,Math.ceil(curGlass.remSec));
  document.getElementById('timer-big').textContent=String(rem/60|0).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');
  if(totalRemSec>0){
    const tr=Math.max(0,Math.ceil(totalRemSec));
    const th=tr/3600|0,tm2=(tr%3600)/60|0,ts2=tr%60;
    let tot='';if(th)tot+=th+'시간 ';if(tm2)tot+=tm2+'분 ';tot+=ts2+'초 남음';
    document.getElementById('total-rem').textContent=tot;
  }
}

// ─── 타이머 로직 ────────────────────────────────────────────
function nextGlass(){
  if(queue.length===0){
    curGlass=null;running=false;totalRemSec=0;
    const btn=document.getElementById('btn-start');
    btn.textContent='▶ 시작';btn.classList.remove('running');
    document.getElementById('glass-label').textContent='완료!';
    document.getElementById('done-banner').style.display='block';
    renderQueue();updateDisplays();drawScene();return;
  }
  curGlass=queue.shift();
  curGlass.totalSec=curGlass.minutes*60;
  curGlass.remSec=curGlass.totalSec;
  neckAllowance=0;
  initSand(); // 새 모래시계 시작 시 그리드 초기화
  glassLabel(curGlass);renderQueue();
}

// ─── 메인 루프 ──────────────────────────────────────────────
function loop(ts){
  requestAnimationFrame(loop);
  const dt=lastTS?Math.min((ts-lastTS)/1000,.1):0;
  lastTS=ts;

  if(running){
    totalRemSec=Math.max(0,totalRemSec-dt);
    if(flipping){
      flipPhase+=dt/FLIP_DUR;
      if(flipPhase>=.5&&!gridFlipped){
        flipGrid();neckAllowance=0;gridFlipped=true;
      }
      if(flipPhase>=1){
        flipping=false;flipPhase=0;gridFlipped=false;
        curGlass.flipsLeft--;
        curGlass.remSec=curGlass.totalSec;
        glassLabel(curGlass);
      }
    } else if(curGlass){
      // 넥 허용량 증가 (N_grains를 totalSec 동안 드레인)
      if(N_grains>0) neckAllowance=Math.min(neckAllowance+N_grains/curGlass.totalSec*dt,5);
      curGlass.remSec-=dt;
      if(curGlass.remSec<=0){
        if(curGlass.flipsLeft>0){flipping=true;flipPhase=0;gridFlipped=false;}
        else nextGlass();
      } else {
        physUpdate();
      }
    }
  }
  drawScene();
  updateDisplays();
}

// ─── 컨트롤 이벤트 ─────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click',()=>{
  const btn=document.getElementById('btn-start');
  if(!running&&!curGlass){
    const h=parseInt(document.getElementById('inp-h').value)||0;
    const m=parseInt(document.getElementById('inp-m').value)||0;
    const totalMin=h*60+m;
    if(totalMin<=0) return;
    queue=buildQueue(decompose(totalMin));
    totalRemSec=totalMin*60;
    document.getElementById('done-banner').style.display='none';
    nextGlass();running=true;lastTS=null;
    btn.textContent='⏸ 일시정지';btn.classList.add('running');
  } else if(running){
    running=false;btn.textContent='▶ 재개';btn.classList.remove('running');
  } else {
    running=true;lastTS=null;btn.textContent='⏸ 일시정지';btn.classList.add('running');
  }
});
document.getElementById('btn-reset').addEventListener('click',()=>{
  running=false;curGlass=null;queue=[];flipping=false;flipPhase=0;gridFlipped=false;
  neckAllowance=0;lastTS=null;totalRemSec=0;grid.fill(0);
  document.getElementById('btn-start').textContent='▶ 시작';
  document.getElementById('btn-start').classList.remove('running');
  document.getElementById('glass-label').textContent='시간을 설정하고 시작하세요';
  document.getElementById('done-banner').style.display='none';
  renderQueue();updateDisplays();
});

// 테마 버튼
const tgrid=document.getElementById('theme-grid');
THEMES.forEach(th=>{
  const b=document.createElement('button');
  b.className='tbtn'+(th===currentTheme?' active':'');
  b.textContent=th.name;
  b.addEventListener('click',()=>{
    currentTheme=th;
    document.querySelectorAll('.tbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    if(curGlass) initSand(); // 테마 변경 시 색상 재초기화
  });
  tgrid.appendChild(b);
});

// 모래 종류 버튼
document.querySelectorAll('.sbtn').forEach(b=>{
  b.addEventListener('click',()=>{
    currentSand=b.dataset.sand;
    document.querySelectorAll('.sbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    if(curGlass) initSand(); // 모래 종류 변경 시 색상 재초기화
  });
});

// ─── 초기 화면 ─────────────────────────────────────────────
drawScene();
requestAnimationFrame(loop);
</script>
</body>
</html>
