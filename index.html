<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conway's Game of Life</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #7d8590;
      --accent: #238636;
      --accent-h: #2ea043;
      --danger: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    header h1 { font-size: 15px; font-weight: 600; white-space: nowrap; }
    .stat { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .stat b { color: #39d353; font-weight: 600; }
    .hint { font-size: 12px; color: var(--muted); margin-left: auto; }
    .main { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 210px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sec-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }
    .row label { font-size: 12px; color: var(--muted); }
    input[type="number"] {
      width: 74px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      outline: none;
    }
    input[type="number"]:focus { border-color: #58a6ff; }
    .range-wrap { margin-bottom: 8px; }
    .range-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .range-top span { color: var(--text); }
    input[type="range"] { width: 100%; accent-color: #39d353; cursor: pointer; }
    btn, button {
      display: block;
      width: 100%;
      padding: 7px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      margin-bottom: 5px;
      transition: background .12s, opacity .12s;
      text-align: center;
    }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-default { background: transparent; color: var(--text); }
    .btn-default:hover { background: rgba(255,255,255,.06); }
    .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
    .btn-danger:hover { background: rgba(248,81,73,.1); }
    .tip {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .canvas-area {
      flex: 1;
      overflow: auto;
      background: #0a0e17;
      cursor: crosshair;
      position: relative;
    }
    canvas { display: block; image-rendering: pixelated; }
  </style>
</head>
<body>

<header>
  <h1>Conway's Game of Life</h1>
  <div class="stat">세대 <b id="gen">0</b></div>
  <div class="stat">생존 <b id="alive">0</b>개</div>
  <div class="stat">탄생 <b id="born-ct" style="color:#7ee787">0</b> / 소멸 <b id="died-ct" style="color:#f85149">0</b></div>
  <div class="hint">클릭·드래그로 셀 추가·삭제</div>
</header>

<div class="main">
  <div class="sidebar">

    <div>
      <div class="sec-title">맵 설정</div>
      <div class="row"><label>너비 (셀)</label><input type="number" id="mw" value="80" min="10" max="500"></div>
      <div class="row"><label>높이 (셀)</label><input type="number" id="mh" value="60" min="10" max="400"></div>
      <div class="range-wrap">
        <div class="range-top"><span>셀 크기</span><span id="cs-val">10px</span></div>
        <input type="range" id="cs" min="3" max="24" value="10">
      </div>
      <button class="btn-default" id="apply-map">맵 적용</button>
    </div>

    <div>
      <div class="sec-title">개체 배치</div>
      <div class="row"><label>랜덤 개수</label><input type="number" id="rc" value="1000" min="1" max="100000"></div>
      <button class="btn-primary" id="rnd-btn">랜덤 배치</button>
      <button class="btn-danger" id="clr-btn">전체 초기화</button>
    </div>

    <div>
      <div class="sec-title">시뮬레이션</div>
      <button class="btn-primary" id="pp-btn">▶ 재생</button>
      <button class="btn-default" id="step-btn">⏭ 1세대 진행</button>
      <div class="range-wrap" style="margin-top:6px">
        <div class="range-top"><span>속도</span><span id="fps-val">10 FPS</span></div>
        <input type="range" id="fps-r" min="1" max="60" value="10">
      </div>
    </div>

    <div class="tip">
      시뮬레이션 중에도 캔버스를 클릭하거나 드래그해서 셀을 추가·삭제할 수 있습니다.<br><br>
      <b style="color:var(--text)">색상 의미</b><br>
      <span style="color:#7ee787">■</span> 신생 셀<br>
      <span style="color:#39d353">■</span> 생존 (젊은)<br>
      <span style="color:#26a641">■</span> 생존 (중년)<br>
      <span style="color:#1a6b2e">■</span> 생존 (장수)<br>
      <span style="color:#2d2013">■</span> 방금 소멸
    </div>

  </div>

  <div class="canvas-area" id="ca">
    <canvas id="cv"></canvas>
  </div>
</div>

<script>
// ────── 상태 ──────────────────────────────────────────────────
let W = 80, H = 60, CS = 10;
let grid, age, prev;
let generation = 0;
let running = false;
let fps = 10;
let lastTick = 0;
let rafId = null;
let isDrawing = false;
let drawVal = 1;
let lastBorn = 0, lastDied = 0;

// ────── 그리드 ────────────────────────────────────────────────
function makeU8()  { return new Uint8Array(W * H); }
function makeU16() { return new Uint16Array(W * H); }
function idx(x, y) { return y * W + x; }

function initGrids(w, h) {
  W = w; H = h;
  grid = makeU8();
  age  = makeU16();
  prev = makeU8();
  generation = 0; lastBorn = 0; lastDied = 0;
}

function randomize(n) {
  const total = W * H;
  n = Math.min(n, total);
  grid.fill(0); age.fill(0); prev.fill(0);
  generation = 0; lastBorn = 0; lastDied = 0;
  // Fisher-Yates 방식으로 랜덤 배치
  const idx2 = Array.from({length: total}, (_, i) => i);
  for (let i = total - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = idx2[i]; idx2[i] = idx2[j]; idx2[j] = t;
  }
  for (let i = 0; i < n; i++) { grid[idx2[i]] = 1; age[idx2[i]] = 1; }
}

function clearAll() {
  grid.fill(0); age.fill(0); prev.fill(0);
  generation = 0; lastBorn = 0; lastDied = 0;
}

function step() {
  prev.set(grid);
  const next = makeU8();
  let born = 0, died = 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      let n = 0;
      // 8-이웃 카운트 (경계 순환)
      const xl = (x - 1 + W) % W, xr = (x + 1) % W;
      const yu = (y - 1 + H) % H, yd = (y + 1) % H;
      n = grid[idx(xl, yu)] + grid[idx(x, yu)] + grid[idx(xr, yu)]
        + grid[idx(xl, y)]                      + grid[idx(xr, y)]
        + grid[idx(xl, yd)] + grid[idx(x, yd)] + grid[idx(xr, yd)];

      const alive = grid[idx(x, y)];
      const survives = alive ? (n === 2 || n === 3) : (n === 3);
      next[idx(x, y)] = survives ? 1 : 0;
      if (survives)      age[idx(x, y)] = alive ? (age[idx(x, y)] + 1) : 1;
      else               age[idx(x, y)] = 0;
      if ( survives && !alive) born++;
      if (!survives &&  alive) died++;
    }
  }
  grid = next;
  generation++;
  lastBorn = born; lastDied = died;
}

// ────── 렌더링 ────────────────────────────────────────────────
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');

// 나이에 따른 색상 (미리 계산)
function ageColor(a) {
  if (a === 1)  return '#7ee787'; // 신생
  if (a <= 10)  return '#39d353'; // 젊은
  if (a <= 50)  return '#26a641'; // 중년
  return               '#1a6b2e'; // 장수
}

function resizeCanvas() {
  cv.width  = W * CS;
  cv.height = H * CS;
}

function draw() {
  ctx.fillStyle = '#0a0e17';
  ctx.fillRect(0, 0, cv.width, cv.height);

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = idx(x, y);
      const cur = grid[i];
      const was = prev[i];

      let color;
      if (cur) {
        color = ageColor(age[i]);
      } else if (was) {
        color = '#2d2013'; // 방금 소멸 (1프레임만)
      } else {
        continue; // 완전 사망 → 배경 그대로
      }

      ctx.fillStyle = color;
      ctx.fillRect(x * CS + 1, y * CS + 1, CS - 1, CS - 1);
    }
  }
}

function updateStats() {
  document.getElementById('gen').textContent   = generation.toLocaleString();
  document.getElementById('born-ct').textContent = lastBorn.toLocaleString();
  document.getElementById('died-ct').textContent = lastDied.toLocaleString();
  let n = 0; for (let i = 0; i < grid.length; i++) n += grid[i];
  document.getElementById('alive').textContent = n.toLocaleString();
}

// ────── 애니메이션 루프 ───────────────────────────────────────
function loop(ts) {
  if (!running) return;
  if (ts - lastTick >= 1000 / fps) {
    step(); draw(); updateStats();
    lastTick = ts;
  }
  rafId = requestAnimationFrame(loop);
}

function play() {
  if (running) return;
  running = true;
  lastTick = performance.now();
  rafId = requestAnimationFrame(loop);
  document.getElementById('pp-btn').textContent = '⏸ 정지';
}

function pause() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  document.getElementById('pp-btn').textContent = '▶ 재생';
}

// ────── 캔버스 입력 ──────────────────────────────────────────
function cellAt(clientX, clientY) {
  const r  = cv.getBoundingClientRect();
  const sx = cv.width  / r.width;
  const sy = cv.height / r.height;
  const x  = ((clientX - r.left) * sx / CS) | 0;
  const y  = ((clientY - r.top)  * sy / CS) | 0;
  return {x, y};
}

function paint(cx, cy) {
  const {x, y} = cellAt(cx, cy);
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = idx(x, y);
  if (grid[i] !== drawVal) {
    grid[i] = drawVal;
    age[i]  = drawVal ? 1 : 0;
    draw(); updateStats();
  }
}

cv.addEventListener('mousedown', e => {
  isDrawing = true;
  const {x, y} = cellAt(e.clientX, e.clientY);
  drawVal = (x >= 0 && x < W && y >= 0 && y < H && grid[idx(x, y)]) ? 0 : 1;
  paint(e.clientX, e.clientY);
});
window.addEventListener('mousemove', e => { if (isDrawing) paint(e.clientX, e.clientY); });
window.addEventListener('mouseup',   () => { isDrawing = false; });

cv.addEventListener('touchstart', e => {
  e.preventDefault();
  isDrawing = true;
  const t = e.touches[0];
  const {x, y} = cellAt(t.clientX, t.clientY);
  drawVal = (x >= 0 && x < W && y >= 0 && y < H && grid[idx(x, y)]) ? 0 : 1;
  paint(t.clientX, t.clientY);
}, {passive: false});
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if (isDrawing) { const t = e.touches[0]; paint(t.clientX, t.clientY); }
}, {passive: false});
cv.addEventListener('touchend', () => { isDrawing = false; });

// ────── 컨트롤 바인딩 ────────────────────────────────────────
document.getElementById('cs').addEventListener('input', e => {
  CS = +e.target.value;
  document.getElementById('cs-val').textContent = CS + 'px';
  resizeCanvas(); draw();
});

document.getElementById('apply-map').addEventListener('click', () => {
  const w = Math.max(10, Math.min(500, +document.getElementById('mw').value || 80));
  const h = Math.max(10, Math.min(400, +document.getElementById('mh').value || 60));
  pause(); initGrids(w, h); resizeCanvas(); draw(); updateStats();
});

document.getElementById('rnd-btn').addEventListener('click', () => {
  const n = Math.max(1, +document.getElementById('rc').value || 1000);
  randomize(n); draw(); updateStats();
});

document.getElementById('clr-btn').addEventListener('click', () => {
  pause(); clearAll(); prev.fill(0); draw(); updateStats();
});

document.getElementById('pp-btn').addEventListener('click', () => {
  running ? pause() : play();
});

document.getElementById('step-btn').addEventListener('click', () => {
  pause(); step(); draw(); updateStats();
});

document.getElementById('fps-r').addEventListener('input', e => {
  fps = +e.target.value;
  document.getElementById('fps-val').textContent = fps + ' FPS';
});

// ────── 초기화 ────────────────────────────────────────────────
initGrids(W, H);
resizeCanvas();
randomize(1000);
draw();
updateStats();
</script>
</body>
</html>
