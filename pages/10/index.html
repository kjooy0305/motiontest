<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출근해야 한다 — 괴담 탈출기</title>
<style>
:root{--bg:#08080f;--sur:#10101a;--bor:#222233;--tx:#cccce0;--dim:#666688;--acc:#7c3aed;--red:#ef4444;--gold:#f59e0b;--grn:#22c55e;--blu:#3b82f6;--pnk:#ec4899;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;min-height:100vh;overflow:hidden;}
.screen{display:none;width:100vw;height:100vh;overflow-y:auto;}
.screen.active{display:block;}

/* ── CHARACTER ── */
#sc-char{display:none;flex-direction:column;align-items:center;padding:32px 16px 60px;background:radial-gradient(ellipse at top,#160a2a 0%,var(--bg) 65%);}
#sc-char.active{display:flex;}
.ct{font-size:1.8rem;font-weight:900;color:#c084fc;text-shadow:0 0 24px #8b5cf670;text-align:center;margin-bottom:4px;}
.cs{font-size:.85rem;color:var(--dim);margin-bottom:36px;text-align:center;}
.sec{width:100%;max-width:580px;margin-bottom:24px;}
.sl{font-size:.68rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
.ob{background:var(--sur);border:2px solid var(--bor);border-radius:8px;padding:10px 8px;color:var(--tx);cursor:pointer;transition:all .12s;text-align:center;font-size:.82rem;}
.ob:hover{border-color:var(--acc);}
.ob.sel{border-color:var(--acc);background:#1a0a38;color:#c084fc;}
.ob .oi{font-size:1.3rem;display:block;margin-bottom:3px;}
.ob .on{font-weight:700;display:block;}
.ob .od{font-size:.68rem;color:var(--dim);display:block;margin-top:2px;}
.ob.sel .od{color:#a78bfa;}
.ni{width:100%;max-width:580px;background:var(--sur);border:2px solid var(--bor);border-radius:8px;padding:11px 14px;color:var(--tx);font-size:.95rem;outline:none;transition:border-color .12s;}
.ni:focus{border-color:var(--acc);}
.sp{width:100%;max-width:580px;background:var(--sur);border:1px solid var(--bor);border-radius:8px;padding:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px;}
.spi{text-align:center;}
.spi .sn{font-size:.6rem;color:var(--dim);}
.spi .sv{font-size:1rem;font-weight:700;color:var(--acc);}
.sbtn{margin-top:20px;padding:14px 56px;background:linear-gradient(135deg,#6d28d9,#a855f7);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:.06em;transition:transform .12s,box-shadow .12s;}
.sbtn:hover{transform:scale(1.04);box-shadow:0 0 28px #8b5cf650;}
.sbtn:disabled{opacity:.35;cursor:not-allowed;transform:none;}

/* ── GAME ── */
#sc-game{display:none;height:100vh;overflow:hidden;flex-direction:column;}
#sc-game.active{display:flex;}
#sbar{background:#0a0a12;border-bottom:1px solid var(--bor);padding:6px 14px;display:flex;gap:12px;align-items:center;flex-shrink:0;flex-wrap:wrap;}
.sg{display:flex;align-items:center;gap:5px;}
.sg .sgl{font-size:.6rem;color:var(--dim);letter-spacing:.08em;}
.sbw{width:70px;height:7px;background:#151520;border-radius:4px;overflow:hidden;}
.sb{height:100%;border-radius:4px;transition:width .3s;}
.bhp{background:linear-gradient(90deg,#b91c1c,#f97316);}
.bsn{background:linear-gradient(90deg,#1d4ed8,#7c3aed);}
.bcr{background:linear-gradient(90deg,#6d28d9,#db2777);}
.sg .sgv{font-size:.72rem;font-weight:700;min-width:24px;}
#td{margin-left:auto;font-size:.82rem;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;}
#gm{display:flex;flex:1;overflow:hidden;}
#sp{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
#sh{padding:18px 22px 14px;border-bottom:1px solid var(--bor);}
.sct{font-size:.65rem;color:var(--dim);letter-spacing:.1em;}
.stit{font-size:1.3rem;font-weight:900;color:#c084fc;margin:3px 0 6px;}
.satm{font-size:.75rem;color:var(--dim);font-style:italic;}
#stx{padding:18px 22px;font-size:.92rem;line-height:1.95;color:var(--tx);}
#stx p{margin-bottom:10px;}
.hl{color:var(--gold);}
.hr{color:var(--red);}
.ul{color:var(--grn);}
.pk{color:var(--pnk);}
#rtx{padding:0 22px 6px;font-size:.82rem;font-style:italic;color:var(--dim);min-height:1.4rem;}
#ca{padding:10px 22px 22px;display:flex;flex-direction:column;gap:9px;}
.cb{background:var(--sur);border:1px solid var(--bor);border-radius:9px;padding:12px 16px;color:var(--tx);cursor:pointer;transition:all .12s;text-align:left;font-size:.88rem;line-height:1.5;position:relative;}
.cb:hover:not(:disabled){border-color:var(--acc);background:#16163a;transform:translateX(3px);}
.cb:disabled{opacity:.3;cursor:not-allowed;}
.cb .ch{font-size:.68rem;color:var(--dim);display:block;margin-top:3px;}
.cb .cc{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:.68rem;color:var(--dim);text-align:right;}
.cb.dn{border-color:#1c0a0a;}
.cb.dn:hover:not(:disabled){border-color:var(--red);}
.cb.sp2{border-color:#1a1a3a;}
.cb.sp2:hover:not(:disabled){border-color:#818cf8;}
.cb.uc{border-color:#0a1c0a;}
.cb.uc:hover:not(:disabled){border-color:var(--grn);}
#cp{width:200px;border-left:1px solid var(--bor);overflow-y:auto;background:#09090f;flex-shrink:0;}
#cp h3{font-size:.62rem;color:var(--dim);letter-spacing:.1em;padding:12px 10px 7px;border-bottom:1px solid var(--bor);text-transform:uppercase;}
.cl{padding:6px;}
.ct2{display:flex;align-items:flex-start;gap:5px;padding:5px 6px;border-radius:5px;margin-bottom:3px;font-size:.68rem;border:1px solid transparent;cursor:default;}
.ct2.physical{border-color:#2a1a3a;background:#100820;}
.ct2.mental{border-color:#1a2240;background:#08101e;}
.ct2.special{border-color:#2a2010;background:#0e0c06;}
.ct2.corruption{border-color:#30100a;background:#110505;}
.ct2.unlock{border-color:#0a2010;color:#4ade80;}
.ci{font-size:.85rem;flex-shrink:0;margin-top:1px;}
.cn{font-weight:700;color:var(--tx);display:block;}
.cd{color:var(--dim);font-size:.64rem;}
#nc{padding:12px 10px;font-size:.75rem;color:var(--dim);font-style:italic;}

/* ── MINIGAME ── */
#mgo{display:none;position:fixed;inset:0;background:#000000ee;z-index:100;align-items:center;justify-content:center;}
#mgo.active{display:flex;}
#mgb{background:var(--sur);border:2px solid var(--acc);border-radius:14px;padding:28px;max-width:460px;width:92%;text-align:center;}
#mgt{font-size:1.2rem;font-weight:900;color:var(--acc);margin-bottom:6px;}
#mgd{font-size:.82rem;color:var(--dim);margin-bottom:20px;line-height:1.6;}
#mgtbw{width:100%;height:5px;background:#15152a;border-radius:3px;margin-bottom:16px;}
#mgtb{height:100%;border-radius:3px;background:var(--acc);transition:width .08s linear;}
#mgc{margin-bottom:20px;}
.mgq{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.mgqb{padding:11px 22px;border:2px solid var(--bor);border-radius:7px;background:var(--sur);color:var(--tx);font-size:.95rem;font-weight:700;cursor:pointer;transition:all .1s;}
.mgqb:hover{border-color:var(--acc);background:#1a1040;}
.mgs{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap;}
.mgc2{width:56px;height:56px;border:2px solid var(--bor);border-radius:7px;background:var(--sur);cursor:pointer;transition:all .12s;font-size:1.3rem;display:flex;align-items:center;justify-content:center;}
.mgc2.lit{border-color:var(--acc);background:#2a1060;}
.mgc2.ok{border-color:var(--grn);background:#062010;}
.mgc2.no{border-color:var(--red);background:#200606;}
.mgrz{width:100%;height:70px;border:2px solid var(--bor);border-radius:7px;position:relative;overflow:hidden;background:#06060f;margin-bottom:10px;}
.mgrl{position:absolute;top:0;bottom:0;width:3px;background:#ef4444;left:78%;}
.mgbt{position:absolute;top:8px;width:36px;height:54px;background:#7c3aed;border-radius:5px;}
.mgtpb{width:100%;padding:14px;background:var(--acc);border:none;border-radius:7px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;}
#mgr{font-size:1rem;font-weight:700;min-height:1.5rem;}
#mgr.ok{color:var(--grn);}
#mgr.no{color:var(--red);}

/* ── ENDING ── */
#sc-end{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:radial-gradient(ellipse at center,#0c0c1e,#000);}
#sc-end.active{display:flex;}
.eb{font-size:3.5rem;margin-bottom:14px;}
.et{font-size:1.8rem;font-weight:900;margin-bottom:6px;text-align:center;}
.esu{font-size:.9rem;color:var(--dim);margin-bottom:28px;text-align:center;}
.etx{max-width:560px;line-height:1.9;text-align:center;font-size:.92rem;margin-bottom:28px;}
.ests{display:flex;gap:20px;margin-bottom:28px;flex-wrap:wrap;justify-content:center;}
.esi{text-align:center;}
.esl{font-size:.65rem;color:var(--dim);letter-spacing:.1em;}
.esv{font-size:1.6rem;font-weight:900;}
.ebtn{padding:13px 44px;background:var(--acc);border:none;border-radius:9px;color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;transition:transform .12s;}
.ebtn:hover{transform:scale(1.04);}

/* ── MISC ── */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--bor);border-radius:3px;}
@keyframes flick{0%,88%,100%{opacity:1;}89%,91%,93%{opacity:.35;}90%,92%{opacity:.75;}}
.flick{animation:flick 5s infinite;}
@keyframes hpulse{0%,100%{box-shadow:0 0 0 0 #ef444428;}50%{box-shadow:0 0 18px 4px #ef444428;}}
.hpulse{animation:hpulse 2.5s infinite;}
@media(max-width:600px){#cp{display:none;}#sbar{gap:8px;}.sbw{width:48px;}}
</style>
</head>
<body>

<!-- ── 캐릭터 생성 ── -->
<div id="sc-char" class="screen">
  <div class="ct">출근해야 한다</div>
  <div class="cs">괴담에 떨어져도 출근을 해야 하는구나 — 당신은 누구입니까?</div>
  <div class="sec"><div class="sl">이름</div>
    <input class="ni" id="inp-name" type="text" placeholder="이름을 입력하세요" maxlength="8" oninput="updChar()">
  </div>
  <div class="sec"><div class="sl">성별</div><div class="og" id="g-gender"></div></div>
  <div class="sec"><div class="sl">직업</div><div class="og" id="g-job"></div></div>
  <div class="sec"><div class="sl">외모 특징</div><div class="og" id="g-look"></div></div>
  <div class="sec"><div class="sl">기본 스탯 미리보기</div><div class="sp" id="stat-prev"></div></div>
  <button class="sbtn" id="sbtn" onclick="startGame()" disabled>▶ 심연으로 들어간다</button>
</div>

<!-- ── 메인 게임 ── -->
<div id="sc-game" class="screen">
  <div id="sbar">
    <div class="sg"><span class="sgl">HP</span><div class="sbw"><div class="sb bhp" id="b-hp" style="width:100%"></div></div><span class="sgv" id="v-hp">100</span></div>
    <div class="sg"><span class="sgl">이성</span><div class="sbw"><div class="sb bsn" id="b-sn" style="width:100%"></div></div><span class="sgv" id="v-sn">100</span></div>
    <div class="sg"><span class="sgl">타락</span><div class="sbw"><div class="sb bcr" id="b-cr" style="width:0%"></div></div><span class="sgv" id="v-cr">0</span></div>
    <div id="td">오전 2:07</div>
  </div>
  <div id="gm">
    <div id="sp">
      <div id="sh">
        <div class="sct" id="s-time"></div>
        <div class="stit" id="s-title"></div>
        <div class="satm" id="s-atm"></div>
      </div>
      <div id="stx"></div>
      <div id="rtx"></div>
      <div id="ca"></div>
    </div>
    <div id="cp"><h3>오염 현황</h3><div class="cl" id="c-list"><div id="nc">오염 없음</div></div></div>
  </div>
</div>

<!-- ── 미니게임 오버레이 ── -->
<div id="mgo">
  <div id="mgb">
    <div id="mgt"></div>
    <div id="mgd"></div>
    <div id="mgtbw"><div id="mgtb" style="width:100%"></div></div>
    <div id="mgc"></div>
    <div id="mgr"></div>
  </div>
</div>

<!-- ── 엔딩 ── -->
<div id="sc-end" class="screen">
  <div class="eb" id="e-badge"></div>
  <div class="et" id="e-title"></div>
  <div class="esu" id="e-sub"></div>
  <div class="etx" id="e-text"></div>
  <div class="ests" id="e-stats"></div>
  <button class="ebtn" onclick="resetGame()">다시 시작</button>
</div>

<script>
// ═══════════════════════════════════════════════
//  CHARACTER OPTIONS
// ═══════════════════════════════════════════════
const GENDERS = [
  { id:'m', icon:'🧍', name:'남성', desc:'체력+10 이성-5', stats:{hp:10,san:-5} },
  { id:'f', icon:'🧍‍♀️', name:'여성', desc:'이성+10 운+5', stats:{san:10,lk:5} },
  { id:'x', icon:'🧑', name:'기타', desc:'운+10 적응+10', stats:{lk:10,ada:10} },
];
const JOBS = [
  { id:'office', icon:'💼', name:'회사원', desc:'적응+15 · 스트레스 저항', stats:{ada:15}, special:'적응 본능으로 무시한다' },
  { id:'police', icon:'👮', name:'경찰', desc:'체력+20 이성+5', stats:{hp:20,san:5}, special:'공권력을 행사한다' },
  { id:'nurse', icon:'🧑‍⚕️', name:'간호사', desc:'HP회복+20 이성+10', stats:{hp:15,san:10,ada:5}, special:'의료 지식을 활용한다' },
  { id:'reporter', icon:'📷', name:'기자', desc:'운+15 이성+10', stats:{lk:15,san:10}, special:'취재 본능으로 관찰한다' },
  { id:'student', icon:'🎒', name:'학생', desc:'운+20 체력-10', stats:{lk:20,hp:-10}, special:'도시전설을 알고 있다' },
  { id:'shaman', icon:'🔮', name:'무당', desc:'적응+25 · 오염 경로 해금', stats:{san:5,ada:25}, special:'주문을 외운다' },
];
const LOOKS = [
  { id:'plain', icon:'😐', name:'평범한 외모', desc:'운+5', stats:{lk:5} },
  { id:'striking', icon:'✨', name:'눈에 띄는 외모', desc:'매력+10 위험+5%', stats:{lk:-3,ada:5} },
  { id:'dark', icon:'😶‍🌫️', name:'어두운 인상', desc:'위협+10 친화-5', stats:{hp:5,san:-5} },
  { id:'scar', icon:'🤕', name:'흉터 있음', desc:'체력+5 이성+5', stats:{hp:5,san:5} },
];

// ═══════════════════════════════════════════════
//  CONTAMINATION DEFINITIONS (100+)
// ═══════════════════════════════════════════════
const CD = {
  // 신체 Physical
  eye_1:{n:'눈 오염 I',d:'눈이 충혈되고 시야 가장자리에 그림자가 어른거린다.',t:'physical',i:'👁️'},
  eye_2:{n:'눈 오염 II',d:'실체 없는 형상들이 보인다. 무엇이 진짜인지 알기 어렵다.',t:'physical',i:'👁️'},
  eye_3:{n:'괴담의 눈',d:'숨겨진 것들이 보인다. 새로운 길이 열린다.',t:'unlock',i:'🟢'},
  ear_1:{n:'귀 오염 I',d:'이명이 끊이지 않는다. 집중하기 어렵다.',t:'physical',i:'👂'},
  ear_2:{n:'귀 오염 II',d:'먼 곳에서 목소리들이 들린다. 무슨 말인지 모르겠다.',t:'physical',i:'👂'},
  ear_3:{n:'괴담의 귀',d:'죽은 자의 말이 들린다. 괴담과 소통이 가능하다.',t:'unlock',i:'🟢'},
  hand_1:{n:'손 오염 I',d:'손이 차갑고 가끔 혼자 움직이려 한다.',t:'physical',i:'🤚'},
  hand_2:{n:'손 오염 II',d:'손이 스스로 움직인다. 막을 수가 없을 때가 있다.',t:'physical',i:'🤚'},
  hand_3:{n:'괴담의 손',d:'벽이나 물체를 통과할 수 있다.',t:'unlock',i:'🟢'},
  foot_1:{n:'발 오염 I',d:'발이 끌린다. 특정 방향으로 가려는 충동이 있다.',t:'physical',i:'🦶'},
  foot_2:{n:'발 오염 II',d:'발자국이 사라진다. 존재감이 옅어지는 느낌이다.',t:'physical',i:'🦶'},
  foot_3:{n:'괴담의 발',d:'공간 사이를 걸을 수 있다. 지름길이 보인다.',t:'unlock',i:'🟢'},
  mouth_1:{n:'입 오염 I',d:'목소리가 제대로 나오지 않는다. 가끔 이상한 소리가 난다.',t:'physical',i:'👄'},
  mouth_2:{n:'입 오염 II',d:'의도하지 않은 말이 나온다. 무언가가 말하게 한다.',t:'physical',i:'👄'},
  mouth_3:{n:'괴담의 입',d:'괴담의 언어를 구사할 수 있다. 주문이 가능하다.',t:'unlock',i:'🟢'},
  skin_1:{n:'피부 오염 I',d:'피부가 차갑고 건조하다. 촉각이 무뎌진다.',t:'physical',i:'🫲'},
  skin_2:{n:'피부 오염 II',d:'피부에 알 수 없는 문양이 새겨진다.',t:'physical',i:'🫲'},

  heart_2:{n:'심장 오염 II',d:'두 번째 심장박동이 들린다. 내 것이 아닌.',t:'physical',i:'❤️'},
  heart_3:{n:'괴담의 심장',d:'심장이 두 개가 됐다. HP+20 but 타락에 취약.',t:'unlock',i:'🟢'},
  bone_1:{n:'골격 오염 I',d:'뼈가 시리다. 관절이 삐걱거린다.',t:'physical',i:'🦴'},
  bone_2:{n:'골격 오염 II',d:'뼈가 스스로 재배치되는 것 같은 느낌이다.',t:'physical',i:'🦴'},
  bone_3:{n:'괴담의 골격',d:'몸이 괴이하게 구부러진다. 좁은 공간을 통과할 수 있다.',t:'unlock',i:'🟢'},
  blood_1:{n:'혈액 오염 I',d:'피가 차갑다. 보통 사람보다 체온이 낮다.',t:'physical',i:'🩸'},
  blood_2:{n:'혈액 오염 II',d:'피의 색이 변해가고 있다.',t:'physical',i:'🩸'},

  char:{ name:'', gender:'', job:'', look:'' },

//  ENGINE
// ═══════════════════════════════════════════════
function goScene(id){
  const sc = SCENES[id];
  if(!sc){ console.warn('Scene not found:',id); return; }
  G.scene = id;
  G.round++;
  document.getElementById('rtx').textContent='';
  renderStatus();
  renderContam();
  document.getElementById('s-time').textContent = sc.time || formatTime(G.time);
  document.getElementById('s-title').textContent = sc.title;
  document.getElementById('s-atm').textContent = sc.atm || '';
  if(sc.text) document.getElementById('stx').innerHTML = sc.text;
  if(sc.onEnter) sc.onEnter(G);
  if(G.stats.hp <= 0){ triggerEnding('dead'); return; }
  if(G.stats.san <= 0){ triggerEnding('insane'); return; }
  if(G.stats.cor >= 100){ triggerEnding('legend'); return; }
  if(sc.minigame){ runMinigame(sc.minigame); return; }
  renderChoices(sc.choices);
  document.getElementById('sp').scrollTop=0;
}

function renderChoices(choices){
  const ca = document.getElementById('ca');
  ca.innerHTML='';
  (choices||[]).forEach(c=>{
    if(c.show && !c.show(G)) return;
    const btn = document.createElement('button');
    btn.className = 'cb' + (c.cls?' '+c.cls:'');
    const isDisabled = c.req && !c.req(G);
    btn.disabled = isDisabled;
    let costStr='';
    if(c.cost){
      const parts=[];
      if(c.cost.hp) parts.push((c.cost.hp>0?'HP+':'HP')+c.cost.hp);
      if(c.cost.san) parts.push((c.cost.san>0?'이성+':'이성')+c.cost.san);
      if(c.cost.cor) parts.push('타락+'+(c.cost.cor||0));
      costStr=parts.join(' ');
    }
    btn.innerHTML=`<span>${c.icon||''}${c.text}</span>`
      +(c.hint?`<span class="ch">${c.hint}</span>`:'')
      +(costStr?`<span class="cc">${costStr}</span>`:'');
    btn.onclick=()=>applyChoice(c);
    ca.appendChild(btn);
  });
}

function applyChoice(c){
  document.querySelectorAll('#ca .cb').forEach(b=>b.disabled=true);
  let betrayed = false;
  if(c.betray){
    const finalChance = c.betray * (1 - G.stats.lk/200);
    if(Math.random() < finalChance) betrayed = true;
  }
  if(c.cost){
    if(c.cost.hp) G.stats.hp = clamp(G.stats.hp + c.cost.hp, 0, 130);
    if(c.cost.san) G.stats.san = clamp(G.stats.san + c.cost.san, 0, 130);
    if(c.cost.cor) G.stats.cor = clamp(G.stats.cor + c.cost.cor, 0, 100);
  }
  if(betrayed){
    if(c.btCost){
      if(c.btCost.hp) G.stats.hp = clamp(G.stats.hp + c.btCost.hp, 0, 130);
      if(c.btCost.san) G.stats.san = clamp(G.stats.san + c.btCost.san, 0, 130);
      if(c.btCost.cor) G.stats.cor = clamp((G.stats.cor||0)+(c.btCost.cor||0), 0, 100);
    }
    if(c.btContam) c.btContam.forEach(ct=>G.contam.add(ct));
  }
  if(c.contam) c.contam.forEach(ct=>G.contam.add(ct));
  if(G.contam.has('heart_3')&&!G.flags.heart3_applied){ G.stats.hp=clamp(G.stats.hp+20,0,130); G.flags.heart3_applied=true; }
  if(c.flag) Object.assign(G.flags, c.flag);
  if(c.time) G.time += c.time;
  renderStatus(); renderContam();
  if(betrayed && c.btText){
    document.getElementById('rtx').innerHTML=`<span style="color:var(--red)">...예상과 달리,</span> ${c.btText}`;
  }
  if(G.stats.hp<=0){ setTimeout(()=>triggerEnding('dead'),800); return; }
  if(G.stats.san<=0){ setTimeout(()=>triggerEnding('insane'),800); return; }
  if(G.stats.cor>=100){ setTimeout(()=>triggerEnding('legend'),800); return; }
  const nextId = betrayed && c.btNext ? c.btNext : (typeof c.next==='function'?c.next(G):c.next);
  setTimeout(()=>goScene(nextId), betrayed?1200:400);
}

function clamp(v,mn,mx){ return Math.max(mn,Math.min(mx,v)); }
function formatTime(m){
  const h=Math.floor(m/60)%24, mn=m%60;
  const ampm=h<12?'오전':'오후';
  const hh=h===0?12:h>12?h-12:h;
  return `${ampm} ${hh}:${mn.toString().padStart(2,'0')}`;
}

function renderStatus(){
  const hp=Math.min(100,G.stats.hp), san=Math.min(100,G.stats.san);
  document.getElementById('b-hp').style.width=hp+'%';
  document.getElementById('v-hp').textContent=Math.round(hp);
  document.getElementById('b-sn').style.width=san+'%';
  document.getElementById('v-sn').textContent=Math.round(san);
  document.getElementById('b-cr').style.width=G.stats.cor+'%';
  document.getElementById('v-cr').textContent=Math.round(G.stats.cor);
  document.getElementById('td').textContent=formatTime(G.time);
}

function renderContam(){
  const cl=document.getElementById('c-list');
  const nc=document.getElementById('nc');
  const items=[...G.contam].filter(id=>CD[id]);
  if(items.length===0){nc.style.display='block';cl.querySelectorAll('.ct2').forEach(e=>e.remove());return;}
  nc.style.display='none';
  cl.querySelectorAll('.ct2').forEach(e=>e.remove());
  items.slice(-30).forEach(id=>{
    const d=CD[id];
    const div=document.createElement('div');
    div.className=`ct2 ${d.t}`;
    div.title=d.d;
    div.innerHTML=`<span class="ci">${d.i}</span><div><span class="cn">${d.n}</span><span class="cd">${d.d.slice(0,28)}...</span></div>`;
    cl.appendChild(div);
  });
}

let mgTimer=null;
let _mgLock=false; // 미니게임 종료 중복 호출 방지

function showMG(title,desc){
  _mgLock=false;
  document.getElementById('mgt').textContent=title;
  document.getElementById('mgd').textContent=desc;
  document.getElementById('mgr').textContent='';
  document.getElementById('mgr').className='';
  document.getElementById('mgc').innerHTML='';
  document.getElementById('mgtb').style.width='100%';
  document.getElementById('mgo').classList.add('active');
}
function hideMG(){ document.getElementById('mgo').classList.remove('active'); }
function setMGResult(ok,msg){ const el=document.getElementById('mgr'); el.textContent=msg; el.className=ok?'ok':'no'; }
function startMGTimer(sec,onEnd){
  clearInterval(mgTimer);
  let rem=sec;
  const bar=document.getElementById('mgtb');
  bar.style.width='100%';
  mgTimer=setInterval(()=>{ rem-=0.1; bar.style.width=Math.max(0,rem/sec*100)+'%'; if(rem<=0){clearInterval(mgTimer);onEnd();} },100);
}
function stopMGTimer(){ clearInterval(mgTimer); }
// 현재 라운드 버튼 전체 비활성화 (중복 클릭 방지)
function disableMGButtons(){ document.querySelectorAll('#mgc .mgqb, #mgc .mgc2, #mgc .mgtpb').forEach(b=>b.disabled=true); }
function runMinigame(type){
  if(type==='redmask') mgRedmask();
  else if(type==='elevator') mgElevator();
  else if(type==='counting') mgCounting();
  else if(type==='mirror'||type==='mirror_game') mgMirror();
}

// 빨간 마스크
let redmaskAnswers=[];
function mgRedmask(){
  showMG('빨간 마스크','그녀가 묻는다. 2초 안에 대답하세요.');
  redmaskAnswers=[];
  redmaskRound(0);
}
function redmaskRound(n){
  if(n>=3){ mgRedmaskEnd(); return; }
  stopMGTimer();
  document.getElementById('mgd').textContent=`질문 ${n+1}/3 — "예쁘냐?"`;
  const cc=document.getElementById('mgc');
  cc.innerHTML='';
  const choices=[{t:'예쁘다',v:'yes'},{t:'안 예쁘다',v:'no'}];
  if(G.char.job==='shaman'||G.contam.has('redmask_wound')) choices.push({t:'나도 예뻐',v:'same'});
  const div=document.createElement('div'); div.className='mgq';
  let picked=false; // 이 라운드 중복 선택 방지
  choices.forEach(ch=>{
    const b=document.createElement('button'); b.className='mgqb'; b.textContent=ch.t;
    b.onclick=()=>{
      if(picked) return; picked=true;
      stopMGTimer(); disableMGButtons();
      redmaskAnswers.push(ch.v); setMGResult(true,'...');
      setTimeout(()=>redmaskRound(n+1),600);
    };
    div.appendChild(b);
  });
  cc.appendChild(div);
  startMGTimer(2,()=>{
    if(picked) return; picked=true;
    disableMGButtons();
    redmaskAnswers.push('timeout'); setMGResult(false,'너무 늦었다.');
    setTimeout(()=>redmaskRound(n+1),700);
  });
}
function mgRedmaskEnd(){
  if(_mgLock) return; _mgLock=true;
  stopMGTimer(); hideMG();
  const ans=redmaskAnswers;
  if(ans[0]===ans[1]&&ans[1]===ans[2]){ G.stats.san-=20; G.stats.hp-=10; G.contam.add('redmask_wound'); }
  else if(ans.includes('same')){ G.stats.cor+=15; G.contam.add('redmask_obs'); }
  else if(ans.includes('timeout')){ G.stats.hp-=15; G.contam.add('redmask_wound'); }
  else { G.stats.san-=10; G.contam.add('redmask_obs'); }
  G.stats.hp=clamp(G.stats.hp,0,130); G.stats.san=clamp(G.stats.san,0,130);
  renderStatus(); renderContam();
  goScene('alley_end');
}

// 엘리베이터
let elevSeq=[], elevInput=[], elevDone=false;
function mgElevator(){
  showMG('심연의 엘리베이터','버튼이 깜빡이는 순서를 기억하고 그대로 누르세요.');
  const floors=['B13','0','∞','B7','13','?'];
  elevSeq=[]; elevInput=[]; elevDone=false;
  const len=G.stats.ada>60?3:4;
  while(elevSeq.length<len) elevSeq.push(floors[Math.floor(Math.random()*floors.length)]);
  const cc=document.getElementById('mgc'); cc.innerHTML='';
  const grid=document.createElement('div'); grid.className='mgs';
  floors.forEach(f=>{
    const btn=document.createElement('button'); btn.className='mgc2'; btn.textContent=f; btn.dataset.f=f;
    btn.disabled=true; // 시퀀스 표시 중 클릭 불가
    btn.onclick=()=>elevPress(btn,f);
    grid.appendChild(btn);
  });
  cc.appendChild(grid);
  const info=document.createElement('div');
  info.id='elev-info'; info.style.cssText='margin:10px 0;font-size:.85rem;color:var(--dim);';
  info.textContent='순서를 보여드립니다...';
  cc.appendChild(info);
  setTimeout(()=>elevShowSeq(0,grid,info),800);
}
function elevShowSeq(i,grid,info){
  if(i>=elevSeq.length){
    info.textContent='같은 순서로 누르세요.';
    // 시퀀스 표시 완료 후 버튼 활성화
    grid.querySelectorAll('.mgc2').forEach(b=>b.disabled=false);
    return;
  }
  const btns=[...grid.querySelectorAll('.mgc2')];
  const btn=btns.find(b=>b.dataset.f===elevSeq[i]);
  if(btn){ btn.classList.add('lit'); setTimeout(()=>{ btn.classList.remove('lit'); setTimeout(()=>elevShowSeq(i+1,grid,info),300); },500); }
  else setTimeout(()=>elevShowSeq(i+1,grid,info),400);
}
function elevPress(btn,f){
  if(elevDone) return;
  elevInput.push(f);
  const ok=f===elevSeq[elevInput.length-1];
  btn.classList.add(ok?'ok':'no');
  setTimeout(()=>btn.classList.remove('ok','no'),400);
  if(!ok||elevInput.length>=elevSeq.length){
    elevDone=true;
    disableMGButtons();
    setTimeout(mgElevatorEnd,600);
  }
}
function mgElevatorEnd(){
  if(_mgLock) return; _mgLock=true;
  hideMG();
  const correct=elevInput.length===elevSeq.length&&elevInput.every((v,i)=>v===elevSeq[i]);
  if(correct){ G.stats.san-=5; G.contam.add('elev_floor'); }
  else { G.stats.hp-=20; G.stats.san-=15; G.contam.add('elev_pull'); G.contam.add('elev_pass'); }
  G.stats.hp=clamp(G.stats.hp,0,130); G.stats.san=clamp(G.stats.san,0,130);
  renderStatus(); renderContam();
  goScene('apartment_elev2');
}

// 숫자 세는 아이
let countHits=0, countBeatTimer2=null, countGameDone=false;
function mgCounting(){
  showMG('숫자 세는 아이','"하나... 둘... 셋..." 아이의 박자에 맞춰 탭하세요.');
  countHits=0; countGameDone=false;
  const cc=document.getElementById('mgc');
  cc.innerHTML=`<div id="cnt-num" style="font-size:3.5rem;font-weight:900;color:var(--acc);min-height:80px;line-height:80px;text-align:center;"></div>
<button class="mgtpb" id="cnt-btn" style="margin-top:8px;">탭!</button>`;
  document.getElementById('cnt-btn').onclick=()=>{
    if(countGameDone) return;
    const bt=window._cbt||0, now=Date.now(), diff=Math.abs(now-bt);
    if(diff<400){ countHits++; setMGResult(true,'✓ 맞췄다'); }
    else { setMGResult(false,'박자가 맞지 않는다...'); }
  };
  countBeat2(0);
}
const beatNames=['하나','둘','셋','넷','다섯'];
function countBeat2(i){
  if(i>=5){ countGameDone=true; disableMGButtons(); setTimeout(mgCountEnd,500); return; }
  const el=document.getElementById('cnt-num');
  if(el) el.textContent=beatNames[i];
  window._cbt=Date.now();
  countBeatTimer2=setTimeout(()=>countBeat2(i+1), 1800-i*80);
}
function mgCountEnd(){
  if(_mgLock) return; _mgLock=true;
  clearTimeout(countBeatTimer2); hideMG();
  if(countHits>=3){ G.stats.san+=5; G.contam.add('count_comp'); }
  else { G.stats.san-=20; G.stats.hp-=10; G.contam.add('count_comp'); G.contam.add('three_c'); }
  G.stats.hp=clamp(G.stats.hp,0,130); G.stats.san=clamp(G.stats.san,0,130);
  renderStatus(); renderContam();
  goScene('park_fox');
}

// 거울 게임
const mDirs=['↑','↓','←','→'], mOpp={'↑':'↓','↓':'↑','←':'→','→':'←'};
let mBad=0;
function mgMirror(){
  showMG('거울 속의 나','거울 속 자아가 방향을 보인다. 반대 방향을 누르세요!');
  mBad=0; mirrorRound(0);
}
function mirrorRound(n){
  if(n>=5){ mgMirrorEnd(); return; }
  stopMGTimer();
  const dir=mDirs[Math.floor(Math.random()*4)], opp=mOpp[dir];
  document.getElementById('mgd').textContent=`라운드 ${n+1}/5 — 거울 속 자아: ${dir}`;
  const cc=document.getElementById('mgc'); cc.innerHTML='';
  const q=document.createElement('div'); q.className='mgq';
  let picked=false; // 이 라운드 중복 선택 방지
  mDirs.forEach(d=>{
    const b=document.createElement('button'); b.className='mgqb'; b.textContent=d;
    b.onclick=()=>{
      if(picked) return; picked=true;
      stopMGTimer(); disableMGButtons();
      const ok=d===opp;
      setMGResult(ok,ok?'정확해!':'틀렸다...');
      if(!ok){ mBad++; G.stats.san-=8; G.contam.add('mirror_other'); }
      setTimeout(()=>mirrorRound(n+1),600);
    };
    q.appendChild(b);
  });
  cc.appendChild(q);
  startMGTimer(Math.max(1.5,3-n*0.3),()=>{
    if(picked) return; picked=true;
    disableMGButtons();
    mBad++; G.stats.san-=12; G.contam.add('mirror_merge');
    setMGResult(false,'시간 초과...');
    setTimeout(()=>mirrorRound(n+1),700);
  });
}
function mgMirrorEnd(){
  if(_mgLock) return; _mgLock=true;
  stopMGTimer(); hideMG();
  if(mBad===0){ G.flags.mirror_won=true; G.contam.add('self_3'); }
  else if(mBad>=3){ G.flags.mirror_lost=true; G.contam.add('self_2'); G.contam.add('mirror_merge'); }
  G.stats.san=clamp(G.stats.san,0,130);
  renderStatus(); renderContam();
  goScene('subway_exit');
}

// ═══════════════════════════════════════════════
//  ENDINGS
// ═══════════════════════════════════════════════
function determineEnding(s){
  const cor=s.stats.cor, san=s.stats.san;
  const contamCount=[...s.contam].length;
  const unlocks=[...s.contam].filter(c=>CD[c]&&CD[c].t==='unlock').length;
  let endId;
  if(s.flags.fled) endId='disappeared';
  else if(cor>=80) endId='corrupted';
  else if(s.flags.truth_full&&san>=40&&cor<30) endId='liberated';
  else if(unlocks>=5&&san>=30) endId='returned';
  else if(contamCount>=15||san<20) endId='contaminated';
  else endId='normal';
  triggerEnding(endId);
}
const ENDINGS={
  normal:{badge:'💼',title:'출근 완료',sub:'괴담에 떨어져도 출근을 해야 하는구나.',color:'#22c55e',
    text:'오전 9시 정각, 자리에 앉았다. 회의가 시작됐다. 상사가 자료를 설명하고 있다. 아무도 어젯밤의 당신을 모른다. 아마 내일도 이런 날이 올 것이다. 어쩌면 매일 밤.'},
  contaminated:{badge:'🫀',title:'오염된 출근',sub:'도착했다. 하지만 이미 달라졌다.',color:'#7c3aed',
    text:'자리에 앉았다. 컴퓨터 화면에 자신의 반영이 보인다. 눈을 찡그린다. 화면 속 반영은 찡그리지 않는다. 동료들이 자꾸 흘끔 본다. 무엇이 달라졌는지 그들도 모르는 것 같다. 당신도 모른다.'},
  corrupted:{badge:'🌑',title:'타락한 출근',sub:'이미 그 쪽 존재가 되었다.',color:'#db2777',
    text:'회사에 앉아있다. 하지만 당신이 보는 세계는 다른 사람들의 것과 다르다. 동료들이 웃고 있는데 — 그들의 그림자가 울고 있다. 당신은 양쪽 모두 보인다. 어느 쪽이 진짜인지 더 이상 신경 쓰지 않는다.'},
  disappeared:{badge:'👻',title:'실종',sub:'출근하지 못했다.',color:'#ef4444',
    text:'회사에서 당신을 기다렸다. 아무도 오지 않았다. 사무실 복도 끝에서 가끔 발소리가 들린다고 한다. 이름을 부르면 대답한다고 한다. 하지만 거기엔 아무것도 없다. 당신은 새로운 도시전설이 됐다.'},
  liberated:{badge:'✨',title:'해방',sub:'진실을 알고 사이클을 끊었다.',color:'#f59e0b',
    text:'자리에 앉았다. 알고 있다 — 이것이 반복되는 하루라는 것을. 하지만 오늘 처음으로 당신은 기억한다. 다음번엔 더 잘 헤쳐나갈 수 있다. 진짜 탈출은 내일 밤에 일어날 것이다. 아니면 그 다음 밤에.'},
  legend:{badge:'💀',title:'새로운 괴담',sub:'당신이 도시전설이 됐다.',color:'#dc2626',
    text:'회사에 도착했지만 — 더 이상 인간으로서 도착한 게 아니다. 동료들이 이상하게 본다. 당신의 그림자가 움직이지 않는다. 당신의 발소리가 없다. 오늘 밤부터 새로운 이야기가 시작된다.'},
  returned:{badge:'🌅',title:'귀환',sub:'자신을 지키며 돌아왔다. 최고 엔딩.',color:'#60a5fa',
    text:'도착했다. 오염이 있고, 기억이 있고, 타락도 조금 있다. 하지만 — 당신이다. 완전히 당신이다. 창문 밖 하늘이 밝다. 괴담들이 알고 있다 — 이 사람은 꺾이지 않는다고. 오늘 밤은 좀 더 조용할 것이다.'},
  dead:{badge:'💀',title:'사망',sub:'회사에 도착하지 못했다.',color:'#ef4444',
    text:'도시 어딘가에서 아침이 밝았다. 당신의 자리는 비어있다. 상사가 전화를 한다. 받는 사람이 없다. 당신이 마지막으로 있었던 곳에서 — 무언가가 당신의 이름을 기억하고 있다.'},
  insane:{badge:'🌀',title:'발광',sub:'이성을 잃었다.',color:'#7c3aed',
    text:'병원에서 눈을 떴다. 의사들이 말한다 — 길바닥에서 발견됐다고. 아무 말도 안 했다고. 당신은 기억한다. 모든 것을. 하지만 말할 수가 없다. 혀가 움직이지 않는다. 그것이 막고 있다.'},
};
function triggerEnding(id){
  const e=ENDINGS[id]||ENDINGS.normal;
  document.getElementById('sc-game').classList.remove('active');
  const se=document.getElementById('sc-end');
  se.classList.add('active');
  document.getElementById('e-badge').textContent=e.badge;
  const et=document.getElementById('e-title');
  et.textContent=e.title; et.style.color=e.color||'var(--acc)';
  document.getElementById('e-sub').textContent=e.sub;
  document.getElementById('e-text').textContent=e.text;
  document.getElementById('e-stats').innerHTML=`
    <div class="esi"><div class="esl">최종 HP</div><div class="esv" style="color:#f97316">${Math.round(Math.min(100,G.stats.hp))}</div></div>
    <div class="esi"><div class="esl">최종 이성</div><div class="esv" style="color:#818cf8">${Math.round(Math.min(100,G.stats.san))}</div></div>
    <div class="esi"><div class="esl">타락도</div><div class="esv" style="color:#db2777">${Math.round(G.stats.cor)}</div></div>
    <div class="esi"><div class="esl">오염 수</div><div class="esv" style="color:#f59e0b">${G.contam.size}</div></div>
    <div class="esi"><div class="esl">라운드</div><div class="esv" style="color:#22c55e">${G.round}</div></div>`;
  const score=Math.round((Math.min(100,G.stats.hp)+Math.min(100,G.stats.san))*(100-G.stats.cor)/100*G.round);
  const best=parseInt(localStorage.getItem('haunt_best')||'0',10);
  if(score>best) localStorage.setItem('haunt_best',score);
}

// ═══════════════════════════════════════════════
//  CHARACTER CREATION
// ═══════════════════════════════════════════════
let sel={gender:null,job:null,look:null};
function buildGrid(cid,items,key){
  const g=document.getElementById(cid); g.innerHTML='';
  items.forEach(item=>{
    const btn=document.createElement('button'); btn.className='ob';
    btn.innerHTML=`<span class="oi">${item.icon}</span><span class="on">${item.name}</span><span class="od">${item.desc}</span>`;
    btn.onclick=()=>{ g.querySelectorAll('.ob').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); sel[key]=item.id; updChar(); };
    g.appendChild(btn);
  });
}
function updChar(){
  const name=document.getElementById('inp-name').value.trim();
  document.getElementById('sbtn').disabled=!(name&&sel.gender&&sel.job&&sel.look);
  const base={hp:100,san:100,cor:0,lk:50,ada:50};
  [GENDERS.find(g=>g.id===sel.gender),JOBS.find(j=>j.id===sel.job),LOOKS.find(l=>l.id===sel.look)].filter(Boolean).forEach(x=>{
    if(x.stats) Object.entries(x.stats).forEach(([k,v])=>base[k]=(base[k]||0)+v);
  });
  document.getElementById('stat-prev').innerHTML=`
    <div class="spi"><div class="sn">HP</div><div class="sv">${clamp(base.hp,0,130)}</div></div>
    <div class="spi"><div class="sn">이성</div><div class="sv">${clamp(base.san,0,130)}</div></div>
    <div class="spi"><div class="sn">운</div><div class="sv">${clamp(base.lk,0,130)}</div></div>
    <div class="spi"><div class="sn">적응</div><div class="sv">${clamp(base.ada,0,130)}</div></div>
    <div class="spi"><div class="sn">타락</div><div class="sv">0</div></div>`;
}
function startGame(){
  const name=document.getElementById('inp-name').value.trim();
  if(!name||!sel.gender||!sel.job||!sel.look) return;
  G.char={name,gender:sel.gender,job:sel.job,look:sel.look};
  G.stats={hp:100,san:100,cor:0,lk:50,ada:50};
  [GENDERS.find(g=>g.id===sel.gender),JOBS.find(j=>j.id===sel.job),LOOKS.find(l=>l.id===sel.look)].filter(Boolean).forEach(x=>{
    if(x.stats) Object.entries(x.stats).forEach(([k,v])=>{G.stats[k]=(G.stats[k]||0)+v;});
  });
  Object.keys(G.stats).forEach(k=>G.stats[k]=clamp(G.stats[k]||0,0,130));
  G.contam=new Set(); G.flags={}; G.time=127; G.round=0;
  document.getElementById('sc-char').classList.remove('active');
  document.getElementById('sc-game').classList.add('active');
  goScene('office_wake');
}
function resetGame(){
  sel={gender:null,job:null,look:null};
  document.getElementById('sc-end').classList.remove('active');
  document.getElementById('sc-game').classList.remove('active');
  document.getElementById('sc-char').classList.add('active');
  document.getElementById('inp-name').value='';
  document.querySelectorAll('.ob').forEach(b=>b.classList.remove('sel'));
  document.getElementById('sbtn').disabled=true;
  document.getElementById('stat-prev').innerHTML='';
}

// INIT
buildGrid('g-gender',GENDERS,'gender');
buildGrid('g-job',JOBS,'job');
buildGrid('g-look',LOOKS,'look');
document.getElementById('sc-char').classList.add('active');
</script>
