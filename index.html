<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Test</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ── 홈 뷰 ──────────────────────────────── -->
<div class="view" id="view-home">
  <div class="home-header">
    <h1>Motion Test</h1>
    <p>테스트 항목을 선택하세요</p>
  </div>
  <div class="btn-list" id="btn-list"></div>
</div>

<!-- ── 상세 뷰 ─────────────────────────────── -->
<div class="view" id="view-detail">
  <div class="detail-header">
    <button class="back-btn" id="back-btn">‹</button>
    <span class="detail-title" id="detail-title"></span>
  </div>
  <div class="detail-content" id="detail-content"></div>
</div>

<!-- 페이지 설정 로드 -->
<script src="data/pages.js"></script>

<script>
  // ── 버튼 목록 생성 ────────────────────────
  const list = document.getElementById('btn-list');

  for (let i = 1; i <= 100; i++) {
    const page  = PAGES[i] || {};
    const label = page.label || `테스트 ${i}`;
    const desc  = page.desc  || null;
    const thumb = page.thumb || null;

    const thumbHtml = thumb
      ? `<div class="btn-thumb"><img src="${thumb}" alt="${label}"></div>`
      : `<div class="btn-thumb"><span class="btn-num">${i}</span></div>`;

    const descHtml = desc
      ? `<span class="btn-desc">${desc}</span>`
      : '';

    const btn = document.createElement('button');
    btn.className = 'btn-item';
    btn.innerHTML =
      thumbHtml +
      `<div class="btn-info">
         <span class="btn-label">${label}</span>
         ${descHtml}
       </div>` +
      `<span class="btn-chevron">›</span>`;

    btn.addEventListener('click', () => { location.hash = i; });
    list.appendChild(btn);
  }

  // ── 뒤로가기 ──────────────────────────────
  document.getElementById('back-btn').addEventListener('click', () => {
    location.hash = '';
  });

  // ── 라우터 ────────────────────────────────
  function render() {
    const n = parseInt(location.hash.replace('#', ''));
    const isDetail = n >= 1 && n <= 100;

    document.getElementById('view-home').classList.toggle('active', !isDetail);
    document.getElementById('view-detail').classList.toggle('active', isDetail);

    if (!isDetail) {
      document.title = 'Motion Test';
      return;
    }

    const page  = PAGES[n] || {};
    const label = page.label || `테스트 ${n}`;

    document.getElementById('detail-title').textContent = label;
    document.title = `${label} — Motion Test`;

    const content = document.getElementById('detail-content');
    if (page.url) {
      content.innerHTML =
        `<iframe class="detail-iframe" src="${page.url}" allowfullscreen
                 allow="microphone; camera; clipboard-write; fullscreen"></iframe>`;
    } else {
      content.innerHTML =
        `<div class="empty-msg">
           <span class="icon">🧪</span>
           <p>아직 내용이 없습니다</p>
         </div>`;
    }
  }

  window.addEventListener('hashchange', render);
  render();
</script>
</body>
</html>
