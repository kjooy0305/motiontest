<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계급 표 틀 — 소설 설정 자료실</title>
<style>
:root{
  --bg:#0d0b12;--s1:#151221;--s2:#1c1830;--s3:#241f3c;--s4:#2e2749;
  --bd:#332b52;--bd2:#443a68;
  --gold:#e0b74a;--gold2:#f5d98a;--gold-d:#8a6f22;
  --txt:#e8e2d5;--txt2:#a99fc4;--txt3:#6f6690;
  --red:#d4574e;--grn:#5fbf87;--blu:#5aa9e6;--pur:#a97fe0;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Noto Serif KR','Nanum Myeongjo',Georgia,'Apple SD Gothic Neo',serif;
  font-size:14px;display:flex;flex-direction:column;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(224,183,74,.06),transparent 55%),
                   radial-gradient(ellipse at 85% 100%,rgba(169,127,224,.06),transparent 55%);
}
#app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
button{border:none;cursor:pointer;font-family:inherit;font-size:inherit;background:none;color:inherit;outline:none;}
input,textarea,select{outline:none;font-family:inherit;}

/* 스크롤 */
.scrollY{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#4d4270 transparent;overscroll-behavior:contain;}
.scrollY::-webkit-scrollbar{width:10px;}
.scrollY::-webkit-scrollbar-track{background:rgba(255,255,255,.03);border-radius:5px;}
.scrollY::-webkit-scrollbar-thumb{background:#4d4270;border-radius:5px;border:2px solid transparent;background-clip:content-box;}
.scrollY::-webkit-scrollbar-thumb:hover{background:#6b5c99;background-clip:content-box;}
.scrollX{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#4d4270 transparent;}
.scrollX::-webkit-scrollbar{height:9px;}
.scrollX::-webkit-scrollbar-thumb{background:#4d4270;border-radius:5px;border:2px solid transparent;background-clip:content-box;}

/* ── 헤더 ── */
.hdr{background:linear-gradient(180deg,#191430,#12101d);border-bottom:2px solid var(--gold-d);
     padding:0 16px;height:58px;display:flex;align-items:center;gap:12px;flex-shrink:0;
     box-shadow:0 2px 18px rgba(0,0,0,.5);}
.logo{font-size:18px;font-weight:700;color:var(--gold);white-space:nowrap;letter-spacing:1px;
      text-shadow:0 0 14px rgba(224,183,74,.35);}
.logo span{font-size:11px;color:var(--txt3);margin-left:7px;letter-spacing:0;font-weight:400;}
.tabs{display:flex;gap:4px;margin-left:auto;flex-shrink:0;}
.tab{padding:7px 15px;border-radius:5px 5px 0 0;font-size:13px;font-weight:700;color:var(--txt3);
     border:1px solid transparent;border-bottom:none;transition:.13s;white-space:nowrap;}
.tab:hover{color:var(--txt);background:rgba(255,255,255,.04);}
.tab.on{color:var(--gold);background:var(--s2);border-color:var(--bd2);}

/* ── 본문 ── */
.main{display:flex;flex:1;min-height:0;}
.view{display:none;flex:1;min-height:0;}
.view.on{display:flex;}

/* 왼쪽 목록 */
.side{width:236px;min-width:236px;background:var(--s1);border-right:1px solid var(--bd);
      display:flex;flex-direction:column;flex-shrink:0;}
.side-search{padding:9px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.side-search input{width:100%;background:var(--s3);border:1px solid var(--bd2);border-radius:5px;
                   padding:7px 10px;color:var(--txt);font-size:13px;}
.side-search input:focus{border-color:var(--gold);}
.side-search input::placeholder{color:var(--txt3);}
.side-list{flex:1 1 auto;min-height:0;padding:7px 6px 14px;}
.cat-head{font-size:10.5px;font-weight:700;letter-spacing:2px;color:var(--gold-d);
          padding:11px 8px 5px;display:flex;align-items:center;gap:7px;}
.cat-head i{flex:1;height:1px;background:linear-gradient(90deg,var(--bd2),transparent);font-style:normal;}
.sys-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:6px;
         border:1px solid transparent;text-align:left;transition:.12s;margin-bottom:2px;color:var(--txt2);}
.sys-btn:hover{background:var(--s3);color:var(--txt);}
.sys-btn.on{background:linear-gradient(90deg,rgba(224,183,74,.14),rgba(224,183,74,.03));
            border-color:rgba(224,183,74,.4);color:var(--gold2);}
.sys-ico{font-size:17px;flex-shrink:0;width:22px;text-align:center;}
.sys-nm{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sys-ct{font-size:10px;color:var(--txt3);flex-shrink:0;}
.empty-note{color:var(--txt3);font-size:12.5px;padding:16px 10px;text-align:center;line-height:1.8;}

/* 오른쪽 본문 */
.doc{flex:1;min-width:0;display:flex;flex-direction:column;}
.doc-body{flex:1 1 auto;min-height:0;padding:20px 26px 60px;}
.doc-hd{border-bottom:1px solid var(--bd);padding-bottom:14px;margin-bottom:18px;}
.doc-ttl{font-size:26px;font-weight:700;color:var(--gold);letter-spacing:1px;display:flex;align-items:center;gap:11px;}
.doc-ttl .badge{font-size:11px;padding:3px 9px;border-radius:11px;border:1px solid var(--bd2);
                color:var(--txt3);letter-spacing:0;font-weight:400;background:var(--s2);}
.doc-desc{font-size:13.5px;color:var(--txt2);line-height:1.95;margin-top:9px;}
.sec-ttl{font-size:14px;font-weight:700;color:var(--gold2);margin:26px 0 11px;
         display:flex;align-items:center;gap:9px;letter-spacing:1px;}
.sec-ttl::before{content:'◆';color:var(--gold-d);font-size:11px;}

/* 피라미드 */
.pyramid{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 4px;}
.pyr-row{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;}
.pyr-bar{border-radius:5px;padding:7px 14px;font-size:12.5px;font-weight:700;text-align:center;
         color:#120f1c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
         box-shadow:0 2px 9px rgba(0,0,0,.4);transition:.14s;cursor:default;}
.pyr-bar:hover{filter:brightness(1.18);transform:translateY(-1px);}
.pyr-lv{font-size:10.5px;color:var(--txt3);width:34px;text-align:right;flex-shrink:0;}
.pyr-en{font-size:10.5px;color:var(--txt3);width:120px;flex-shrink:0;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;font-style:italic;}

/* 표 */
.tbl-wrap{border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--s1);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:var(--s3);color:var(--gold2);font-weight:700;text-align:left;
         padding:9px 12px;font-size:11.5px;letter-spacing:1px;border-bottom:1px solid var(--bd2);white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top;line-height:1.75;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,.028);}
.td-lv{color:var(--txt3);font-size:11px;width:34px;text-align:center;}
.td-nm{font-weight:700;white-space:nowrap;}
.td-nm .en{display:block;font-size:10.5px;color:var(--txt3);font-weight:400;font-style:italic;margin-top:2px;}
.td-style{color:var(--gold2);font-size:12.5px;white-space:nowrap;}
.td-rule{color:var(--txt2);font-size:12.5px;min-width:150px;}
.td-note{color:var(--txt3);font-size:12px;min-width:190px;}
.rank-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;}

/* 팁 카드 */
.tips{display:flex;flex-direction:column;gap:8px;}
.tip{background:linear-gradient(90deg,rgba(224,183,74,.07),transparent);
     border-left:3px solid var(--gold-d);border-radius:0 7px 7px 0;padding:11px 15px;
     font-size:13px;color:var(--txt2);line-height:1.9;}
.tip b{color:var(--gold2);font-weight:700;}
.hint-box{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:13px 16px;
          font-size:12.5px;color:var(--txt2);line-height:1.9;}
.hint-box b{color:var(--gold2);}

/* ── 빌더 ── */
.b-side{width:250px;min-width:250px;background:var(--s1);border-right:1px solid var(--bd);
        display:flex;flex-direction:column;flex-shrink:0;}
.b-sec{padding:10px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.b-sec-t{font-size:10.5px;font-weight:700;letter-spacing:1.5px;color:var(--gold-d);margin-bottom:7px;}
.fi{width:100%;background:var(--s3);border:1px solid var(--bd2);border-radius:5px;
    padding:7px 10px;color:var(--txt);font-size:13px;margin-bottom:6px;}
.fi:focus{border-color:var(--gold);}
.fi::placeholder{color:var(--txt3);}
textarea.fi{resize:vertical;min-height:52px;line-height:1.7;font-size:12.5px;}
.btn{padding:7px 12px;border-radius:5px;font-size:12px;font-weight:700;background:var(--s3);
     border:1px solid var(--bd2);color:var(--txt2);transition:.12s;white-space:nowrap;flex-shrink:0;}
.btn:hover{color:var(--gold2);border-color:var(--gold-d);background:var(--s4);}
.btn.pri{color:var(--gold);border-color:rgba(224,183,74,.45);background:rgba(224,183,74,.09);}
.btn.pri:hover{background:rgba(224,183,74,.18);}
.btn.danger{color:var(--red);border-color:rgba(212,87,78,.35);}
.btn.danger:hover{background:rgba(212,87,78,.14);border-color:var(--red);color:var(--red);}
.btn:disabled{opacity:.38;cursor:default;}
.btn:disabled:hover{color:var(--txt2);border-color:var(--bd2);background:var(--s3);}
.btn-row{display:flex;gap:5px;flex-wrap:wrap;}
.btn-row .btn{flex:1;text-align:center;}
.saved-list{flex:1 1 auto;min-height:60px;padding:6px;}
.saved-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:5px;
            border:1px solid transparent;cursor:pointer;margin-bottom:2px;transition:.12s;}
.saved-item:hover{background:var(--s3);border-color:var(--bd);}
.saved-item.cur{background:rgba(224,183,74,.1);border-color:rgba(224,183,74,.4);}
.sv-nm{flex:1;min-width:0;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sv-meta{font-size:10px;color:var(--txt3);flex-shrink:0;}
.sv-del{font-size:13px;color:var(--txt3);padding:0 3px;flex-shrink:0;}
.sv-del:hover{color:var(--red);}

.b-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.b-bar{background:var(--s1);border-bottom:1px solid var(--bd);padding:8px 12px;
       display:flex;align-items:center;gap:7px;flex-shrink:0;flex-wrap:nowrap;}
.b-body{flex:1 1 auto;min-height:0;padding:16px 20px 60px;}
.seg{display:flex;background:var(--s3);border:1px solid var(--bd2);border-radius:6px;overflow:hidden;flex-shrink:0;}
.seg button{padding:6px 13px;font-size:12px;font-weight:700;color:var(--txt3);transition:.12s;}
.seg button.on{background:rgba(224,183,74,.16);color:var(--gold2);}

/* 빌더 계급 행 */
.tier-row{display:flex;align-items:flex-start;gap:8px;background:var(--s1);border:1px solid var(--bd);
          border-left-width:4px;border-radius:8px;padding:10px 12px;margin-bottom:7px;}
.tier-lv{font-size:11px;color:var(--txt3);width:26px;text-align:center;padding-top:9px;flex-shrink:0;font-weight:700;}
.tier-fields{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.tier-fields .fi{margin-bottom:0;}
.tier-fields .wide{grid-column:1 / -1;}
.tier-ops{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
.iop{width:26px;height:24px;border-radius:4px;background:var(--s3);border:1px solid var(--bd2);
     color:var(--txt3);font-size:11px;display:flex;align-items:center;justify-content:center;transition:.12s;}
.iop:hover{color:var(--gold2);border-color:var(--gold-d);}
.iop.del:hover{color:var(--red);border-color:var(--red);}
.color-dot{width:26px;height:24px;border-radius:4px;border:1px solid var(--bd2);cursor:pointer;padding:0;}
.add-tier{width:100%;padding:11px;border-radius:8px;border:1.5px dashed var(--bd2);color:var(--txt3);
          font-size:13px;font-weight:700;transition:.12s;margin-top:4px;}
.add-tier:hover{border-color:var(--gold-d);color:var(--gold2);background:rgba(224,183,74,.05);}
.b-empty{text-align:center;color:var(--txt3);padding:44px 20px;font-size:13.5px;line-height:2.1;}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(5,4,10,.8);z-index:200;display:flex;
          align-items:center;justify-content:center;backdrop-filter:blur(5px);padding:14px;}
.modal-bg.hidden{display:none;}
.modal{background:var(--s1);border:1px solid var(--bd2);border-radius:12px;width:min(680px,100%);
       max-height:88vh;display:flex;flex-direction:column;box-shadow:0 26px 70px rgba(0,0,0,.7);}
.modal-hd{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.modal-ttl{font-size:15px;font-weight:700;color:var(--gold);}
.modal-x{margin-left:auto;font-size:18px;color:var(--txt3);padding:2px 6px;}
.modal-x:hover{color:var(--txt);}
.modal-body{padding:15px 18px;flex:1;min-height:0;}
.modal-ft{padding:11px 18px;border-top:1px solid var(--bd);display:flex;gap:7px;align-items:center;flex-shrink:0;flex-wrap:wrap;}
.out-area{width:100%;min-height:300px;background:var(--s2);border:1px solid var(--bd2);border-radius:7px;
          padding:12px;color:var(--txt);font-size:12.5px;line-height:1.75;resize:vertical;
          font-family:'D2Coding','Consolas',monospace;}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:7px;}
.preset-card{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:11px 13px;
             cursor:pointer;transition:.13s;text-align:left;}
.preset-card:hover{border-color:var(--gold-d);background:var(--s3);transform:translateY(-1px);}
.pc-nm{font-size:13px;font-weight:700;color:var(--gold2);margin-bottom:3px;}
.pc-ct{font-size:11px;color:var(--txt3);}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);background:var(--s4);
       border:1px solid var(--gold-d);border-radius:22px;padding:8px 18px;font-size:13px;color:var(--gold2);
       opacity:0;pointer-events:none;transition:.19s;z-index:400;box-shadow:0 9px 30px rgba(0,0,0,.6);}
.toast.on{opacity:1;transform:translate(-50%,0);}

@media(max-height:470px){
  html,body{overflow:auto;}
  #app{height:auto;min-height:470px;}
}
@media(max-width:820px){
  .side,.b-side{position:absolute;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%);
                transition:.19s;box-shadow:10px 0 30px rgba(0,0,0,.6);}
  .side.open,.b-side.open{transform:none;}
  .side-tgl{display:flex!important;}
  .main{position:relative;}
  .doc-body,.b-body{padding:14px 13px 60px;}
  .doc-ttl{font-size:20px;}
  .tier-fields{grid-template-columns:1fr;}
  .pyr-en{display:none;}
  .logo span{display:none;}
}
.side-tgl{display:none;width:30px;height:30px;border-radius:6px;background:var(--s3);
          border:1px solid var(--bd2);color:var(--txt2);font-size:15px;align-items:center;justify-content:center;flex-shrink:0;}
</style>
</head>
<body>
<div id="app">

<header class="hdr">
  <button class="side-tgl" id="sideTgl" title="목록">☰</button>
  <div class="logo">📜 계급 표 틀<span>소설 설정 자료실 &amp; 제작기</span></div>
  <div class="tabs">
    <button class="tab on" data-view="ref">📚 자료실</button>
    <button class="tab" data-view="build">🛠 내 계급표</button>
    <button class="tab" data-view="guide">📖 작법 팁</button>
  </div>
</header>

<div class="main">

  <!-- ══ 자료실 ══ -->
  <div class="view on" id="v-ref">
    <aside class="side" id="refSide">
      <div class="side-search"><input type="text" id="refSearch" placeholder="계급·체계 검색 (예: 공작, 마법사)"></div>
      <div class="side-list scrollY" id="sysList"></div>
    </aside>
    <div class="doc">
      <div class="doc-body scrollY" id="docBody"></div>
    </div>
  </div>

  <!-- ══ 빌더 ══ -->
  <div class="view" id="v-build">
    <aside class="b-side" id="buildSide">
      <div class="b-sec">
        <div class="b-sec-t">계급표 정보</div>
        <input type="text" class="fi" id="bTitle" placeholder="계급표 이름 (예: 아르헨 제국 서열)" maxlength="60">
        <textarea class="fi" id="bDesc" placeholder="세계관 메모 — 어떤 나라·조직인지, 어떤 규칙이 있는지" maxlength="600"></textarea>
        <div class="btn-row">
          <button class="btn pri" id="bSave">💾 저장</button>
          <button class="btn" id="bNew">＋ 새로</button>
        </div>
      </div>
      <div class="b-sec">
        <div class="b-sec-t">불러오기</div>
        <div class="btn-row">
          <button class="btn" id="bPreset">📚 자료실에서</button>
          <button class="btn" id="bImport">📥 JSON</button>
        </div>
      </div>
      <div class="b-sec" style="border-bottom:none;padding-bottom:4px;">
        <div class="b-sec-t">저장한 계급표 <span id="bCount" style="color:var(--gold);">0</span></div>
      </div>
      <div class="saved-list scrollY" id="savedList"></div>
    </aside>

    <div class="b-main">
      <div class="b-bar scrollX">
        <div class="seg">
          <button class="on" data-bview="edit">✏️ 편집</button>
          <button data-bview="table">📋 표</button>
          <button data-bview="pyr">🔺 피라미드</button>
        </div>
        <span style="flex:1;"></span>
        <button class="btn" id="bMd">📄 마크다운</button>
        <button class="btn" id="bTxt">📝 텍스트</button>
        <button class="btn" id="bJson">📤 JSON</button>
        <button class="btn danger" id="bClear">🗑 비우기</button>
      </div>
      <div class="b-body scrollY" id="bBody"></div>
    </div>
  </div>

  <!-- ══ 작법 팁 ══ -->
  <div class="view" id="v-guide">
    <div class="doc">
      <div class="doc-body scrollY" id="guideBody"></div>
    </div>
  </div>

</div>
</div>

<!-- 내보내기 모달 -->
<div class="modal-bg hidden" id="outModal">
  <div class="modal">
    <div class="modal-hd"><span id="outIcon">📄</span><span class="modal-ttl" id="outTtl">내보내기</span>
      <button class="modal-x" data-close="outModal">✕</button></div>
    <div class="modal-body"><textarea class="out-area scrollY" id="outArea" spellcheck="false"></textarea></div>
    <div class="modal-ft">
      <span style="font-size:11.5px;color:var(--txt3);" id="outHint">그대로 복사해서 원고나 설정 노트에 붙여넣으세요.</span>
      <span style="flex:1;"></span>
      <button class="btn" data-close="outModal">닫기</button>
      <button class="btn pri" id="outCopy">📋 전체 복사</button>
    </div>
  </div>
</div>

<!-- 프리셋 모달 -->
<div class="modal-bg hidden" id="presetModal">
  <div class="modal">
    <div class="modal-hd"><span>📚</span><span class="modal-ttl">자료실에서 가져오기</span>
      <button class="modal-x" data-close="presetModal">✕</button></div>
    <div class="modal-body scrollY">
      <div class="hint-box" style="margin-bottom:12px;">
        고른 체계가 <b>편집 화면으로 그대로 복사</b>됩니다. 가져온 뒤 이름·권한·메모를 내 세계관에 맞게 고쳐 쓰세요.
        원본 자료는 그대로 남습니다.
      </div>
      <div class="preset-grid" id="presetGrid"></div>
    </div>
    <div class="modal-ft">
      <label style="font-size:12px;color:var(--txt2);display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" id="presetAppend"> 지금 목록 <b style="color:var(--gold2);">아래에 이어붙이기</b>
      </label>

    '기술 서열과 전투력을 분리하라. 최고 대장장이가 전투는 못 하는 편이 오히려 <b>지켜야 할 존재</b>가 되어 이야기가 생긴다.',
  ]

const CATS = ['현실 · 역사','판타지 · 왕국','판타지 · 마법 · 신앙','판타지 · 조직','판타지 · 종족'];
const SYS_MAP = new Map(SYSTEMS.map(s => [s.id, s]));

// 계급 색 — 위(밝고 진함)에서 아래(어둡고 옅음)로 자동 생성
function tierColor(hue, idx, total){
  const t = total <= 1 ? 0 : idx / (total - 1);
  const light = 66 - t * 30;
  const sat = 62 - t * 38;
  return `hsl(${hue},${sat}%,${light}%)`;
}

const STORE_KEY = 'rank87_saved';
let curSys = SYSTEMS[0].id;

let view = 'ref';
let bView = 'edit';

let doc = newDoc();          // 현재 편집 중인 계급표

function newDoc(){ return {id:null, title:'', desc:'', tiers:[]}; }
function newTier(){ return {id:uid(), n:'', en:'', style:'', rule:'', note:'', c:''}; }

function loadSaved(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    return Array.isArray(raw) ? raw.map(normDoc) : [];
  }catch{ return []; }
}
function normDoc(d){
  return {
    id: typeof d.id === 'string' && d.id ? d.id : uid(),
    title: String(d.title || '이름 없는 계급표').slice(0,60),
    desc: String(d.desc || '').slice(0,600),
    tiers: (Array.isArray(d.tiers) ? d.tiers : []).map(t => ({
      id: uid(),
      n: String(t.n || '').slice(0,40),

      note: String(t.note || '').slice(0,400),
      c: typeof t.c === 'string' ? t.c : '',

}
function persist(){

function matchSys(s, q){
  if(!q) return true;
  if(s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q)) return true;
  return s.tiers.some(t =>
    (t.n||'').toLowerCase().includes(q) ||
    (t.en||'').toLowerCase().includes(q) ||
    (t.rule||'').toLowerCase().includes(q));
}

function renderSysList(){
  const box = $('sysList');
  const q = refQ.trim().toLowerCase();
  const found = SYSTEMS.filter(s => matchSys(s, q));
  box.innerHTML = '';
  if(!found.length){
    box.innerHTML = '<div class="empty-note">찾는 계급이 없습니다.<br>다른 말로 검색해 보세요.</div>';
    return;
  }
  CATS.forEach(cat => {
    const list = found.filter(s => s.cat === cat);
    if(!list.length) return;
    const h = document.createElement('div');
    h.className = 'cat-head';
    h.innerHTML = `${esc(cat)}<i></i>`;
    box.appendChild(h);
    list.forEach(s => {
      const b = document.createElement('button');
      b.className = 'sys-btn' + (s.id === curSys ? ' on' : '');
      b.innerHTML =

        `<span class="sys-ct">${s.tiers.length}단계</span>`;

}

function pyramidHTML(tiers, hue){
  const n = tiers.length;
  return `<div class="pyramid">` + tiers.map((t, i) => {
    const w = 30 + (n <= 1 ? 60 : (i / (n - 1)) * 58);
    const col = t.c || tierColor(hue, i, n);
    return `<div class="pyr-row">` +
      `<span class="pyr-lv">${i + 1}</span>` +
      `<div class="pyr-bar" style="background:${col};width:${w.toFixed(1)}%" title="${esc(t.rule||'')}">${esc(t.n||'(이름 없음)')}</div>` +
      `<span class="pyr-en">${esc(t.en||'')}</span>` +
    `</div>`;
  }).join('') + `</div>`;
}

function tableHTML(tiers, hue){
  return `<div class="tbl-wrap"><div class="scrollX"><table>` +
    `<thead><tr><th>#</th><th>계급</th><th>호칭</th><th>관할 · 권한</th><th>설정 메모</th></tr></thead><tbody>` +
    tiers.map((t, i) => {
      const col = t.c || tierColor(hue, i, tiers.length);
      return `<tr>` +
        `<td class="td-lv">${i + 1}</td>` +
        `<td class="td-nm"><span class="rank-dot" style="background:${col}"></span>${esc(t.n||'(이름 없음)')}` +
          (t.en ? `<span class="en">${esc(t.en)}</span>` : '') + `</td>` +
        `<td class="td-style">${esc(t.style||'—')}</td>` +
        `<td class="td-rule">${esc(t.rule||'—')}</td>` +
        `<td class="td-note">${esc(t.note||'')}</td>` +
      `</tr>`;
    }).join('') + `</tbody></table></div></div>`;
}

function tierRow(t, i){
  const col = t.c || tierColor(45, i, doc.tiers.length);
  const el = document.createElement('div');
  el.className = 'tier-row';
  el.style.borderLeftColor = col;
  el.innerHTML =
    `<div class="tier-lv">${i + 1}</div>` +
    `<div class="tier-fields">` +
      `<input class="fi" data-f="n" placeholder="계급명 (예: 대공)" maxlength="40" value="${esc(t.n)}">` +
      `<input class="fi" data-f="en" placeholder="원어·영문 (예: Archduke)" maxlength="60" value="${esc(t.en)}">` +
      `<input class="fi" data-f="style" placeholder="호칭 (예: 전하)" maxlength="40" value="${esc(t.style)}">` +
      `<input class="fi" data-f="rule" placeholder="관할·권한" maxlength="200" value="${esc(t.rule)}">` +
      `<input class="fi wide" data-f="note" placeholder="설정 메모 — 이 계급으로 무슨 이야기를 만들 수 있는지" maxlength="400" value="${esc(t.note)}">` +
    `</div>` +
    `<div class="tier-ops">` +
      `<input type="color" class="color-dot" value="${toHex(col)}" title="색">` +
      `<button class="iop" data-a="up" title="위로">▲</button>` +
      `<button class="iop" data-a="dn" title="아래로">▼</button>` +
      `<button class="iop del" data-a="del" title="삭제">✕</button>` +
    `</div>`;

  el.querySelectorAll('.fi').forEach(inp => {
    inp.oninput = e => { t[e.target.dataset.f] = e.target.value; };
  });
  el.querySelector('.color-dot').oninput = e => {
    t.c = e.target.value;
    el.style.borderLeftColor = t.c;
  };
  el.querySelectorAll('.iop').forEach(b => {
    b.onclick = () => {
      const a = b.dataset.a;
      if(a === 'up' && i > 0){ [doc.tiers[i-1], doc.tiers[i]] = [doc.tiers[i], doc.tiers[i-1]]; }
      else if(a === 'dn' && i < doc.tiers.length - 1){ [doc.tiers[i+1], doc.tiers[i]] = [doc.tiers[i], doc.tiers[i+1]]; }
      else if(a === 'del'){
        if(!confirm(`"${t.n || '이름 없는 계급'}"을(를) 지울까요?`)) return;
        doc.tiers.splice(i, 1);
      }else return;
      renderBuilder();
    };
  });
  return el;
}

// hsl(...) 문자열도 color input에 넣을 수 있게 hex로 바꾼다
function toHex(col){
  if(!col) return '#888888';
  if(col[0] === '#') return col.length === 7 ? col : '#888888';
  const m = col.match(/hsl\(\s*([\d.]+)\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*\)/);
  if(!m) return '#888888';
  const h = parseFloat(m[1]) / 360, s = parseFloat(m[2]) / 100, l = parseFloat(m[3]) / 100;
  const f = k => {
    const a = s * Math.min(l, 1 - l);
    const x = (k + h * 12) % 12;
    const v = l - a * Math.max(-1, Math.min(x - 3, Math.min(9 - x, 1)));
    return Math.round(v * 255).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
}

// ── 저장 목록 ──
function renderSaved(){
  const box = $('savedList');
  $('bCount').textContent = saved.length;
  box.innerHTML = '';
  if(!saved.length){
    box.innerHTML = '<div class="empty-note">저장한 계급표가 없습니다.<br>만든 뒤 💾 저장을 누르세요.</div>';
    return;
  }
  saved.forEach(d => {
    const el = document.createElement('div');
    el.className = 'saved-item' + (d.id === doc.id ? ' cur' : '');
    el.innerHTML =
      `<div class="sv-nm">${esc(d.title)}</div>` +
      `<span class="sv-meta">${d.tiers.length}단</span>` +
      `<button class="sv-del" title="삭제">✕</button>`;
    el.onclick = e => {
      if(e.target.closest('.sv-del')) return;
      doc = normDoc(JSON.parse(JSON.stringify(d)));
      doc.id = d.id;
      $('bTitle').value = doc.title;
      $('bDesc').value = doc.desc;
      renderBuilder(); renderSaved();
      $('buildSide').classList.remove('open');
      toast(`"${d.title}" 불러옴`);
    };
    el.querySelector('.sv-del').onclick = e => {
      e.stopPropagation();
      if(!confirm(`"${d.title}"을(를) 삭제할까요?`)) return;
      saved = saved.filter(x => x.id !== d.id);
      if(doc.id === d.id) doc.id = null;
      persist(); renderSaved();
      toast('삭제했습니다');
    };
    box.appendChild(el);
  });
}

function saveDoc(){
  doc.title = ($('bTitle').value.trim() || '이름 없는 계급표').slice(0,60);
  doc.desc = $('bDesc').value.trim().slice(0,600);
  if(!doc.tiers.length){ toast('계급을 하나 이상 추가해 주세요'); return; }
  const snap = normDoc(JSON.parse(JSON.stringify(doc)));
  if(doc.id && saved.some(d => d.id === doc.id)){
    snap.id = doc.id;
    saved = saved.map(d => d.id === doc.id ? snap : d);
    toast('덮어썼습니다');
  }else{
    snap.id = uid();
    doc.id = snap.id;
    saved.push(snap);
    toast(`"${snap.title}" 저장됨`);
  }
  $('bTitle').value = doc.title;
  persist(); renderSaved();
}

function curDocForExport(){
  return {
    title: ($('bTitle').value.trim() || doc.title || '이름 없는 계급표'),
    desc: ($('bDesc').value.trim() || doc.desc || ''),
    tiers: doc.tiers,
  };
}
const cell = s => String(s || '').replace(/\|/g, '\\|').replace(/\n/g, ' ') || '—';

function toMarkdown(d){
  let out = `# ${d.title}\n\n`;
  if(d.desc) out += `> ${d.desc}\n\n`;
  out += `| # | 계급 | 원어 | 호칭 | 관할·권한 | 설정 메모 |\n`;
  out += `|---|------|------|------|-----------|-----------|\n`;
  d.tiers.forEach((t, i) => {
    out += `| ${i+1} | **${cell(t.n)}** | ${cell(t.en)} | ${cell(t.style)} | ${cell(t.rule)} | ${cell(t.note)} |\n`;
  });
  return out;
}
function toText(d){
  let out = `【 ${d.title} 】\n`;
  if(d.desc) out += `${d.desc}\n`;
  out += `${'─'.repeat(34)}\n`;
  d.tiers.forEach((t, i) => {
    out += `${String(i+1).padStart(2,' ')}. ${t.n || '(이름 없음)'}`;
    if(t.en) out += `  (${t.en})`;
    out += '\n';
    if(t.style) out += `    호칭   ${t.style}\n`;
    if(t.rule)  out += `    권한   ${t.rule}\n`;
    if(t.note)  out += `    메모   ${t.note}\n`;
  });
  return out;
}

function openOut(kind){
  const d = curDocForExport();
  if(!d.tiers.length){ toast('계급을 먼저 추가해 주세요'); return; }
  let text, ttl, ico, hint;
  if(kind === 'md'){
    text = toMarkdown(d); ttl = '마크다운으로 내보내기'; ico = '📄';
    hint = '노션·옵시디언·깃허브에 그대로 붙여넣으면 표로 보입니다.';
  }else if(kind === 'txt'){
    text = toText(d); ttl = '텍스트로 내보내기'; ico = '📝';
    hint = '한글·워드 등 아무 곳에나 붙여넣을 수 있는 형태입니다.';
  }else{
    text = JSON.stringify({v:1, doc:{title:d.title, desc:d.desc, tiers:d.tiers.map(t =>
      ({n:t.n, en:t.en, style:t.style, rule:t.rule, note:t.note, c:t.c}))}}, null, 2);
    ttl = 'JSON으로 내보내기'; ico = '📤';
    hint = '이 글을 저장해 두면 나중에 📥 JSON으로 그대로 되살릴 수 있습니다.';
  }
  $('outTtl').textContent = ttl;
  $('outIcon').textContent = ico;
  $('outHint').textContent = hint;
  $('outArea').value = text;
  $('outModal').classList.remove('hidden');
  setTimeout(() => { $('outArea').focus(); $('outArea').select(); }, 60);
}

function copyText(text){
  const done = ok => toast(ok ? '복사했습니다' : '복사에 실패했습니다 — 직접 선택해 주세요');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(() => done(true)).catch(() => fallbackCopy(text, done));
  }else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  ta.remove(); done(ok);
}

function importJSON(file){
  const r = new FileReader();
  r.onerror = () => toast('파일을 읽을 수 없습니다');
  r.onload = e => {
    let d;
    try{ d = JSON.parse(e.target.result); }catch{ toast('JSON 형식이 아닙니다'); return; }
    const raw = d && d.doc ? d.doc : d;
    if(!raw || !Array.isArray(raw.tiers)){ toast('계급표 형식이 아닙니다'); return; }
    doc = normDoc(raw);
    doc.id = null;
    $('bTitle').value = doc.title;
    $('bDesc').value = doc.desc;
    renderBuilder(); renderSaved();
    toast(`${doc.tiers.length}단계를 불러왔습니다`);
  };
  r.readAsText(file);
}

function renderGuide(){
  $('guideBody').innerHTML =
    `<div class="doc-hd">` +
      `<div class="doc-ttl">📖 계급 설계 작법 팁</div>` +
      `<div class="doc-desc">계급표는 설정집을 채우려고 만드는 게 아니라, <b style="color:var(--gold2)">인물이 움직일 이유</b>를 만들려고 만든다. 아래는 표를 이야기로 바꾸는 요령이다.</div>` +
    `</div>` +
    GUIDE.map(g =>
      `<div class="sec-ttl">${esc(g.t)}</div><div class="tips">` +
      g.items.map(i => `<div class="tip">${i}</div>`).join('') + `</div>`
    ).join('');
}

// ═══════════════════════════════════════════════════════
// 화면 전환 · 레이아웃
// ═══════════════════════════════════════════════════════
function switchView(v){
  view = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === v));
  $('v-ref').classList.toggle('on', v === 'ref');
  $('v-build').classList.toggle('on', v === 'build');
  $('v-guide').classList.toggle('on', v === 'guide');
  $('sideTgl').style.visibility = (v === 'guide') ? 'hidden' : '';
  fitLayout();
}

// 목록·본문 높이를 화면 기준으로 직접 계산해 못박는다.
// 부모 레이아웃이 어떻든 안쪽이 화면 안에 갇히므로 항상 스크롤된다.
function fitLayout(){
  const vh = window.innerHeight;
  const set = (el, extra) => {
    if(!el || !el.offsetParent) return;
    const top = el.getBoundingClientRect().top;
    el.style.flex = 'none';
    el.style.height = Math.max(80, Math.round(vh - top - (extra || 0))) + 'px';
  };
  set($('sysList')); set($('docBody')); set($('guideBody'));
  set($('bBody')); set($('savedList'), 8);
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
(function init(){
  renderSysList(); renderDoc(); renderGuide();
  renderBuilder(); renderSaved(); renderPresetGrid();

  document.querySelectorAll('.tab').forEach(t => { t.onclick = () => switchView(t.dataset.view); });
  $('sideTgl').onclick = () => {
    (view === 'build' ? $('buildSide') : $('refSide')).classList.toggle('open');
  };
  $('refSearch').oninput = e => { refQ = e.target.value; renderSysList(); };

  // 빌더 배선
  $('bTitle').oninput = e => { doc.title = e.target.value; };
  $('bDesc').oninput = e => { doc.desc = e.target.value; };
  $('bSave').onclick = saveDoc;
  $('bNew').onclick = () => {
    if(doc.tiers.length && !confirm('지금 편집 중인 내용을 비우고 새로 시작할까요?')) return;
    doc = newDoc();
    $('bTitle').value = ''; $('bDesc').value = '';
    renderBuilder(); renderSaved();
  };
  $('bClear').onclick = () => {
    if(!doc.tiers.length) return;
    if(!confirm('계급 목록을 전부 지울까요? (저장한 표는 그대로 남습니다)')) return;
    doc.tiers = [];
    renderBuilder();
  };
  $('bPreset').onclick = () => { $('presetModal').classList.remove('hidden'); };
  $('bImport').onclick = () => $('fileIn').click();
  $('fileIn').onchange = e => { if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ''; };
  $('bMd').onclick = () => openOut('md');
  $('bTxt').onclick = () => openOut('txt');
  $('bJson').onclick = () => openOut('json');

  document.querySelectorAll('[data-bview]').forEach(b => {
    b.onclick = () => {
      bView = b.dataset.bview;
      document.querySelectorAll('[data-bview]').forEach(x => x.classList.toggle('on', x === b));
      renderBuilder();
    };
  });

  // 모달
  document.querySelectorAll('[data-close]').forEach(b => {
    b.onclick = () => $(b.dataset.close).classList.add('hidden');
  });
  document.querySelectorAll('.modal-bg').forEach(bg => {
    bg.onmousedown = e => { if(e.target === bg) bg.classList.add('hidden'); };
  });
  $('outCopy').onclick = () => copyText($('outArea').value);

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      document.querySelectorAll('.modal-bg:not(.hidden)').forEach(m => m.classList.add('hidden'));
      document.querySelectorAll('.side.open,.b-side.open').forEach(s => s.classList.remove('open'));
    }
  });

  fitLayout();
  window.addEventListener('resize', fitLayout);
  window.addEventListener('load', fitLayout);
  if(window.ResizeObserver) new ResizeObserver(fitLayout).observe(document.documentElement);
  setTimeout(fitLayout, 80);
  setTimeout(fitLayout, 400);
})();
</script>

</html>
