<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Godot Engine 정리</title>
<style>
:root{
  --bg:#080c10;--surf:#0e1318;--surf2:#131920;--bdr:#1a2028;
  --text:#c8c0b0;--dim:#556070;
  --purple:#a78bfa;--green:#34d399;--blue:#60a5fa;--yellow:#fbbf24;--red:#f87171;--pink:#f472b6;
  --code-bg:#060a0e;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,'Malgun Gothic',sans-serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100%;}

/* ── 탭 ── */
#tab-bar{display:flex;background:var(--surf);border-bottom:2px solid var(--bdr);flex-shrink:0;}
.tab{flex:1;padding:9px 4px;font-size:11px;font-weight:600;cursor:pointer;color:var(--dim);
  border-bottom:2px solid transparent;text-align:center;transition:.15s;margin-bottom:-2px;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--purple);border-bottom-color:var(--purple);}

/* ── 서브바 (검색+카테고리) ── */
#sub-bar{flex-shrink:0;}
#search-row{display:flex;align-items:center;gap:8px;padding:7px 12px;
  background:var(--surf);border-bottom:1px solid var(--bdr);}
#sw{flex:1;display:flex;align-items:center;gap:6px;background:var(--surf2);
  border:1px solid var(--bdr);border-radius:8px;padding:5px 10px;}
#sw svg{flex-shrink:0;opacity:.4;}
#sq{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:12px;font-family:inherit;}
#sq::placeholder{color:var(--dim);}
#cnt{font-size:11px;color:var(--dim);white-space:nowrap;font-family:monospace;}
#cat-bar{display:flex;gap:5px;padding:5px 12px;overflow-x:auto;
  background:var(--surf);border-bottom:1px solid var(--bdr);scrollbar-width:none;}
#cat-bar::-webkit-scrollbar{display:none;}
.cbt{padding:3px 10px;border-radius:20px;font-size:10px;border:1px solid var(--bdr);
  background:transparent;color:var(--dim);cursor:pointer;transition:.15s;white-space:nowrap;font-family:inherit;}
.cbt:hover{color:var(--text);}
.cbt.on{border-color:var(--purple);color:var(--purple);background:rgba(167,139,250,.1);}

/* ── 본문 ── */
#content{flex:1;overflow-y:auto;padding:12px;}
#content::-webkit-scrollbar{width:4px;}
#content::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}

.panel{display:none;flex-direction:column;gap:14px;}
.panel.on{display:flex;}

/* ── 섹션 헤더 ── */
.sec-hd{font-size:11px;font-weight:700;color:var(--purple);letter-spacing:.8px;
  text-transform:uppercase;padding:5px 2px;border-bottom:1px solid var(--bdr);margin-bottom:4px;
  position:sticky;top:0;background:var(--bg);z-index:2;}
.sec-block{margin-bottom:8px;}
.sec-block.hide{display:none;}

/* ── 소개 탭 ── */
.info-hero{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;
  padding:18px 16px;text-align:center;}
.info-hero h1{font-size:20px;font-weight:800;color:var(--text);margin-bottom:6px;}
.info-hero p{font-size:12px;color:var(--dim);line-height:1.7;}
.info-hero .badge-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.badge{padding:3px 10px;border-radius:20px;font-size:10px;border:1px solid;font-weight:600;}
.b-green{border-color:var(--green);color:var(--green);}
.b-blue{border-color:var(--blue);color:var(--blue);}
.b-purple{border-color:var(--purple);color:var(--purple);}
.b-yellow{border-color:var(--yellow);color:var(--yellow);}

.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(min-width:500px){.card-grid{grid-template-columns:1fr 1fr 1fr;}}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:12px 10px;}
.card h3{font-size:12px;color:var(--text);margin-bottom:4px;}
.card p{font-size:11px;color:var(--dim);line-height:1.6;}
.card .ci{font-size:20px;margin-bottom:6px;}

.ver-table{width:100%;border-collapse:collapse;font-size:11px;}
.ver-table th{color:var(--dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--bdr);text-align:left;}
.ver-table td{padding:6px 8px;border-bottom:1px solid rgba(26,32,40,.5);color:var(--text);}
.ver-table td:first-child{color:var(--purple);font-family:monospace;font-weight:700;}
.ver-table tr:last-child td{border-bottom:none;}

.lang-grid{display:flex;flex-wrap:wrap;gap:8px;}
.lang-card{flex:1;min-width:130px;background:var(--surf);border:1px solid var(--bdr);
  border-radius:10px;padding:10px 12px;}
.lang-card h4{font-size:12px;color:var(--text);margin-bottom:3px;}
.lang-card p{font-size:10px;color:var(--dim);line-height:1.5;}

.platform-row{display:flex;flex-wrap:wrap;gap:6px;}
.plat{display:flex;align-items:center;gap:5px;background:var(--surf);
  border:1px solid var(--bdr);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--text);}

/* ── 코드 탭 ── */
.code-item{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;
  overflow:hidden;margin-bottom:6px;}
.code-item.hide{display:none;}
.code-title{padding:8px 12px;font-size:11px;font-weight:600;color:var(--text);
  background:var(--surf2);border-bottom:1px solid var(--bdr);display:flex;
  align-items:center;justify-content:space-between;}
.code-title .tag{font-size:9px;color:var(--dim);font-weight:400;}
.code-body{padding:10px 12px;overflow-x:auto;}
pre{margin:0;font-family:'JetBrains Mono','Fira Code',Consolas,monospace;font-size:11px;line-height:1.7;color:#abb2bf;}
/* ── GDScript 하이라이팅 ── */
.c-kw{color:#c678dd;}        /* 키워드 */
.c-dec{color:#e5c07b;}        /* 데코레이터 @export 등 */
.c-type{color:#56b6c2;}       /* 내장 타입 Vector2 등 */
.c-fn{color:#61afef;}         /* 함수 이름 */
.c-str{color:#98c379;}        /* 문자열 */
.c-num{color:#d19a66;}        /* 숫자 */
.c-cmt{color:#5c6370;font-style:italic;} /* 주석 */
.c-const{color:#e06c75;}      /* 상수/true/false/null */
.c-self{color:#e06c75;}       /* self/super */

/* ── 기능 탭 ── */
.feat-item{display:flex;gap:10px;padding:7px 4px;
  border-bottom:1px solid rgba(26,32,40,.5);align-items:flex-start;}
.feat-item:last-child{border-bottom:none;}
.feat-item.hide{display:none;}
.feat-name{font-size:12px;color:var(--blue);font-family:monospace;font-weight:600;
  flex-shrink:0;min-width:140px;}
.feat-desc{font-size:11px;color:var(--dim);line-height:1.6;}
.feat-desc b{color:var(--text);}

/* ── 단축키 탭 ── */
.key-row{display:flex;align-items:center;gap:8px;padding:5px 4px;
  border-bottom:1px solid rgba(26,32,40,.5);}
.key-row:last-child{border-bottom:none;}
.key-row.hide{display:none;}
.keys{display:flex;align-items:center;gap:3px;flex-shrink:0;min-width:160px;flex-wrap:wrap;}
kbd{display:inline-flex;align-items:center;justify-content:center;
  padding:2px 6px;min-width:22px;background:var(--surf2);
  border:1px solid #2a3545;border-bottom:2px solid #1a2028;
  border-radius:5px;font-family:monospace;font-size:10px;color:var(--text);
  font-weight:600;white-space:nowrap;}
kbd.sp{color:var(--blue);}
kbd.fn{color:var(--green);}
.plus{color:var(--dim);font-size:10px;margin:0 1px;}
.kdesc{font-size:12px;color:var(--text);flex:1;}

#empty{display:none;text-align:center;padding:40px;color:var(--dim);}
#empty.show{display:block;}
</style>
</head>
<body>
<div id="app">

<div id="tab-bar">
  <div class="tab on"  onclick="sw('intro')">📖 소개</div>
  <div class="tab"     onclick="sw('code')">💻 GDScript</div>
  <div class="tab"     onclick="sw('feat')">⚙️ 기능</div>
  <div class="tab"     onclick="sw('keys')">⌨️ 단축키</div>
</div>

<div id="sub-bar">
  <div id="search-row">
    <div id="sw">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="sq" type="search" placeholder="검색..." oninput="onSrch()">
    </div>
    <span id="cnt"></span>
  </div>
  <div id="cat-bar"></div>
</div>

<div id="content">
  <!-- ══ 소개 ══ -->
  <div id="panel-intro" class="panel on"></div>
  <!-- ══ GDScript ══ -->
  <div id="panel-code" class="panel"></div>
  <!-- ══ 기능 ══ -->
  <div id="panel-feat" class="panel"></div>
  <!-- ══ 단축키 ══ -->
  <div id="panel-keys" class="panel"></div>
</div>
<div id="empty"></div>

</div>
<script>
// ══════════════════════════════════════════
//  GDScript 신택스 하이라이터
// ══════════════════════════════════════════
const KW = new Set(['var','const','func','class','class_name','extends','signal',
  'if','elif','else','for','while','match','return','pass','break','continue',
  'and','or','not','in','is','as','static','enum','void','await']);
const CONSTS = new Set(['true','false','null','PI','TAU','INF','NAN','FAILED','OK']);
const SELF_KW = new Set(['self','super']);
const TYPES = new Set(['int','float','bool','String','StringName','NodePath',
  'Array','Dictionary','PackedStringArray','PackedFloat32Array','PackedInt32Array',
  'Vector2','Vector2i','Vector3','Vector3i','Vector4','Color','Rect2','Rect2i',
  'Transform2D','Transform3D','Basis','Quaternion','Plane','AABB','RID','Callable','Signal',
  'Object','RefCounted','Resource','Node','Node2D','Node3D','CanvasItem',
  'CharacterBody2D','CharacterBody3D','RigidBody2D','RigidBody3D',
  'StaticBody2D','StaticBody3D','Area2D','Area3D','Sprite2D','AnimatedSprite2D',
  'AnimationPlayer','AnimationTree','Tween','Timer','Label','Button','LineEdit',
  'TextEdit','RichTextLabel','Control','Container','VBoxContainer','HBoxContainer',
  'GridContainer','MarginContainer','PanelContainer','ScrollContainer',
  'TabContainer','SubViewport','CanvasLayer','AudioStreamPlayer','AudioStreamPlayer2D',
  'AudioStreamPlayer3D','TileMap','TileSet','Camera2D','Camera3D',
  'CollisionShape2D','CollisionShape3D','MeshInstance3D','DirectionalLight3D',
  'OmniLight3D','SpotLight3D','GPUParticles2D','CPUParticles2D','Line2D','Polygon2D',
  'Path2D','PathFollow2D','NavigationAgent2D','NavigationAgent3D','Input','InputEvent',
  'InputEventKey','InputEventMouseButton','InputEventMouseMotion','OS','Engine',
  'ProjectSettings','ResourceLoader','SceneTree','Viewport','World2D','World3D',
  'PhysicsDirectBodyState2D','KinematicCollision2D']);

function hlGD(src) {
  let i = 0, out = '';
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  while (i < src.length) {
    // 주석
    if (src[i] === '#') {
      let j = i; while (j < src.length && src[j] !== '\n') j++;
      out += `<span class="c-cmt">${esc(src.slice(i,j))}</span>`;
      i = j; continue;
    }
    // 문자열
    if (src[i] === '"' || src[i] === "'") {
      const q = src[i]; let j = i+1;
      while (j < src.length && src[j] !== q) { if (src[j]==='\\') j++; j++; }
      j++;
      out += `<span class="c-str">${esc(src.slice(i,j))}</span>`;
      i = j; continue;
    }
    // 숫자
    if (/\d/.test(src[i]) || (src[i]==='.' && /\d/.test(src[i+1]||''))) {
      let j = i;
      while (j < src.length && /[\d._xXa-fA-F]/.test(src[j])) j++;
      out += `<span class="c-num">${esc(src.slice(i,j))}</span>`;
      i = j; continue;
    }
    // 식별자 / 키워드
    if (/[@a-zA-Z_]/.test(src[i])) {
      let j = i;
      if (src[i]==='@') j++;
      while (j < src.length && /\w/.test(src[j])) j++;
      const w = src.slice(i,j);
      let cls = '';
      if (w.startsWith('@')) cls='c-dec';
      else if (SELF_KW.has(w)) cls='c-self';
      else if (CONSTS.has(w)) cls='c-const';
      else if (KW.has(w)) cls='c-kw';
      else if (TYPES.has(w)) cls='c-type';
      else if (j < src.length && src[j]==='(') cls='c-fn';
      out += cls ? `<span class="${cls}">${esc(w)}</span>` : esc(w);
      i = j; continue;
    }
    out += esc(src[i]); i++;
  }
  return out;
}

// ══════════════════════════════════════════
//  데이터 — GDScript 코드
// ══════════════════════════════════════════
const CODE = [
  { cat:'변수와 타입', items:[
    { title:'변수 선언', code:

    { title:'@onready — 씬 로드 후 자동 할당', code:
`@onready var sprite: Sprite2D = $Sprite2D
@onready var timer: Timer = $Timer
@onready var label: Label = $UI/Label
@onready var anim: AnimationPlayer = $AnimationPlayer

# _ready()보다 먼저 실행되어 노드 참조 준비`},
    { title:'내장 타입', code:
`var v2 = Vector2(100, 200)
var v3 = Vector3(1, 2, 3)
var col = Color(1, 0, 0, 1)        # RGBA (0~1)
var col2 = Color.RED
var col3 = Color.from_string("#ff0000", Color.WHITE)
var rect = Rect2(Vector2(0,0), Vector2(100,50))
var arr: Array[int] = [1, 2, 3]
var dict: Dictionary = {"hp": 100, "mp": 50}`},
  ]},
  { cat:'함수', items:[
    { title:'기본 함수', code:
`func greet(name: String) -> String:
    return "안녕, " + name + "!"

func add(a: int, b: int) -> int:
    return a + b

# 기본값 매개변수

    { title:'내장 함수 오버라이드', code:
`func _ready():
    # 씬 트리에 추가된 직후 1회 호출
    print("준비 완료")

func _process(delta: float):

    if event.is_action_pressed("ui_accept"):

func _unhandled_input(event: InputEvent):

func _notification(what: int):
    if what == NOTIFICATION_WM_CLOSE_REQUEST:
        save_and_quit()`},
    { title:'람다 함수', code:
`# 람다 (익명 함수)
var double = func(x): return x * 2
print(double.call(5))  # 10

# 배열 메서드에서 활용
var nums = [1, 2, 3, 4, 5]
var evens = nums.filter(func(x): return x % 2 == 0)
var doubled = nums.map(func(x): return x * 2)
nums.sort_custom(func(a, b): return a > b)

# 시그널 연결에서 활용
button.pressed.connect(func(): print("클릭!"))`},
    { title:'정적 함수', code:
`class_name MathHelper

static func lerp_angle(from: float, to: float, t: float) -> float:
    var diff = fmod(to - from, TAU)
    return from + fmod(2.0 * diff, TAU) - diff * t

static func random_color() -> Color:
    return Color(randf(), randf(), randf(), 1.0)`},
  ]},
  { cat:'제어문', items:[
    { title:'if / elif / else', code:
`if health <= 0:
    die()
elif health < 30:
    play_hurt_animation()
elif health < 70:
    set_status("부상")
else:
    set_status("정상")

# 인라인 if
var msg = "생존" if health > 0 else "사망"

# 타입 확인
if node is CharacterBody2D:
    node.jump()`},
    { title:'for 루프', code:
`# range
for i in range(5):          # 0 1 2 3 4
    print(i)
for i in range(2, 8, 2):    # 2 4 6
    print(i)

# 배열 순회
for item in inventory:
    use(item)

# 딕셔너리 순회
for key in stats:
    print(key, ":", stats[key])

    { title:'while / match', code:
`# while
while not is_on_floor():
    apply_gravity()

# match (switch와 유사, 패턴 매칭)
match state:
    State.IDLE:
        play("idle")

    State.JUMP, State.FALL:   # 여러 값

  ]},
  { cat:'클래스와 상속', items:[
    { title:'클래스 기본', code:
`# 파일 이름이 곧 클래스 이름 (권장)
extends CharacterBody2D
class_name Player

# 멤버 변수
var health: int = 100
var speed: float = 200.0

# 내부 클래스
class Inventory:
    var items: Array[String] = []
    var gold: int = 0

    func add_item(item: String) -> void:

    { title:'상속과 super', code:
`# 기반 클래스
class_name Entity
extends Node2D

var health: int = 100

func take_damage(amount: int) -> void:
    health = max(0, health - amount)

func die() -> void:
    queue_free()

# ──────────────────────────────────
# 파생 클래스
class_name Player
extends Entity

var mana: int = 50

func take_damage(amount: int) -> void:
    super.take_damage(amount)   # 부모 함수 호출

    { title:'열거형 (Enum)', code:
`# 전역 enum
enum State { IDLE, RUN, JUMP, FALL, DEAD }

  ]},
  { cat:'시그널', items:[
    { title:'시그널 선언과 발생', code:
`extends Node
class_name Player

# 시그널 선언 (매개변수 타입 지정 가능)
signal health_changed(new_health: int, max_health: int)
signal player_died
signal item_picked_up(item_name: String, item_id: int)

var health: int = 100
const MAX_HP = 100

func take_damage(amount: int) -> void:
    health = max(0, health - amount)
    health_changed.emit(health, MAX_HP)  # 시그널 발생

    if health <= 0:
        player_died.emit()`},
    { title:'시그널 연결 (코드)', code:
`func _ready() -> void:
    # 메서드로 연결
    health_changed.connect(_on_health_changed)
    player_died.connect(_on_player_died)

    # 람다로 연결
    player_died.connect(func():
        $GameOverLabel.visible = true

let curTab='intro', curCat='all', srchQ='';

function sw(tab){
  curTab=tab; curCat='all'; srchQ='';
  document.getElementById('sq').value='';
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',['intro','code','feat','keys'][i]===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('panel-'+tab).classList.add('on');
  const hasSearch=tab!=='intro';
  document.getElementById('sub-bar').style.display=hasSearch?'':'none';
  if(tab==='intro') renderIntro();
  else if(tab==='code') renderCode();
  else if(tab==='feat') renderFeat();
  else renderKeys();
}

// ── 코드 패널 ──────────────────────────────
function renderCode(){
  const cats=['전체',...CODE.map(s=>s.cat)];
  document.getElementById('cat-bar').innerHTML=cats.map((c,i)=>
    `<button class="cbt${i===0?' on':''}" onclick="filterCat('${c.replace(/'/g,"\\'")}',this)">${c}</button>`
  ).join('');

  document.getElementById('panel-code').innerHTML=CODE.map(sec=>`
    <div class="sec-block" data-cat="${sec.cat}">
      <div class="sec-hd">${sec.cat}</div>
      ${sec.items.map(item=>`
        <div class="code-item" data-search="${item.title.toLowerCase()} ${item.code.toLowerCase()}">
          <div class="code-title">${item.title}</div>
          <div class="code-body"><pre>${hlGD(item.code)}</pre></div>
        </div>`).join('')}
    </div>`).join('');

  const total=CODE.reduce((s,c)=>s+c.items.length,0);
  document.getElementById('cnt').textContent=total+'개';
}

// ── 기능 패널 ──────────────────────────────
function renderFeat(){
  const cats=['전체',...FEAT.map(s=>s.cat)];
  document.getElementById('cat-bar').innerHTML=cats.map((c,i)=>
    `<button class="cbt${i===0?' on':''}" onclick="filterCat('${c.replace(/'/g,"\\'")}',this)">${c}</button>`
  ).join('');

  document.getElementById('panel-feat').innerHTML=FEAT.map(sec=>`

}

// ── 단축키 패널 ──────────────────────────────
function kbdHtml(k){
  const sp=/^(Ctrl|Shift|Alt|F\d+|Delete|Esc|Enter|Tab|Home|End|PgUp|PgDn|Insert|Backspace|Space|우클릭)/.test(k);
  const fn=/^F\d+$/.test(k);
  return `<kbd class="${fn?'fn':sp?'sp':''}">${k}</kbd>`;
}

function renderKeys(){
  const cats=['전체',...KEYS.map(s=>s.cat)];
  document.getElementById('cat-bar').innerHTML=cats.map((c,i)=>
    `<button class="cbt${i===0?' on':''}" onclick="filterCat('${c.replace(/'/g,"\\'")}',this)">${c}</button>`
  ).join('');

  document.getElementById('panel-keys').innerHTML=KEYS.map(sec=>`
    <div class="sec-block" data-cat="${sec.cat}">
      <div class="sec-hd">${sec.cat}</div>
      ${sec.list.map(item=>`
        <div class="key-row" data-search="${item.k.join(' ').toLowerCase()} ${item.d.toLowerCase()}">
          <div class="keys">${item.k.map(kbdHtml).join('<span class="plus">+</span>')}</div>
          <span class="kdesc">${item.d}</span>
        </div>`).join('')}
    </div>`).join('');

  const total=KEYS.reduce((s,c)=>s+c.list.length,0);
  document.getElementById('cnt').textContent=total+'개';
}

// ── 필터 ──────────────────────────────────
function filterCat(cat,btn){
  curCat=cat;
  document.querySelectorAll('.cbt').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  applyFilter();
}

function onSrch(){
  srchQ=document.getElementById('sq').value.trim().toLowerCase();
  applyFilter();
}

function applyFilter(){
  const panel=document.getElementById('panel-'+curTab);
  let vis=0;
  panel.querySelectorAll('.sec-block').forEach(sec=>{
    const cm=curCat==='전체'||curCat===sec.dataset.cat;
    if(!cm){sec.classList.add('hide');return;}
    sec.classList.remove('hide');
    let sv=0;
    sec.querySelectorAll('.code-item,.feat-item,.key-row').forEach(row=>{
      const m=!srchQ||row.dataset.search.includes(srchQ);
      row.classList.toggle('hide',!m);
      if(m) sv++;
    });
    if(srchQ&&sv===0) sec.classList.add('hide');
    else vis+=sv;
  });
  document.getElementById('cnt').textContent=vis+'개';
  document.getElementById('empty').textContent=vis===0?'검색 결과가 없습니다.':'';
  document.getElementById('empty').className=vis===0?'show':'';
}

// ── 초기화 ────────────────────────────────
renderIntro();
document.getElementById('sub-bar').style.display='none';
