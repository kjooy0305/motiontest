<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>버튼</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e74c3c;
      transition: background 0.15s;
    }
    body.green { background: #2ecc71; }

    button {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    }
    button:active {
      background: rgba(255,255,255,0.4);
      transform: scale(0.95);
    }
  </style>
</head>
<body id="body">
  <button id="btn">누르기</button>

  <script>
    const body = document.getElementById('body');
    const btn  = document.getElementById('btn');

    const on  = () => body.classList.add('green');
    const off = () => body.classList.remove('green');

    btn.addEventListener('mousedown',   on);
    btn.addEventListener('mouseup',     off);
    btn.addEventListener('mouseleave',  off);
    btn.addEventListener('touchstart',  e => { e.preventDefault(); on();  }, { passive: false });
    btn.addEventListener('touchend',    e => { e.preventDefault(); off(); }, { passive: false });
    btn.addEventListener('touchcancel', e => { e.preventDefault(); off(); }, { passive: false });
  </script>
</body>
</html>
