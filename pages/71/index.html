<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API & 무료 에셋 완전 가이드</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#060a12;--bg2:#0a1020;--bg3:#0e1828;--bg4:#152035;
  --border:#1a2840;--border2:#305090;
  --txt:#e0f0ff;--txt2:#7098c8;--txt3:#304870;
  --cya:#00c8f0;--cya2:#40d8ff;--cyabg:rgba(0,200,240,.1);--cyabr:rgba(0,200,240,.28);
  --pur:#7c5cff;--purbg:rgba(124,92,255,.1);--purbr:rgba(124,92,255,.3);
  --grn:#22dd88;--grnbg:rgba(34,221,136,.1);--grnbr:rgba(34,221,136,.28);
  --yel:#e8b820;--yelbg:rgba(232,184,32,.1);--yelbr:rgba(232,184,32,.28);
  --ora:#f08020;--orabg:rgba(240,128,32,.1);--orabr:rgba(240,128,32,.28);
  --red:#e05060;--redbg:rgba(224,80,96,.1);--redbr:rgba(224,80,96,.28);
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  font-size:14px;line-height:1.6;min-height:100vh;}

/* HEADER */
#hdr{background:linear-gradient(135deg,#040810 0%,#0a0e1e 40%,#060e18 100%);
  border-bottom:2px solid var(--cya);padding:12px 20px;
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
#hdr-ic{font-size:26px;filter:drop-shadow(0 0 12px var(--cya));}
#hdr h1{font-size:18px;font-weight:800;
  background:linear-gradient(90deg,var(--cya2),var(--pur));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#hdr-sub{font-size:11px;color:var(--txt3);margin-top:1px;}
#hdr-badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.hdr-b{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;}
.hb-free{background:var(--grnbg);border:1px solid var(--grnbr);color:var(--grn);}
.hb-fm{background:var(--yelbg);border:1px solid var(--yelbr);color:var(--yel);}
.hb-cr{background:var(--orabg);border:1px solid var(--orabr);color:var(--ora);}
.hb-pd{background:var(--redbg);border:1px solid var(--redbr);color:var(--red);}

/* TAB NAV */
#tnav{background:var(--bg2);border-bottom:1px solid var(--border);
  padding:8px 14px;display:flex;gap:5px;flex-wrap:nowrap;
  overflow-x:auto;scrollbar-width:none;
  position:sticky;top:54px;z-index:100;}
#tnav::-webkit-scrollbar{display:none;}
.tbtn{display:flex;flex-direction:column;align-items:center;
  padding:7px 12px;border-radius:8px;border:1px solid transparent;
  cursor:pointer;background:none;color:var(--txt2);
  font-size:10px;font-weight:600;transition:.13s;
  white-space:nowrap;font-family:inherit;gap:2px;min-width:52px;}
.tbtn:hover{background:var(--bg3);color:var(--txt);}
.tbtn.on{background:var(--cyabg);border-color:var(--cyabr);color:var(--cya2);}
.tbtn .ti{font-size:17px;}

/* MAIN */
#main{padding:18px;max-width:1200px;margin:0 auto;}

/* SECTION */
.sec{background:var(--bg2);border:1px solid var(--border);
  border-radius:9px;margin-bottom:14px;overflow:hidden;}
.sec-hdr{padding:12px 16px;display:flex;align-items:center;gap:8px;
  cursor:pointer;user-select:none;transition:.13s;}
.sec-hdr:hover{background:var(--bg3);}
.sec-hdr.op{border-bottom:1px solid var(--border);}
.sec-hdr h3{font-size:13px;font-weight:700;color:var(--txt);}
.sec-cnt{font-size:11px;color:var(--txt3);margin-left:4px;}
.sec-arr{margin-left:auto;color:var(--txt3);transition:.2s;font-size:12px;}
.sec-hdr.op .sec-arr{transform:rotate(180deg);}
.sec-body{padding:14px;display:none;}
.sec-body.op{display:block;}

/* CARDS GRID */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:13px;display:flex;flex-direction:column;gap:6px;
  transition:.13s;position:relative;}
.card:hover{border-color:var(--border2);background:var(--bg4);}
.card-top{display:flex;align-items:flex-start;gap:8px;}
.card-name{font-size:13px;font-weight:800;color:var(--txt);line-height:1.3;flex:1;}
.card-tier{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;
  white-space:nowrap;flex-shrink:0;margin-top:2px;}
.t-free{background:var(--grnbg);border:1px solid var(--grnbr);color:var(--grn);}
.t-freemium{background:var(--yelbg);border:1px solid var(--yelbr);color:var(--yel);}
.t-credit{background:var(--orabg);border:1px solid var(--orabr);color:var(--ora);}
.t-paid{background:var(--redbg);border:1px solid var(--redbr);color:var(--red);}
.card-desc{font-size:11px;color:var(--txt2);line-height:1.55;flex:1;}
.card-free{font-size:10px;color:var(--txt3);padding:4px 7px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:5px;line-height:1.4;}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;}
.card-tag{font-size:9px;padding:1px 6px;border-radius:5px;
  background:var(--cyabg);border:1px solid var(--cyabr);color:var(--cya2);}
.card-url{font-size:10px;color:var(--cya2);text-decoration:none;
  padding:4px 8px;border-radius:5px;
  background:rgba(0,200,240,.07);border:1px solid var(--cyabr);
  display:inline-flex;align-items:center;gap:4px;
  margin-top:auto;transition:.13s;word-break:break-all;}
.card-url:hover{background:var(--cyabg);}

/* NOTE */
.note{font-size:12px;color:var(--txt2);padding:9px 13px;border-radius:7px;
  background:var(--bg3);border-left:3px solid var(--cya);margin-bottom:14px;line-height:1.6;}

/* HERO */
.hero{background:linear-gradient(135deg,var(--bg2),var(--bg3));
  border:1px solid var(--cyabr);border-radius:10px;padding:18px;margin-bottom:14px;
  position:relative;overflow:hidden;}
.hero::after{content:'🔌';position:absolute;right:-10px;top:-10px;
  font-size:90px;opacity:.05;pointer-events:none;}
.hero h2{font-size:18px;font-weight:800;
  background:linear-gradient(90deg,var(--cya2),var(--pur));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;}
.hero p{font-size:12px;color:var(--txt2);line-height:1.7;}

/* TIER LEGEND */
.tier-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.tl-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt2);}
.tl-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

@media(max-width:600px){
  .card-grid{grid-template-columns:1fr;}
  #hdr h1{font-size:15px;}
  #hdr-badges{display:none;}
}
</style>
</head>
<body>

<header id="hdr">
  <span id="hdr-ic">🔌</span>
  <div>
    <h1>API & 무료 에셋 완전 가이드</h1>
    <div id="hdr-sub">디자인 · 아이콘 · 게임 에셋 · AI · 지도 · 날씨 · 결제 · 인증 · DB — 180+ 리소스 총정리</div>
  </div>
  <div id="hdr-badges">
    <span class="hdr-b hb-free">🟢 완전무료</span>
    <span class="hdr-b hb-fm">🟡 무료티어</span>
    <span class="hdr-b hb-cr">🟠 무료크레딧</span>
    <span class="hdr-b hb-pd">🔴 과금제</span>
  </div>
</header>

<nav id="tnav"></nav>
<main id="main"></main>

<script>
/* ─ 티어 뱃지 ─ */
const TIER_LABEL = {free:'🟢 완전무료',freemium:'🟡 무료티어',credit:'🟠 무료크레딧',paid:'🔴 과금제'};
const TIER_CLS   = {free:'t-free',freemium:'t-freemium',credit:'t-credit',paid:'t-paid'};

function card(it) {
  const tags = (it.tags||[]).map(t=>`<span class="card-tag">${t}</span>`).join('');
  return `<div class="card">
    <div class="card-top">
      <span class="card-name">${it.name}</span>
      <span class="card-tier ${TIER_CLS[it.tier]||'t-freemium'}">${TIER_LABEL[it.tier]||it.tier}</span>
    </div>
    <div class="card-desc">${it.desc}</div>
    <div class="card-free">💡 ${it.free}</div>
    ${tags?`<div class="card-tags">${tags}</div>`:''}
    <a class="card-url" href="${it.url}" target="_blank" rel="noopener">🔗 ${it.url.replace(/^https?:\/\//,'')}</a>
  </div>`;
}
function cards(list) {
  return `<div class="card-grid">${list.map(card).join('')}</div>`;
}
function sec(title, count, body, open=true) {
  return `<div class="sec">
    <div class="sec-hdr${open?' op':''}" onclick="toggleSec(this)">
      <h3>${title}</h3><span class="sec-cnt">${count}개</span>
      <span class="sec-arr">▼</span>
    </div>
    <div class="sec-body${open?' op':''}">${body}</div>
  </div>`;
}
function toggleSec(h){h.classList.toggle('op');h.nextElementSibling.classList.toggle('op');}

/* ─ 탭 ─ */
const TABS=[
  {id:'game',    name:'게임 에셋', icon:'🎮'},
  {id:'design',  name:'디자인 에셋',icon:'🎨'},
  {id:'media',   name:'이미지·미디어',icon:'📸'},
  {id:'ai',      name:'AI API',   icon:'🤖'},
  {id:'data',    name:'공개 데이터',icon:'📡'},
  {id:'social',  name:'소셜·알림', icon:'💬'},
  {id:'infra',   name:'인프라·유틸',icon:'🔧'},
];
let curTab='game';

function renderNav(){
  document.getElementById('tnav').innerHTML=TABS.map(t=>
    `<button class="tbtn${curTab===t.id?' on':''}" onclick="sel('${t.id}')">
      <span class="ti">${t.icon}</span><span>${t.name}</span>
    </button>`
  ).join('');
}
function sel(id){
  curTab=id;renderNav();
  ({game:renderGame,design:renderDesign,media:renderMedia,ai:renderAI,
    data:renderData,social:renderSocial,infra:renderInfra})[id]();
  window.scrollTo(0,0);
}
