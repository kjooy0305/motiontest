<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테스트 59 — 将棋 AI 쇼기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#13131f;color:#e0d5c5;font-family:'Segoe UI',Meiryo,sans-serif}

/* ── screens ── */
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* ── MENU ── */
#s-menu{align-items:center;justify-content:center;padding:40px 20px;background:radial-gradient(ellipse at 50% 30%,#1e1e3a,#0d0d18)}
.logo{text-align:center;margin-bottom:48px}
.logo h1{font-size:clamp(2.4rem,8vw,5rem);font-weight:800;letter-spacing:.12em;color:#f0e0b0;text-shadow:0 0 40px #b8860b80}
.logo .logo-jp{font-size:clamp(1rem,3vw,1.5rem);color:#c8a05a;letter-spacing:.3em;margin-top:6px}
.logo p{color:#8a7a5a;margin-top:12px;font-size:.95rem}
.menu-list{display:flex;flex-direction:column;gap:14px;width:100%;max-width:400px}
.mbtn{padding:16px 24px;border:2px solid #4a3d22;border-radius:12px;background:#1c1a2e;color:#e0d5c5;font-size:1.1rem;cursor:pointer;text-align:left;transition:all .2s;display:flex;align-items:center;gap:12px}
.mbtn:hover{background:#2a2548;border-color:#c8a05a;transform:translateX(4px)}
.mbtn .icon{font-size:1.5rem;width:36px;text-align:center}
.mbtn .info{display:flex;flex-direction:column}
.mbtn .info small{color:#8a7a5a;font-size:.8rem;margin-top:2px}

/* ── DIFFICULTY ── */
#s-diff{align-items:center;justify-content:center;padding:40px 20px}
#s-diff h2{font-size:1.8rem;margin-bottom:32px;color:#f0e0b0;text-align:center}
.diff-grid{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px}
.dbtn{padding:14px 20px;border:2px solid #3a3050;border-radius:10px;background:#1c1a2e;color:#e0d5c5;font-size:1rem;cursor:pointer;display:flex;align-items:center;gap:16px;transition:all .2s}
.dbtn:hover{background:#2a2548;border-color:#c8a05a}
.dbtn.best{border-color:#c8403080}
.dbtn.best:hover{border-color:#c84030;background:#2a1518}
.dbtn .dlv{font-size:1.4rem;font-weight:700;width:42px;text-align:center;color:#f0e0b0}
.dbtn .dinfo{display:flex;flex-direction:column;text-align:left}
.dbtn .dinfo small{color:#7a6a4a;font-size:.8rem}
.back-btn{margin-top:24px;padding:10px 24px;border:1px solid #4a3d22;border-radius:8px;background:transparent;color:#9a8a6a;cursor:pointer;font-size:.95rem;transition:all .2s}
.back-btn:hover{background:#2a2538;color:#e0d5c5}

/* ── TUTORIAL ── */
#s-tutorial{padding:0}
.tutorial-wrap{max-width:800px;margin:0 auto;padding:24px 20px;width:100%}
.tut-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #2a2538}
.tut-nav button{padding:8px 18px;border:1px solid #4a3d22;border-radius:8px;background:#1c1a2e;color:#c8a05a;cursor:pointer;font-size:.9rem;transition:all .2s}
.tut-nav button:hover{background:#2a2548;border-color:#c8a05a}
#tut-progress{color:#8a7a5a;font-size:.9rem}
#tut-content h2{font-size:1.5rem;color:#f0e0b0;margin-bottom:16px}
.tut-body{line-height:1.8;color:#c0b090}
.tut-body p{margin-bottom:12px}
.tut-body ul{margin:12px 0 12px 24px}
.tut-body li{margin-bottom:6px}
.tut-body strong{color:#f0e0b0}

/* ── MINI BOARD (tutorial diagrams) ── */
.mini-board{display:inline-grid;grid-template-columns:repeat(5,52px);gap:2px;background:#5a3d18;padding:4px;border-radius:6px;margin:20px 0}
.mini-row{display:contents}
.mini-cell{width:52px;height:52px;background:#c8a870;display:flex;align-items:center;justify-content:center;border-radius:2px;position:relative}
.mini-cell.mini-piece{background:#d4b880}
.mini-cell.mini-target{background:#6a9a5080}
.mini-dot{width:18px;height:18px;border-radius:50%;background:#4a8a40;opacity:.85}
.mini-img{width:44px;height:44px;object-fit:contain}

/* ── QUIZ ── */
#s-quiz{padding:0;align-items:stretch}
.quiz-wrap{max-width:900px;margin:0 auto;padding:20px;width:100%;display:flex;flex-direction:column;gap:16px}
#quiz-header h2{font-size:1.3rem;color:#f0e0b0}
#quiz-header p{color:#9a8a6a;margin-top:6px;font-size:.95rem}
#quiz-board-area{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
#quiz-status{min-height:50px;font-size:.95rem;padding:10px 14px;background:#1c1a2e;border-radius:8px;border-left:3px solid #4a3d22}
.correct{color:#6ab870;font-weight:600}
.wrong{color:#c86060;font-weight:600}
.hint{color:#9a8a5a;font-style:italic}
.explain{color:#b0a080;margin-top:8px;line-height:1.7}
#quiz-controls{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
#quiz-controls button{padding:8px 16px;border:1px solid #4a3d22;border-radius:8px;background:#1c1a2e;color:#c8a05a;cursor:pointer;font-size:.9rem;transition:all .2s}
#quiz-controls button:disabled{opacity:.4;cursor:not-allowed}
#quiz-controls button:not(:disabled):hover{background:#2a2548;border-color:#c8a05a}
#quiz-counter{color:#8a7a5a;font-size:.9rem}

/* ── GAME SCREEN ── */
#s-game{flex-direction:row;align-items:stretch}
.game-layout{display:flex;width:100%;min-height:100vh}
.game-left{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:12px;gap:8px;background:#161620}
.game-right{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:200px;max-width:300px;background:#0f0f1a}

/* ── BOARD ── */
.board{display:flex;flex-direction:column;gap:0;border:3px solid #5a3d18;border-radius:4px;overflow:hidden;background:#5a3d18}
.board-col-header{display:flex}
.lbl-corner{width:28px;height:20px;background:#3a2810}
.col-lbl{width:56px;height:20px;background:#3a2810;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#8a6a3a}
.board-row{display:flex}
.row-lbl{width:28px;height:56px;background:#3a2810;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#8a6a3a}
.cell{width:56px;height:56px;background:#c8a870;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;border:1px solid #8a6a3a40;transition:background .15s}
.cell:hover{background:#d4b880}
.cell.sel{background:#4488ff50;border-color:#4488ff}
.cell.lastmove{background:#ffdd4440}
.cell.incheck{background:#ff444450;animation:pulse .7s ease infinite alternate}
@keyframes pulse{to{background:#ff444480}}
.target-dot{width:22px;height:22px;border-radius:50%;background:#3a8a3080;pointer-events:none;position:absolute}
.target-cap{position:absolute;inset:0;border:3px solid #3a8a30a0;border-radius:3px;pointer-events:none}
.piece-img{width:48px;height:48px;object-fit:contain;pointer-events:none;position:relative;z-index:1}

/* ── HANDS ── */
.hand-area{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;background:#1c1a2c;border-radius:8px;min-width:200px;min-height:56px;border:1px solid #2a2538}
.hand-label{width:100%;font-size:.75rem;color:#7a6a4a;margin-bottom:2px}
.hand-piece{position:relative;width:52px;height:52px;background:#c8a870;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid transparent;transition:all .2s}
.hand-piece:hover{border-color:#c8a05a}
.hand-piece.hand-sel{border-color:#4488ff;background:#d4b880}
.hand-cnt{position:absolute;bottom:1px;right:3px;font-size:.7rem;color:#2a1a08;font-weight:700;background:#f0e0a0;border-radius:3px;padding:0 3px;line-height:1.3}
.empty-hand{color:#5a4a3a;font-size:.8rem;font-style:italic}

/* ── AI/PLAYER INFO ── */
.ai-info,.player-info{width:100%;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#1c1a2c;border-radius:6px;font-size:.85rem}
.ai-info{color:#b0a0c0}
.player-info{color:#a0c0b0}
#ai-diff-label{color:#7a6a9a;font-size:.75rem}

/* ── STATUS + HISTORY ── */
#game-status{padding:12px;background:#1c1a2c;border-radius:8px;font-size:1rem;color:#f0e0b0;min-height:50px;border-left:3px solid #4a3d22}
#move-history{flex:1;overflow-y:auto;padding:10px;background:#13131f;border-radius:8px;max-height:300px;font-size:.78rem}
.hist-entry{padding:3px 6px;border-radius:4px;margin-bottom:2px}
.hist-entry.black{color:#b0d0c0}
.hist-entry.white{color:#c0b0d0;text-align:right}
.game-btns{display:flex;flex-direction:column;gap:8px}
.game-btns button{padding:9px 14px;border:1px solid #3a3050;border-radius:8px;background:#1c1a2e;color:#c0b090;cursor:pointer;font-size:.88rem;transition:all .2s}
.game-btns button:hover{background:#2a2548;border-color:#c8a05a;color:#f0e0b0}

/* ── DIALOGS ── */
.dialog{position:fixed;inset:0;background:#00000090;display:flex;align-items:center;justify-content:center;z-index:100}
.dialog.hidden{display:none}
.dialog-box{background:#1e1c30;border:2px solid #4a3d22;border-radius:16px;padding:28px 36px;text-align:center;max-width:320px}
.dialog-box p{font-size:1.1rem;color:#f0e0b0;margin-bottom:20px;line-height:1.6}
.dialog-box button{margin:6px;padding:10px 22px;border:1px solid #4a3d22;border-radius:8px;background:#2a2548;color:#e0d5c5;cursor:pointer;font-size:.95rem;transition:all .2s}
.dialog-box button:hover{background:#3a3558;border-color:#c8a05a}

/* ── THINKING OVERLAY ── */
#think-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#00000040;border-radius:4px;font-size:1rem;color:#f0e0b0;pointer-events:none;opacity:0;transition:opacity .2s;z-index:10}
#think-overlay.visible{opacity:1}

/* ── BOARD WRAPPER (for overlay) ── */
.board-wrap{position:relative;display:inline-flex;flex-direction:column}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .game-right{max-width:none;flex:1}
  .game-layout{flex-direction:column}
  .col-lbl,.row-lbl{font-size:.6rem}
  .col-lbl{width:40px;height:18px}.row-lbl{width:20px;height:40px}
  .cell{width:40px;height:40px}.lbl-corner{width:20px;height:18px}
  .piece-img{width:34px;height:34px}
  .hand-piece{width:40px;height:40px}
  .hand-piece .piece-img{width:32px;height:32px}
}
</style>

<script>
'use strict';

// ══════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════
const PIECE_JP = {king:'玉',rook:'飛',bishop:'角',gold:'金',silver:'銀',knight:'桂',lance:'香',pawn:'歩'};
const PIECE_KR = {king:'왕장',rook:'비차',bishop:'각',gold:'금장',silver:'은장',knight:'계마',lance:'향차',pawn:'보병'};
const PIECE_VAL = {king:100000,rook:1000,bishop:800,gold:600,silver:500,knight:400,lance:350,pawn:100};
const PIECE_TYPES = ['pawn','lance','knight','silver','gold','bishop','rook'];

// ══════════════════════════════════════
//  BOARD ENGINE (pure functions)
// ══════════════════════════════════════

function boardClone(b){return b.map(r=>r.map(c=>c?{...c}:null))}
function handsClone(h){return{black:{...h.black},white:{...h.white}}}

function createInitialBoard(){
  const b=Array.from({length:9},()=>Array(9).fill(null));
  const W=t=>({type:t,side:'white',promoted:false});
  const B=t=>({type:t,side:'black',promoted:false});
  b[0]=[W('lance'),W('knight'),W('silver'),W('gold'),W('king'),W('gold'),W('silver'),W('knight'),W('lance')];
  b[1][1]=W('rook'); b[1][7]=W('bishop');
  for(let c=0;c<9;c++) b[2][c]=W('pawn');
  for(let c=0;c<9;c++) b[6][c]=B('pawn');
  b[7][1]=B('bishop'); b[7][7]=B('rook');
  b[8]=[B('lance'),B('knight'),B('silver'),B('gold'),B('king'),B('gold'),B('silver'),B('knight'),B('lance')];
  return b;
}

function getPseudoMoves(board,r,c){
  const p=board[r][c]; if(!p) return [];
  const {type,side,promoted}=p;
  const dir=side==='black'?-1:1;
  const moves=[];
  const ok=(nr,nc)=>nr>=0&&nr<9&&nc>=0&&nc<9;
  const add=(nr,nc)=>{
    if(!ok(nr,nc)) return false;
    if(board[nr][nc]?.side===side) return false;
    moves.push([nr,nc]);
    return !board[nr][nc];
  };
  const slide=(dr,dc)=>{let nr=r+dr,nc=c+dc;while(ok(nr,nc)){if(!add(nr,nc))break;nr+=dr;nc+=dc;}};
  const goldMoves=()=>{add(r+dir,c);add(r+dir,c-1);add(r+dir,c+1);add(r,c-1);add(r,c+1);add(r-dir,c);};

  if(promoted&&type!=='bishop'&&type!=='rook'){goldMoves();return moves;}

  switch(type){
    case 'pawn': add(r+dir,c); break;
    case 'lance': slide(dir,0); break;
    case 'knight': add(r+2*dir,c-1); add(r+2*dir,c+1); break;
    case 'silver':
      add(r+dir,c);add(r+dir,c-1);add(r+dir,c+1);
      add(r-dir,c-1);add(r-dir,c+1); break;
    case 'gold': goldMoves(); break;
    case 'king':
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) if(dr||dc) add(r+dr,c+dc);
      break;
    case 'bishop':
      slide(-1,-1);slide(-1,1);slide(1,-1);slide(1,1);
      if(promoted){add(r-1,c);add(r+1,c);add(r,c-1);add(r,c+1);}
      break;
    case 'rook':
      slide(-1,0);slide(1,0);slide(0,-1);slide(0,1);
      if(promoted){add(r-1,c-1);add(r-1,c+1);add(r+1,c-1);add(r+1,c+1);}
      break;
  }
  return moves;
}

function isAttacked(board,tr,tc,bySide){
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    const p=board[r][c];
    if(!p||p.side!==bySide) continue;
    if(getPseudoMoves(board,r,c).some(([mr,mc])=>mr===tr&&mc===tc)) return true;
  }
  return false;
}

function findKing(board,side){
  for(let r=0;r<9;r++) for(let c=0;c<9;c++)
    if(board[r][c]?.type==='king'&&board[r][c]?.side===side) return [r,c];
  return null;
}

function isInCheck(board,side){
  const k=findKing(board,side);
  if(!k) return false;
  return isAttacked(board,k[0],k[1],side==='black'?'white':'black');
}

function getLegalPieceMoves(board,r,c){
  const p=board[r][c]; if(!p) return [];
  return getPseudoMoves(board,r,c).filter(([tr,tc])=>{
    const nb=boardClone(board);
    nb[tr][tc]={...nb[r][c]};
    nb[r][c]=null;
    return !isInCheck(nb,p.side);
  });
}

function canPromote(piece,fromRow,toRow){
  if(piece.promoted||piece.type==='gold'||piece.type==='king') return false;
  const z=piece.side==='black'?[0,1,2]:[6,7,8];
  return z.includes(toRow)||z.includes(fromRow);
}

function mustPromote(piece,toRow){
  if(piece.promoted) return false;
  if(piece.side==='black'){
    if((piece.type==='pawn'||piece.type==='lance')&&toRow===0) return true;
    if(piece.type==='knight'&&toRow<=1) return true;
  } else {
    if((piece.type==='pawn'||piece.type==='lance')&&toRow===8) return true;
    if(piece.type==='knight'&&toRow>=7) return true;
  }
  return false;
}

// Simplified checkmate (used inside drop validation to avoid infinite recursion)
function isCheckmateSimple(board,hands,side){
  if(!isInCheck(board,side)) return false;
  for(let r=0;r<9;r++) for(let c=0;c<9;c++)
    if(board[r][c]?.side===side&&getLegalPieceMoves(board,r,c).length>0) return false;
  // Check drops (skip pawn-drop-checkmate inner check)
  for(const type of PIECE_TYPES){
    if(!(hands[side]?.[type])) continue;
    const drops=getDropSquaresRaw(board,hands,side,type,true);
    if(drops.length>0) return false;
  }
  return true;
}

function getDropSquaresRaw(board,hands,side,type,skipFumizume){
  if(!(hands[side]?.[type])) return [];
  const result=[];
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    if(board[r][c]) continue;
    if((type==='pawn'||type==='lance')&&((side==='black'&&r===0)||(side==='white'&&r===8))) continue;
    if(type==='knight'&&((side==='black'&&r<=1)||(side==='white'&&r>=7))) continue;
    if(type==='pawn'){
      let has2=false;
      for(let pr=0;pr<9;pr++){const pp=board[pr][c];if(pp&&pp.type==='pawn'&&pp.side===side&&!pp.promoted){has2=true;break;}}
      if(has2) continue;
      if(!skipFumizume){
        const nb=boardClone(board);
        nb[r][c]={type:'pawn',side,promoted:false};
        const opp=side==='black'?'white':'black';
        if(isCheckmateSimple(nb,hands,opp)) continue;
      }
    }
    const nb=boardClone(board);
    nb[r][c]={type,side,promoted:false};
    if(!isInCheck(nb,side)) result.push([r,c]);
  }
  return result;
}

function getDropSquares(board,hands,side,type){
  return getDropSquaresRaw(board,hands,side,type,false);
}

function isCheckmate(board,hands,side){
  if(!isInCheck(board,side)) return false;
  for(let r=0;r<9;r++) for(let c=0;c<9;c++)
    if(board[r][c]?.side===side&&getLegalPieceMoves(board,r,c).length>0) return false;
  for(const type of PIECE_TYPES){
    if(!(hands[side]?.[type])) continue;
    if(getDropSquares(board,hands,side,type).length>0) return false;
  }
  return true;
}

function isStalemate(board,hands,side){
  if(isInCheck(board,side)) return false;
  for(let r=0;r<9;r++) for(let c=0;c<9;c++)
    if(board[r][c]?.side===side&&getLegalPieceMoves(board,r,c).length>0) return false;
  for(const type of PIECE_TYPES){
    if(!(hands[side]?.[type])) continue;
    if(getDropSquares(board,hands,side,type).length>0) return false;
  }
  return true;
}

function getAllLegalMoves(board,hands,side){
  const moves=[];
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    const p=board[r][c];
    if(!p||p.side!==side) continue;
    for(const [tr,tc] of getLegalPieceMoves(board,r,c)){
      const mp=mustPromote(p,tr), cp=canPromote(p,r,tr);
      if(mp) moves.push({type:'move',fr:r,fc:c,tr,tc,promote:true});
      else if(cp){
        moves.push({type:'move',fr:r,fc:c,tr,tc,promote:true});
        moves.push({type:'move',fr:r,fc:c,tr,tc,promote:false});
      } else moves.push({type:'move',fr:r,fc:c,tr,tc,promote:false});
    }
  }
  for(const type of PIECE_TYPES){
    if(!(hands[side]?.[type])) continue;
    for(const [tr,tc] of getDropSquares(board,hands,side,type))
      moves.push({type:'drop',side,dropType:type,tr,tc});
  }
  return moves;
}

function applyMoveObj(board,hands,move){
  const nb=boardClone(board), nh=handsClone(hands);
  if(move.type==='move'){
    const {fr,fc,tr,tc,promote}=move;
    const piece=nb[fr][fc], captured=nb[tr][tc];
    if(captured) nh[piece.side][captured.type]=(nh[piece.side][captured.type]||0)+1;
    nb[tr][tc]={...piece,promoted:piece.promoted||promote};
    nb[fr][fc]=null;
  } else {
    const {side,dropType,tr,tc}=move;
    nb[tr][tc]={type:dropType,side,promoted:false};
    nh[side][dropType]--;
    if(!nh[side][dropType]) delete nh[side][dropType];
  }
  return {board:nb,hands:nh};
}

// ══════════════════════════════════════
//  AI ENGINE
// ══════════════════════════════════════

function pVal(piece){
  if(!piece) return 0;
  if(piece.promoted){
    if(piece.type==='rook') return 1400;
    if(piece.type==='bishop') return 1200;
    return 600;
  }
  return PIECE_VAL[piece.type]||0;
}

function evaluate(board,hands,aiSide){
  let score=0;
  const pSide=aiSide==='black'?'white':'black';
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    const p=board[r][c]; if(!p) continue;
    score+=(p.side===aiSide?1:-1)*pVal(p);
  }
  for(const[t,n]of Object.entries(hands[aiSide]||{})) score+=(PIECE_VAL[t]||0)*(n||0)*0.9;
  for(const[t,n]of Object.entries(hands[pSide]||{})) score-=(PIECE_VAL[t]||0)*(n||0)*0.9;
  return score;
}

function minimax(board,hands,depth,alpha,beta,isMax,aiSide){
  const side=isMax?aiSide:(aiSide==='black'?'white':'black');
  if(depth===0) return evaluate(board,hands,aiSide);
  const moves=getAllLegalMoves(board,hands,side);
  if(!moves.length) return isMax?-90000:90000;
  moves.sort((a,b)=>{
    const av=a.type==='move'&&board[a.tr]?.[a.tc]?pVal(board[a.tr][a.tc]):0;
    const bv=b.type==='move'&&board[b.tr]?.[b.tc]?pVal(board[b.tr][b.tc]):0;
    return bv-av;
  });
  if(isMax){
    let val=-Infinity;
    for(const m of moves){
      const{board:nb,hands:nh}=applyMoveObj(board,hands,m);
      val=Math.max(val,minimax(nb,nh,depth-1,alpha,beta,false,aiSide));
      alpha=Math.max(alpha,val);
      if(alpha>=beta) break;
    }
    return val;
  } else {
    let val=Infinity;
    for(const m of moves){
      const{board:nb,hands:nh}=applyMoveObj(board,hands,m);
      val=Math.min(val,minimax(nb,nh,depth-1,alpha,beta,true,aiSide));
      beta=Math.min(beta,val);
      if(alpha>=beta) break;
    }
    return val;
  }
}

function computeBestMove(board,hands,side,diff){
  const moves=getAllLegalMoves(board,hands,side);
  if(!moves.length) return null;
  if(diff==='최하') return moves[Math.floor(Math.random()*moves.length)];
  if(diff==='하'){
    let best=null,bestV=-Infinity;
    for(const m of moves){
      if(m.type==='move'&&board[m.tr]?.[m.tc]){const v=pVal(board[m.tr][m.tc]);if(v>bestV){bestV=v;best=m;}}
    }
    if(best) return best;
    return moves[Math.floor(Math.random()*moves.length)];
  }
  const depth={'중':2,'상':3,'최상':4}[diff]||2;
  moves.sort((a,b)=>{
    const av=a.type==='move'&&board[a.tr]?.[a.tc]?pVal(board[a.tr][a.tc]):0;
    const bv=b.type==='move'&&board[b.tr]?.[b.tc]?pVal(board[b.tr][b.tc]):0;
    return bv-av;
  });
  let bestM=null,bestV=-Infinity;
  for(const m of moves){
    const{board:nb,hands:nh}=applyMoveObj(board,hands,m);
    const v=minimax(nb,nh,depth-1,-Infinity,Infinity,false,side);
    if(v>bestV){bestV=v;bestM=m;}
  }
  return bestM;
}

const GS={
  board:null,hands:null,turn:'black',
  selected:null,legalTargets:[],
  diff:'중',gameOver:false,
  lastMove:null,pendingPromo:null,
  tutIdx:0,quizIdx:0,

function goMenu(){showScreen('s-menu');}
function openDiff(){showScreen('s-diff');}

function startGame(diff){
  GS.diff=diff;
  GS.board=createInitialBoard();
  GS.hands={black:{},white:{}};
  GS.turn='black';
  GS.selected=null; GS.legalTargets=[];
  GS.gameOver=false; GS.lastMove=null; GS.pendingPromo=null;
  document.getElementById('gameover-dialog').classList.add('hidden');
  document.getElementById('promo-dialog').classList.add('hidden');
  document.getElementById('move-history').innerHTML='';
  document.getElementById('ai-diff-label').textContent='난이도: '+diff;
  showScreen('s-game');
  renderBoard(); renderHands();
  updateStatus('선수(●) 차례입니다');
}

function newGameSame(){startGame(GS.diff);}

function resignGame(){
  if(GS.gameOver) return;
  showGameOver('기권했습니다. AI 승리!');
}

function showGameOver(msg){
  GS.gameOver=true;
  document.getElementById('gameover-msg').textContent=msg;
  document.getElementById('gameover-dialog').classList.remove('hidden');
}

// ── Click handling ──

function handleCellClick(r,c){
  if(GS.gameOver||GS.turn!=='black'||GS.pendingPromo) return;
  const piece=GS.board[r][c];
  if(GS.legalTargets.some(([tr,tc])=>tr===r&&tc===c)){doPlayerMove(r,c);return;}
  if(piece&&piece.side==='black'){
    GS.selected={fromBoard:{r,c}};
    GS.legalTargets=getLegalPieceMoves(GS.board,r,c);
    renderBoard(); return;
  }
  GS.selected=null; GS.legalTargets=[];
  renderBoard();
}

function handleHandClick(type){
  if(GS.gameOver||GS.turn!=='black'||GS.pendingPromo) return;
  GS.selected={fromHand:{type}};
  GS.legalTargets=getDropSquares(GS.board,GS.hands,'black',type);
  renderBoard(); renderHands();
}

function doPlayerMove(tr,tc){
  const sel=GS.selected;
  if(sel.fromHand){
    executeMove({type:'drop',side:'black',dropType:sel.fromHand.type,tr,tc});
  } else {
    const{r:fr,c:fc}=sel.fromBoard;
    const piece=GS.board[fr][fc];
    const mp=mustPromote(piece,tr), cp=canPromote(piece,fr,tr);
    if(mp) executeMove({type:'move',fr,fc,tr,tc,promote:true});
    else if(cp){GS.pendingPromo={fr,fc,tr,tc};document.getElementById('promo-dialog').classList.remove('hidden');}
    else executeMove({type:'move',fr,fc,tr,tc,promote:false});
  }
}

function confirmPromo(yes){
  if(!GS.pendingPromo) return;
  const{fr,fc,tr,tc}=GS.pendingPromo;
  GS.pendingPromo=null;
  document.getElementById('promo-dialog').classList.add('hidden');
  executeMove({type:'move',fr,fc,tr,tc,promote:yes});
}

function executeMove(move){
  GS.selected=null; GS.legalTargets=[];
  const{board,hands}=applyMoveObj(GS.board,GS.hands,move);
  GS.board=board; GS.hands=hands; GS.lastMove=move;
  const side=GS.turn;
  GS.turn=side==='black'?'white':'black';
  renderBoard(); renderHands();
  appendHistory(move,side);
  const opp=GS.turn;
  if(isCheckmate(GS.board,GS.hands,opp)){
    renderBoard();
    setTimeout(()=>showGameOver(`外通手(외통수)! ${opp==='black'?'AI 승리!':'플레이어 승리!'}`),200);
    return;
  }
  if(isStalemate(GS.board,GS.hands,opp)){
    setTimeout(()=>showGameOver('수가 없습니다 — 무승부'),200);return;
  }
  if(isInCheck(GS.board,opp)) updateStatus(`${opp==='black'?'선수':'후수'} 王手(왕수)!`);
  else updateStatus(`${opp==='black'?'선수(●) 차례':'AI(○) 생각 중...'}`);
  if(GS.turn==='white'&&!GS.gameOver){
    document.getElementById('think-overlay').classList.add('visible');
    setTimeout(doAiTurn,80);
  }
}

function doAiTurn(){
  if(GS.gameOver||GS.turn!=='white') return;
  const move=computeBestMove(GS.board,GS.hands,'white',GS.diff);
  document.getElementById('think-overlay').classList.remove('visible');
  if(!move){showGameOver('AI 수 없음 — 플레이어 승리!');return;}
  const{board,hands}=applyMoveObj(GS.board,GS.hands,move);
  GS.board=board; GS.hands=hands; GS.lastMove=move;
  GS.turn='black';
  renderBoard(); renderHands();
  appendHistory(move,'white');
  if(isCheckmate(GS.board,GS.hands,'black')){
    renderBoard();
    setTimeout(()=>showGameOver('外通手(외통수)! AI 승리!'),200);return;
  }
  if(isStalemate(GS.board,GS.hands,'black')){
    setTimeout(()=>showGameOver('수가 없습니다 — 무승부'),200);return;
  }
  if(isInCheck(GS.board,'black')) updateStatus('선수(●) 王手(왕수)! 피하세요!');
  else updateStatus('선수(●) 차례입니다');
}

function getPieceImg(piece){
  const s=piece.side;
  let n;
  if(piece.promoted){
    switch(piece.type){
      case 'rook':n='dragon';break; case 'bishop':n='horse';break;
      case 'silver':n='prom_silver';break; case 'knight':n='prom_knight';break;
      case 'lance':n='prom_lance';break; case 'pawn':n='prom_pawn';break;
      default:n=piece.type;
    }
  } else n=piece.type;
  return `img/${s}_${n}.png`;
}

function buildBoardEl(el,board,legalTargets,selected,lastMove,clickFn){
  el.innerHTML='';
  // Column header
  const hdr=document.createElement('div');
  hdr.className='board-col-header';
  hdr.innerHTML='<div class="lbl-corner"></div>';
  for(let c=0;c<9;c++) hdr.innerHTML+=`<div class="col-lbl">${9-c}</div>`;
  el.appendChild(hdr);
  const ht=legalTargets||[];
  const sp=selected?.fromBoard;
  const lm=lastMove;
  for(let r=0;r<9;r++){
    const rowEl=document.createElement('div');
    rowEl.className='board-row';
    const rl=document.createElement('div');
    rl.className='row-lbl';
    rl.textContent='abcdefghi'[r];
    rowEl.appendChild(rl);
    for(let c=0;c<9;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      const piece=board[r][c];
      const isT=ht.some(([tr,tc])=>tr===r&&tc===c);
      const isSel=sp&&sp.r===r&&sp.c===c;
      const isLM=lm&&((lm.type==='move'&&((lm.fr===r&&lm.fc===c)||(lm.tr===r&&lm.tc===c)))||(lm.type==='drop'&&lm.tr===r&&lm.tc===c));
      const isChk=piece?.type==='king'&&isInCheck(board,piece.side);
      if(isSel) cell.classList.add('sel');
      else if(isChk) cell.classList.add('incheck');
      else if(isLM) cell.classList.add('lastmove');
      if(isT){
        const dot=document.createElement('div');
        dot.className=piece?'target-cap':'target-dot';
        cell.appendChild(dot);
      }
      if(piece){
        const img=document.createElement('img');
        img.src=getPieceImg(piece); img.className='piece-img';
        img.alt=PIECE_KR[piece.type]||piece.type;
        cell.appendChild(img);
      }
      if(clickFn) cell.addEventListener('click',()=>clickFn(r,c));
      rowEl.appendChild(cell);
    }
    el.appendChild(rowEl);
  }
}

function renderBoard(){
  buildBoardEl(
    document.getElementById('board'),
    GS.board, GS.legalTargets, GS.selected, GS.lastMove,
    handleCellClick
  );
}

function renderHands(){
  renderHandEl('white-hand','white',false);
  renderHandEl('black-hand','black',true);
}

function renderHandEl(elId,side,clickable){
  const el=document.getElementById(elId);
  el.innerHTML=`<div class="hand-label">${side==='black'?'나의 포획말 (손패)':'AI 포획말'}</div>`;
  const h=GS.hands[side]||{};
  const selH=GS.selected?.fromHand;
  let any=false;
  for(const type of PIECE_TYPES){
    const cnt=h[type]||0; if(!cnt) continue;
    any=true;
    const pd=document.createElement('div');
    pd.className='hand-piece';
    if(selH&&selH.type===type&&side==='black') pd.classList.add('hand-sel');
    const img=document.createElement('img');
    img.src=getPieceImg({type,side,promoted:false}); img.className='piece-img';
    pd.appendChild(img);
    if(cnt>1){const b=document.createElement('span');b.className='hand-cnt';b.textContent=cnt;pd.appendChild(b);}
    if(clickable) pd.addEventListener('click',()=>handleHandClick(type));
    el.appendChild(pd);
  }
  if(!any) el.innerHTML+=`<span class="empty-hand">없음</span>`;
}

function updateStatus(msg){
  const el=document.getElementById('game-status');
  if(el) el.textContent=msg;
}

function appendHistory(move,side){
  const el=document.getElementById('move-history');
  if(!el) return;
  const div=document.createElement('div');
  div.className=`hist-entry ${side}`;
  let t=side==='black'?'● ':'○ ';
  if(move.type==='move') t+=`(${move.fr+1},${move.fc+1})→(${move.tr+1},${move.tc+1})${move.promote?' 成':''}`;
  else t+=`${PIECE_JP[move.dropType]}打→(${move.tr+1},${move.tc+1})`;
  div.textContent=t; el.appendChild(div);
  el.scrollTop=el.scrollHeight;
}

function makePieceDiagram(type,side){
  const b9=Array.from({length:9},()=>Array(9).fill(null));
  b9[4][4]={type,side,promoted:false};
  const m9=getPseudoMoves(b9,4,4);
  const filt=m9.filter(([r,c])=>r>=2&&r<=6&&c>=2&&c<=6).map(([r,c])=>[r-2,c-2]);
  let h=`<div class="mini-board">`;
  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){
      const isCtr=r===2&&c===2;
      const isMv=filt.some(([mr,mc])=>mr===r&&mc===c);
      const cls='mini-cell'+(isCtr?' mini-piece':isMv?' mini-target':'');
      h+=`<div class="${cls}">`;
      if(isCtr) h+=`<img src="img/${side}_${type}.png" class="mini-img" alt="${type}">`;
      else if(isMv) h+=`<div class="mini-dot"></div>`;
      h+=`</div>`;
    }
  }
  h+=`</div>`;
  return h;
}

function mkBoard(pieces){
  const b=Array.from({length:9},()=>Array(9).fill(null));
  for(const[r,c,type,side,prom]of pieces) b[r][c]={type,side:side||'black',promoted:!!prom};
  return b;
}

let QB={board:null,hands:null,turn:'black',sel:null,targets:[],stepIdx:0,solved:false};

function openQuiz(){
  GS.quizIdx=0;
  showScreen('s-quiz');
  renderQuiz();
}

function renderQuiz(){
  const p=QUIZ_PROBLEMS[GS.quizIdx];
  document.getElementById('quiz-title').textContent=p.title;
  document.getElementById('quiz-desc').textContent=p.desc;
  document.getElementById('quiz-counter').textContent=`${GS.quizIdx+1} / ${QUIZ_PROBLEMS.length}`;
  document.getElementById('quiz-prev-btn').disabled=GS.quizIdx===0;
  document.getElementById('quiz-next-btn').disabled=GS.quizIdx===QUIZ_PROBLEMS.length-1;
  QB={board:boardClone(p.board),hands:handsClone(p.hands),turn:p.turn,sel:null,targets:[],stepIdx:0,solved:false};
  renderQuizBoard();
  renderQuizHand();
  document.getElementById('quiz-status').innerHTML=`<span class="hint">💡 힌트: ${p.hint}</span>`;
}

function renderQuizBoard(){
  const p=QUIZ_PROBLEMS[GS.quizIdx];
  buildBoardEl(
    document.getElementById('quiz-board'),
    QB.board, QB.targets, QB.sel, null,
    handleQuizCellClick
  );
}

function renderQuizHand(){
  const old=document.getElementById('quiz-hand');
  if(old) old.remove();
  const hEl=document.createElement('div');
  hEl.id='quiz-hand'; hEl.className='hand-area';
  hEl.innerHTML='<div class="hand-label">손패 (선수)</div>';
  const h=QB.hands.black||{};
  let any=false;
  for(const type of PIECE_TYPES){
    const cnt=h[type]||0; if(!cnt) continue; any=true;
    const pd=document.createElement('div'); pd.className='hand-piece';
    if(QB.sel?.fromHand?.type===type) pd.classList.add('hand-sel');
    const img=document.createElement('img');
    img.src=getPieceImg({type,side:'black',promoted:false}); img.className='piece-img';
    pd.appendChild(img);
    if(cnt>1){const b=document.createElement('span');b.className='hand-cnt';b.textContent=cnt;pd.appendChild(b);}
    pd.addEventListener('click',()=>handleQuizHandClick(type));
    hEl.appendChild(pd);
  }
  if(!any) hEl.innerHTML+=`<span class="empty-hand">없음</span>`;
  document.getElementById('quiz-board-area').appendChild(hEl);
}

function handleQuizCellClick(r,c){
  if(QB.solved||QB.turn!=='black') return;
  const piece=QB.board[r][c];
  if(QB.targets.some(([tr,tc])=>tr===r&&tc===c)){
    let move;
    if(QB.sel.fromHand){
      move={type:'drop',side:'black',dropType:QB.sel.fromHand.type,tr:r,tc:c};
    } else {
      const{r:fr,c:fc}=QB.sel.fromBoard;
      const p=QB.board[fr][fc];
      const promote=canPromote(p,fr,r)&&!mustPromote(p,r)?false:mustPromote(p,r);
      move={type:'move',fr,fc,tr:r,tc:c,promote};
    }
    processQuizMove(move); return;
  }
  if(piece&&piece.side==='black'){
    QB.sel={fromBoard:{r,c}}; QB.targets=getLegalPieceMoves(QB.board,r,c);
    renderQuizBoard(); return;
  }
  QB.sel=null; QB.targets=[]; renderQuizBoard();
}

function handleQuizHandClick(type){
  if(QB.solved||QB.turn!=='black') return;
  QB.sel={fromHand:{type}};
  QB.targets=getDropSquares(QB.board,QB.hands,'black',type);
  renderQuizBoard(); renderQuizHand();
}

function movesMatch(m1,m2){
  if(m1.type!==m2.type) return false;
  if(m1.type==='move') return m1.fr===m2.fr&&m1.fc===m2.fc&&m1.tr===m2.tr&&m1.tc===m2.tc;
  if(m1.type==='drop') return m1.dropType===m2.dropType&&m1.tr===m2.tr&&m1.tc===m2.tc;
  return false;
}

function processQuizMove(move){
  const p=QUIZ_PROBLEMS[GS.quizIdx];
  const expected=p.solution[QB.stepIdx];
  if(!movesMatch(move,expected)){
    document.getElementById('quiz-status').innerHTML=`<span class="wrong">❌ 틀렸습니다. 다시 시도하세요.</span><br><span class="hint">💡 힌트: ${p.hint}</span>`;
    QB.sel=null; QB.targets=[]; renderQuizBoard(); renderQuizHand(); return;
  }
  const{board:nb,hands:nh}=applyMoveObj(QB.board,QB.hands,move);
  QB.board=nb; QB.hands=nh; QB.stepIdx++; QB.turn=QB.turn==='black'?'white':'black';
  QB.sel=null; QB.targets=[];
  renderQuizBoard(); renderQuizHand();
  checkQuizProgress();
}

function checkQuizProgress(){
  const p=QUIZ_PROBLEMS[GS.quizIdx];
  if(QB.stepIdx>=p.solution.length){
    QB.solved=true;
    document.getElementById('quiz-status').innerHTML=
      `<span class="correct">✅ 정답! 외통수 성공!</span><br><p class="explain">${p.explain}</p>`;
    return;
  }
  if(QB.turn==='white'){
    document.getElementById('quiz-status').innerHTML=`<span class="correct">정답! AI가 응수합니다...</span>`;
    setTimeout(()=>{
      const opp=p.solution[QB.stepIdx];
      const{board:nb,hands:nh}=applyMoveObj(QB.board,QB.hands,opp);
      QB.board=nb; QB.hands=nh; QB.stepIdx++; QB.turn='black';
      renderQuizBoard(); renderQuizHand();
      checkQuizProgress();
    },700);
  } else {
    document.getElementById('quiz-status').innerHTML=`<span class="correct">정답! 계속하세요...</span>`;
  }
}

function quizPrev(){if(GS.quizIdx>0){GS.quizIdx--;renderQuiz();}}
function quizNext(){if(GS.quizIdx<QUIZ_PROBLEMS.length-1){GS.quizIdx++;renderQuiz();}}
