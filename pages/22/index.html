<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코드의 세계</title>
<style>
:root {
  --bg: #080c10; --surf: #0e1318; --surf2: #131920; --bdr: #1a2028;
  --text: #c8c0b0; --dim: #556070; --bright: #e8e0d0;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, 'Malgun Gothic', sans-serif; }
#app { display: flex; flex-direction: column; height: 100%; }

/* ── 상단 고정 ── */
#top { flex-shrink: 0; background: var(--surf); border-bottom: 1px solid var(--bdr); }
#search-row {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  border-bottom: 1px solid var(--bdr);
}
#search-wrap {
  flex: 1; display: flex; align-items: center; gap: 7px;
  background: var(--surf2); border: 1px solid var(--bdr);
  border-radius: 9px; padding: 7px 12px;
}
#search-wrap svg { opacity: .4; flex-shrink: 0; }
#sq {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 13px; font-family: inherit;
}
#sq::placeholder { color: var(--dim); }
#count { font-size: 11px; color: var(--dim); white-space: nowrap; font-family: monospace; }

/* ── 카테고리 필터 ── */
#cat-bar {
  display: flex; gap: 6px; padding: 8px 14px;
  overflow-x: auto; scrollbar-width: none;
}
#cat-bar::-webkit-scrollbar { display: none; }
.cchip {
  flex-shrink: 0; padding: 4px 12px; border-radius: 20px; font-size: 11px;
  border: 1px solid var(--bdr); background: transparent; color: var(--dim);
  cursor: pointer; transition: .15s; font-family: inherit;
}
.cchip:hover { color: var(--text); }
.cchip.on { color: #fff; }

/* ── 스크롤 본문 ── */
#content { flex: 1; overflow-y: auto; padding: 16px 14px 30px; }

/* ── 카테고리 섹션 ── */
.sec { margin-bottom: 24px; }
.sec.hide { display: none; }
.sec-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; padding-bottom: 8px;
  border-bottom: 1px solid var(--bdr);
}
.sec-icon { font-size: 18px; }
.sec-label { font-size: 14px; font-weight: 700; }
.sec-cnt { font-size: 11px; color: var(--dim); margin-left: auto; }

/* ── 카드 그리드 ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}
.card {
  background: var(--surf); border: 1px solid var(--bdr);
  border-radius: 10px; padding: 12px 14px;
  border-left: 3px solid var(--accent, #556070);
  transition: transform .15s, box-shadow .15s;
  cursor: default;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.4); }
.card.hide { display: none; }

.card-top { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.card-badge {
  font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
  color: #000; background: var(--accent, #556070); white-space: nowrap;
  letter-spacing: .3px;
}
.card-name { font-size: 14px; font-weight: 700; color: var(--bright); }
.card-desc { font-size: 11px; color: var(--dim); line-height: 1.5; margin-bottom: 6px; }
.card-use {
  display: inline-block; font-size: 10px; color: var(--accent, #556070);
  background: color-mix(in srgb, var(--accent, #556070) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent, #556070) 30%, transparent);
  border-radius: 4px; padding: 2px 7px;
}

/* ── 빈 결과 ── */
#empty { display: none; text-align: center; padding: 60px 20px; color: var(--dim); }
#empty .e-icon { font-size: 40px; display: block; margin-bottom: 12px; }
</style>
</head>
<body>

  <div id="top">
    <div id="search-row">

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"

  btn.textContent = `${c.icon} ${c.label}`;
  btn.style.setProperty('--ac', c.color);
  catBar.appendChild(btn);
});

  sec.className = 'sec';
  sec.dataset.cat = c.id;

  const head = document.createElement('div');
  head.className = 'sec-head';
  head.style.color = c.color;
  head.innerHTML =
    `<span class="sec-icon">${c.icon}</span>` +
    `<span class="sec-label">${c.label}</span>` +
    `<span class="sec-cnt" id="cnt-${c.id}">${c.items.length}개</span>`;

  const grid = document.createElement('div');
  grid.className = 'grid';

  c.items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--accent', c.color);
    card.dataset.search = (item.name + ' ' + item.desc + ' ' + item.use + ' ' + item.badge).toLowerCase();
    card.innerHTML =
      `<div class="card-top">` +
        `<span class="card-badge">${item.badge}</span>` +
        `<span class="card-name">${item.name}</span>` +
      `</div>` +
      `<div class="card-desc">${item.desc}</div>` +
      `<span class="card-use">${item.use}</span>`;
    grid.appendChild(card);
  });

  sec.appendChild(head);
  sec.appendChild(grid);
  sections.appendChild(sec);
});

function update() {
  const keyword = sq.value.trim().toLowerCase();
  totalVisible = 0;

  document.querySelectorAll('.sec').forEach(sec => {
    const catMatch = activeCat === 'all' || sec.dataset.cat === activeCat;
    if (!catMatch) { sec.classList.add('hide'); return; }
    sec.classList.remove('hide');

    const cards = sec.querySelectorAll('.card');
    let visible = 0;
    cards.forEach(card => {
      const match = !keyword || card.dataset.search.includes(keyword);
      card.classList.toggle('hide', !match);
      if (match) visible++;
    });

    const cntEl = document.getElementById('cnt-' + sec.dataset.cat);
    if (cntEl) cntEl.textContent = visible + '개';
    if (visible === 0) sec.classList.add('hide');
    totalVisible += visible;
  });

  countEl.textContent = totalVisible + '개';
  emptyEl.style.display = totalVisible === 0 ? 'block' : 'none';
}

// 칩 클릭
catBar.addEventListener('click', e => {
  const btn = e.target.closest('.cchip');
  if (!btn) return;
  activeCat = btn.dataset.cat;
  document.querySelectorAll('.cchip').forEach(b => {
    const isOn = b.dataset.cat === activeCat;
    b.classList.toggle('on', isOn);
    if (isOn) {
      const cat = CATS.find(c => c.id === activeCat);
      b.style.background = cat ? cat.color : '';
      b.style.borderColor = cat ? cat.color : '';
      b.style.color = cat ? '#000' : '';
    } else {
      b.style.background = '';
      b.style.borderColor = '';
      b.style.color = '';
    }
  });
  // 전체 칩은 별도 처리
  const allChip = document.querySelector('.cchip[data-cat="all"]');
  if (activeCat === 'all') {
    allChip.style.background = '#fff';
    allChip.style.borderColor = '#fff';
    allChip.style.color = '#000';
  } else {
    allChip.style.background = '';
    allChip.style.borderColor = '';
    allChip.style.color = '';
  }
  update();
});

sq.addEventListener('input', update);

// 초기 전체 칩 스타일
const allChip = document.querySelector('.cchip[data-cat="all"]');
allChip.style.background = '#fff';
allChip.style.borderColor = '#fff';
allChip.style.color = '#000';

update();
</script>
</body>
</html>
